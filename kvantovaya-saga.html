<title>Квантовая сага</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: окна JRPG-меню. Сверху статус героини (HP, XP, золото), слева свиток дня с клятвами и делами, справа героиня, добыча, квесты и босс. Светлая тема: пергамент, тёмная: ночное подземелье. */
:root{
  --bg:#ece2cc; --panel:#fbf6ea; --ink:#2b2236; --muted:#6a5f74; --line:#d6c7aa; --frame:#2b2236; --shadow:#c9b994;
  --acc:#5b34b8; --on-acc:#ffffff; --gold:#9a6200; --gold-soft:#f5e3b6; --hp:#c42a35; --hp-soft:#f6d8d4; --ok:#24703f; --ok-soft:#dbeedd; --xp:#2c5fd0;
  --s-int:#2c5fd0; --s-str:#c42a35; --s-agi:#24804a; --s-vit:#bf600a; --s-wil:#7340c4; --s-cha:#b8317a; --s-cre:#0f7c83; --s-cur:#8c6a00;
  --display:"Press Start 2P","Courier New",monospace;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1229; --panel:#1a1f48; --ink:#eef0ff; --muted:#a9addb; --line:#353d7c; --frame:#e6e8ff; --shadow:#070818;
  --acc:#b09aff; --on-acc:#14163a; --gold:#ffd166; --gold-soft:#3b3522; --hp:#ff6b75; --hp-soft:#46233b; --ok:#7fe0a2; --ok-soft:#1d3d3a; --xp:#82b2ff;
  --s-int:#82b2ff; --s-str:#ff7c84; --s-agi:#72dd97; --s-vit:#ffae60; --s-wil:#c6a3ff; --s-cha:#ff8fca; --s-cre:#62d8de; --s-cur:#ffd166; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1229; --panel:#1a1f48; --ink:#eef0ff; --muted:#a9addb; --line:#353d7c; --frame:#e6e8ff; --shadow:#070818;
  --acc:#b09aff; --on-acc:#14163a; --gold:#ffd166; --gold-soft:#3b3522; --hp:#ff6b75; --hp-soft:#46233b; --ok:#7fe0a2; --ok-soft:#1d3d3a; --xp:#82b2ff;
  --s-int:#82b2ff; --s-str:#ff7c84; --s-agi:#72dd97; --s-vit:#ffae60; --s-wil:#c6a3ff; --s-cha:#ff8fca; --s-cre:#62d8de; --s-cur:#ffd166; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px;color:var(--ink);font:400 15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:400}
.px{font-family:var(--display);line-height:1.55;letter-spacing:0}
.wrap{max-width:1120px;margin:0 auto}
.win{background:var(--panel);border:3px solid var(--frame);border-radius:9px;box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 5px var(--line),4px 4px 0 var(--shadow)}
.pad{padding:16px 18px}
.h{font:400 12px/1.5 var(--display)}
.small{font-size:13px;color:var(--muted)}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 0;margin-inline:-4px;padding-inline:4px;border-bottom:3px solid var(--frame)}
.toprow{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:center}
.brand{font:400 12px/1.6 var(--display);color:var(--acc)}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.who b{display:block;font:600 14px/1.2 var(--body)}
.who small{color:var(--muted);font-size:12.5px}
.bars{flex:1 1 260px;display:grid;gap:6px;min-width:0}
.barrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center}
.barrow .lab{font-size:9px}
.barrow .num{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.bar{height:12px;background:var(--bg);border:2px solid var(--frame);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--xp));transition:width .35s}
.bar.hp i{background:var(--hp)}
.bar.sm{height:8px;border-width:1.5px}
.stats{display:flex;gap:18px}
.stat{line-height:1.1}
.stat b{display:block;font:400 16px/1.4 var(--display)}
.stat small{color:var(--muted);font-size:11.5px}
.gold{color:var(--gold)}.hpc{color:var(--hp)}
.tabrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.tabs{display:flex;gap:2px;flex:1;min-width:0;align-self:flex-end;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;padding:8px 12px;font-weight:600;font-size:14px;color:var(--muted);border-radius:7px 7px 0 0;white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{background:var(--frame);color:var(--bg)}
.tab[aria-selected="true"]::before{content:"▶ ";font-size:10px}
.themebtn{flex:none;width:40px;height:40px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--ink);border:2px solid var(--frame);border-radius:7px;padding:0}
/* sprite */
.sprite{display:block;image-rendering:pixelated;flex:none}
.sprite.mini{width:34px;height:auto}
.sprite.big{width:76px;height:auto}
.sprite.huge{width:150px;max-width:100%;height:auto}
/* layout */
.today{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px 22px;margin-top:16px;align-items:start}
.dayhead{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.mainc,.side{display:grid;gap:16px;min-width:0}
@media (max-width:860px){.today{grid-template-columns:minmax(0,1fr)}.top{position:static}}
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;background:var(--panel);border:2px solid var(--frame);border-radius:7px;font-weight:700;font-size:17px;line-height:1}
.iconbtn:disabled{opacity:.3;cursor:default}
.daytitle{font:400 12px/1.5 var(--display);min-width:0}
.todaybtn{background:none;border:0;color:var(--acc);font-weight:600;text-decoration:underline;padding:8px 4px}
.seg{display:inline-flex;border:2px solid var(--frame);border-radius:7px;overflow:hidden;background:var(--panel);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:500;min-height:36px}
.seg button+button{border-left:2px solid var(--frame)}
.seg button[aria-pressed="true"]{background:var(--frame);color:var(--bg)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.alert{background:var(--hp-soft);border:2px solid var(--hp);border-radius:7px;padding:9px 12px;font-size:14px}
.alert.calm{background:var(--ok-soft);border-color:var(--ok)}
.tophead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
/* oaths */
.oathlist{list-style:none;margin:10px 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.oathlist li{display:flex;gap:9px;align-items:center;border:2px dashed var(--line);border-radius:7px;padding:7px 9px}
.oathlist li.done{border-style:solid;border-color:var(--ok);background:var(--ok-soft)}
.oathlist b{display:block;font-size:14px}
.oathlist small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.gem{flex:none;width:24px;height:24px;transform:rotate(45deg);border:2px solid var(--frame);border-radius:3px;display:flex;align-items:center;justify-content:center}
.gem span{transform:rotate(-45deg);font-weight:700;font-size:13px}
.done .gem{background:var(--ok);border-color:var(--ok);color:var(--panel)}
/* actions */
.blocks{display:grid;gap:16px}
.block{overflow:hidden}
.ghead{padding:10px 16px;border-bottom:2px solid var(--line)}
.ghead.bad .h{color:var(--hp)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:9px 14px 9px 16px;min-height:62px}
.row:last-child{border-bottom:0}
.row.off{opacity:.55}
.rname{min-width:0}
.rname b{font-weight:600;display:block}
.rname small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{--c:var(--muted);font:700 11px/1.6 var(--mono);border:1.5px solid var(--c);color:var(--c);border-radius:4px;padding:0 5px;white-space:nowrap}
.chip.hp{--c:var(--hp)}
.chip.gd{--c:var(--gold)}
.chips.big .chip{font-size:12.5px;padding:2px 7px}
.ctl{display:flex;align-items:center;gap:4px}
.ctl output{min-width:30px;text-align:center;font:400 13px var(--display)}
.step{width:40px;height:40px;background:none;border:2px solid var(--frame);border-radius:7px;font-size:19px;font-weight:700;line-height:1}
.step.plus{background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
.step:disabled{opacity:.3;cursor:default}
.step:not(:disabled):active{transform:scale(.94)}
.tick{width:44px;height:44px;background:none;border:2px solid var(--frame);border-radius:7px;font-weight:700;font-size:20px;padding:0}
.tick[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tick.badt[aria-pressed="true"]{background:var(--hp);border-color:var(--hp);color:var(--panel)}
.row.choice{grid-template-columns:minmax(0,1fr)}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:2px solid var(--frame);background:none;border-radius:7px;padding:6px 10px;font-size:13.5px;font-weight:500;min-height:42px;display:grid;gap:3px;text-align:left}
.opt .chips{margin:0}
.opt[aria-pressed="true"]{background:var(--frame);color:var(--bg)}
.opt[aria-pressed="true"] .chip{--c:var(--bg)}
/* side */
.hc{display:flex;gap:14px;align-items:center}
.mini8{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin:12px 0 8px}
.m8{display:grid;grid-template-columns:34px minmax(0,1fr) 22px;gap:6px;align-items:center}
.m8 .ab{font-size:8px;color:var(--c)}
.m8 .lv{font-size:9px;text-align:right}
.m8 .bar i{background:var(--c)}
.loot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 6px}
.loot b{display:block;font:400 17px/1.4 var(--display)}
.loot small{color:var(--muted);font-size:12px}
.quest{display:flex;gap:10px;align-items:flex-start}
.quest .mark{flex:none;width:30px;height:30px;border:2px solid var(--frame);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.quest.done .mark{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.quest.locked .mark{border-style:dashed;color:var(--muted)}
.quest small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px;font-weight:400}
button.mark{background:none;color:inherit;padding:0;width:36px!important;height:36px!important}
.chest{width:100%;background:var(--gold-soft);border:3px solid var(--gold);border-radius:9px;padding:11px 14px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;min-height:54px;color:var(--ink)}
.chest b{margin-left:auto;font:400 13px var(--display);color:var(--gold);white-space:nowrap}
.chest.wiggle{animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-1deg)}95%{transform:rotate(1deg)}}
.boss{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.bossart{width:56px;height:56px;display:block}
.hpb{height:14px;background:var(--bg);border:2px solid var(--frame);border-radius:3px;margin:6px 0 10px;overflow:hidden}
.hpb i{display:block;height:100%;background:var(--hp);transition:width .35s}
.hpb.dead i{background:var(--ok)}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13.5px;margin-top:6px}
.goal span:nth-child(2){font:500 12.5px var(--mono)}
.goal .gbar{grid-column:1/-1;height:5px;background:var(--line);border-radius:2px;overflow:hidden}
.goal .gbar i{display:block;height:100%;background:var(--acc)}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;align-items:start}
.lines li:last-child{border-bottom:0}
.lines .chips{margin:0;justify-content:flex-end}
.total{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:3px double var(--frame);margin-top:8px;padding-top:8px;font:400 11px/1.6 var(--display)}
/* pages */
.page{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px;align-items:start}
.sec{font:400 13px/1.5 var(--display);margin-bottom:10px}
.topic{display:grid;gap:9px;align-content:start;min-width:0}
.tag{flex:none;font:500 11.5px var(--mono);border:1.5px solid currentColor;border-radius:4px;padding:1px 6px;white-space:nowrap}
.tag.space{color:var(--s-int)}.tag.phys{color:var(--s-str)}.tag.math{color:var(--s-agi)}.tag.gold{color:var(--gold)}
.hook{margin:0;font-size:14px;max-width:65ch}
.ttl{font:700 18px/1.25 var(--body)}
.ask{font-weight:600;color:var(--acc)}
.tbtns{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ext{color:var(--acc);font-weight:600;padding:8px 0}
textarea.tnote{font:400 14px/1.4 var(--body);min-height:72px;resize:vertical}
.found{list-style:none;margin:14px 0 0;padding:0}
.found li{padding:10px 0;border-top:1px solid var(--line)}
.fnote{margin:2px 0 0;font-style:italic;overflow-wrap:anywhere;white-space:pre-wrap}
.aq{display:grid;gap:8px;align-content:start;min-width:0}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.board .aq{border:2px solid var(--line);border-radius:7px;padding:12px;background:var(--panel)}
.qlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.aq.legend,.win.legend{background:var(--gold-soft)}
.win.legend{border-color:var(--gold)}
.board .aq.legend{border-color:var(--gold)}
.btn{background:var(--acc);color:var(--on-acc);border:2px solid var(--acc);border-radius:7px;padding:8px 13px;font-weight:600;min-height:42px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--frame)}
.btn.red{background:none;color:var(--hp);border-color:var(--hp)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:600;text-decoration:underline;padding:4px 0;text-align:left}
/* hero page */
.herotop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.herotop{grid-template-columns:minmax(0,1fr)}}
.heroid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.heroname{font:400 clamp(14px,2.6vw,19px)/1.5 var(--display)}
.radar{display:block;width:100%;max-width:400px;margin:4px auto 0;height:auto;grid-column:1/-1}
.radar text{font:700 12px var(--mono);fill:var(--ink)}
.rring,.raxis{fill:none;stroke:var(--line);stroke-width:1}
.rpoly{fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:2;stroke-linejoin:round}
.rdot{fill:var(--acc)}
.stats8{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.statc{padding:14px;display:grid;gap:7px;align-content:start}
.sthead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.sthead small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.stab{width:44px;height:44px;border:3px solid var(--c);color:var(--c);border-radius:6px;display:flex;align-items:center;justify-content:center;font:400 9px var(--display)}
.stlv{font:400 20px var(--display);color:var(--c)}
.statc .bar i{background:var(--c)}
.stmeta{display:flex;justify-content:space-between;gap:8px;font:500 11.5px var(--mono);color:var(--muted)}
.talent{border-top:1px dashed var(--line);padding-top:7px;color:var(--muted)}
.talent b{display:block;font-size:13.5px}
.talent small{display:block;font-size:12.5px;line-height:1.3}
.talent.on{color:var(--ink)}.talent.on b{color:var(--gold)}
/* journal, trophies, shop, rules */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:0;overflow:hidden}
.tile{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile b{display:block;font:400 15px/1.6 var(--display)}
.tile small{color:var(--muted);font-size:12.5px}
.chartwrap{overflow-x:auto}
.chart{display:block;width:100%;min-width:520px;height:auto}
.chart text{font:500 11px var(--mono);fill:var(--muted)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--frame);stroke-width:1.5}
.chart .up{fill:var(--xp)}.chart .dn{fill:var(--hp)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--line);opacity:.5}
#tip{position:fixed;z-index:30;background:var(--frame);color:var(--bg);font-size:12.5px;padding:5px 8px;border-radius:4px;pointer-events:none;max-width:220px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:2px solid var(--frame);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.badge{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;padding:12px;background:var(--panel);border:2px solid var(--line);border-radius:7px}
.badge.got{border-color:var(--gold)}
.sym{width:48px;height:48px;border:2px dashed var(--muted);border-radius:6px;transform:rotate(45deg) scale(.8);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.sym span{transform:rotate(-45deg);font:700 19px var(--mono)}
.badge.got .sym{border:3px solid var(--gold);background:var(--gold-soft);color:var(--gold)}
.badge b{display:block;line-height:1.2}
.badge small{color:var(--muted);font-size:12.5px;line-height:1.25;display:block}
.prog{height:5px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc)}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;padding:7px 6px;border-bottom:1px solid var(--line);align-items:baseline}
.ladder .sz{font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap}
.ladder .thr{font:500 12.5px var(--mono);white-space:nowrap;min-width:64px;text-align:right}
.ladder .lk{color:var(--muted)}
.ladder .cur{background:var(--gold-soft);font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{padding:14px;display:flex;flex-direction:column;gap:9px;justify-content:space-between}
.card .pr{font:400 15px var(--display);color:var(--gold)}
.rulelist{margin:0;padding-left:18px;display:grid;gap:6px;max-width:68ch}
.field{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
input[type=number],input[type=text],select,textarea{background:var(--panel);border:2px solid var(--frame);border-radius:6px;padding:7px 8px;width:100%;min-height:40px}
textarea{min-height:90px;font:500 12px var(--mono)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline>*{flex:1 1 130px;min-width:0}
.inline .btn{flex:0 0 auto}
.chk{display:flex;gap:8px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--acc)}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow .chips{margin-top:3px}
.setrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc);justify-self:center}
/* overlays */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:var(--panel);color:var(--ink);border:3px solid var(--frame);border-radius:8px;padding:10px 13px;font-weight:500;animation:up .25s ease-out;box-shadow:4px 4px 0 var(--shadow)}
.toast b{display:block;font:400 10px/1.6 var(--display);color:var(--acc)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.fl{position:fixed;z-index:26;pointer-events:none;font:400 13px var(--display);color:var(--xp);animation:fl .9s ease-out forwards;white-space:nowrap}
.fl.neg{color:var(--hp)}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#lvl{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#lvl .inner{display:grid;gap:14px;justify-items:center;max-width:480px;animation:pop .5s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#lvl h2{font:400 clamp(18px,5vw,30px)/1.4 var(--display)}
#lvl .sz{font:700 16px var(--mono);color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:480px){.stats{gap:14px}.row{padding-inline:12px}.mini8{grid-template-columns:1fr}.loot b{font-size:14px}.heroid{grid-template-columns:minmax(0,1fr)}}

const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};

async function flush(){if(!remote)return;if(writing){dirty=true;return}writing=true;
 try{await remote.set(JSON.parse(JSON.stringify(S)));saveMode='account'}
 catch(e){saveMode='device';if(e&&e.code==='invalid_argument')remote=null}

async function connect(){
 if(!window.claude||!window.claude.use)return;
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/state');remote=ref;let first=true;
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    const confirmed=!(snap.metadata&&snap.metadata.fromCache);
    if(snap.exists){const d=snap.data();
      if((d.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}baseline=null;render()}
      else if(confirmed&&first&&(S.updatedAt||0)>(d.updatedAt||0))flush();
      if(confirmed){saveMode='account';render()}
    }else if(confirmed&&first){if(S.updatedAt)flush();else{saveMode='account';render()}}
    if(confirmed)first=false;
  },()=>{remote=null;saveMode='device';render()});
 }catch(e){}
}

function calcDay(d,prev,now,start,lv){
 lv=lv||{};const tal=k=>(lv[k]||1)>=TAL_LVL;
 const L=log(d),a=L.a||{},type=L.type||'normal',lines=[],xp={};
 let hpD=0,gold=0,negAct=false;

 for(const x of allActions()){

 }
 if(L.tdone){const o={};addTo(o,{cur:4,int:3},tal('int')?2:1);addTo(xp,o);line('Тема дня изучена',o)}
 if(L.wk){const o={};addTo(o,{int:12,cur:12},tal('int')?2:1);addTo(xp,o);line('Тема недели изучена',o)}
 for(const id of (L.q||[])){const q=AQ[id];if(!q)continue;const o=qXP(q),g=['cha','cre'].some(k=>q.st.includes(k)&&tal(k))?10:0;addTo(xp,o);gold+=g;line(QKIND[q.kind]+': '+q.title,o,g)}
 const os=oathsFor(d).map(o=>({o,done:o.f(a)})),all=os.length>0&&os.every(x=>x.done),normal=type==='normal',isPast=d<now;
 let streak=prev;

}

function radarSVG(sl){
 const N=STATS.length,cx=170,cy=150,R=100,max=Math.max(5,...STATS.map(s=>sl[s.k]));
 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v/max,cy+Math.sin(a)*R*v/max]};
 let g='';const step=max>10?5:max>5?2:1;
 for(let v=step;v<=max;v+=step)g+=`<polygon class="rring" points="${STATS.map((_,i)=>pt(i,v).join(',')).join(' ')}"/>`;
 g+=STATS.map((_,i)=>{const p=pt(i,max);return `<line class="raxis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`}).join('');
 const poly=STATS.map((s,i)=>pt(i,sl[s.k]).join(',')).join(' ');
 const labs=STATS.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/N,x=cx+Math.cos(a)*(R+20),y=cy+Math.sin(a)*(R+20)+4,an=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end';return `<text x="${x}" y="${y}" text-anchor="${an}">${s.ab} ${sl[s.k]}</text>`}).join('');
 const dots=STATS.map((s,i)=>{const p=pt(i,sl[s.k]);return `<circle class="rdot" cx="${p[0]}" cy="${p[1]}" r="3.5"/>`}).join('');
 return `<svg class="radar" viewBox="0 0 340 300" role="img" aria-label="Характеристики: ${STATS.map(s=>s.name+' '+sl[s.k]).join(', ')}">${g}<polygon class="rpoly" points="${poly}"/>${dots}${labs}</svg>`;
}

function chartSVG(C){
 const now=today(),N=30,W=640,H=210,L=34,R=8,T=12,B=26,ds=[];
 for(let i=N-1;i>=0;i--)ds.push(addDays(now,-i));
 const vals=ds.map(d=>C.days[d]?C.days[d].xpT:0);
 const maxA=Math.max(50,...vals.map(Math.abs));const step=maxA>200?100:maxA>100?50:25;
 const top=Math.ceil(Math.max(50,...vals)/step)*step,bot=Math.floor(Math.min(0,...vals)/step)*step;
 const y=v=>T+(top-v)/(top-bot)*(H-T-B),bw=(W-L-R)/N;
 let g='';for(let v=bot;v<=top;v+=step)g+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`;
 const bars=ds.map((d,i)=>{const v=vals[i],x=L+i*bw,bh=Math.abs(y(v)-y(0));
  const m=v?`<rect class="${v>0?'up':'dn'}" x="${x+1.5}" y="${v>0?y(v):y(0)}" width="${Math.max(2,bw-3)}" height="${Math.max(1,bh)}" rx="1"/>`:'';
  const lab=(N-1-i)%5===0?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${parse(d).getDate()}.${pad(parse(d).getMonth()+1)}</text>`:'';
  return m+lab+`<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H-T-B}" data-act="openday" data-v="${d}" data-tip="${esc(shortDate(d))}: ${sg(v)||'0'} опыта"/>`}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Опыт по дням за последние 30 дней">${g}<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}

  <div class="two">
   <section class="win pad"><h2 class="sec">Дела и что они качают</h2><div class="small" style="margin-bottom:6px">Галочка справа: показывать дело на главной.</div>${acts}</section>
   <div style="display:grid;gap:18px;align-content:start">
   <section class="win pad"><h2 class="sec">Своё дело или проклятие</h2>
    <div style="display:grid;gap:8px"><input type="text" id="c-name" placeholder="Например, медитация" aria-label="Название дела">
    <div class="inline"><select id="c-group" aria-label="Раздел">${Object.keys(GROUPS).map(g=>`<option value="${g}">${GROUPS[g]}</option>`).join('')}</select><select id="c-kind" aria-label="Как отмечать"><option value="toggle">Сделано или нет</option><option value="count">Считать штуки</option></select></div>
    <div class="inline"><select id="c-stat" aria-label="Что качает">${STATS.map(s=>`<option value="${s.k}">${esc(s.name)}</option>`).join('')}</select><input type="number" id="c-xp" placeholder="Опыт, минус для проклятия" aria-label="Опыт" value="3"></div>
    <div class="inline"><button class="btn" id="c-add" data-act="cadd">Добавить дело</button></div></div></section>
   <section class="win pad"><h2 class="sec">Клятвы</h2>
    ${OATHS.map(o=>`<label class="chk"><input type="checkbox" id="oath-${o.id}" data-chg="oath" data-id="${o.id}" ${S.oathOff[o.id]?'':'checked'}> ${esc(o.name)}: ${esc(o.how.toLowerCase())}</label>`).join('')}
    <div class="field"><label for="pen-xp">Нарушенная клятва, минус ВОЛ</label><input type="number" min="0" id="pen-xp" data-chg="pen" data-id="xp" value="${S.pen.xp}"></div>
    <div class="field"><label for="pen-hp">Нарушенная клятва, минус здоровья</label><input type="number" min="0" id="pen-hp" data-chg="pen" data-id="hp" value="${S.pen.hp}"></div></section>
   <section class="win pad"><h2 class="sec">Цели босса</h2>
    <div class="field"><label for="g-lecture">Лекций в неделю</label><input type="number" min="1" id="g-lecture" data-chg="goal" data-id="lecture" value="${S.goals.lecture}"></div>
    <div class="field"><label for="g-tasks">Задач в неделю</label><input type="number" min="1" id="g-tasks" data-chg="goal" data-id="tasks" value="${S.goals.tasks}"></div>
    <div class="field"><label for="g-move">Тренировок и поездок</label><input type="number" min="1" id="g-move" data-chg="goal" data-id="move" value="${S.goals.move}"></div>
    <div class="field"><label for="g-oathDays">Дней со всеми клятвами</label><input type="number" min="1" max="7" id="g-oathDays" data-chg="goal" data-id="oathDays" value="${S.goals.oathDays}"></div>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="s-sound" data-chg="sound" ${S.sound?'checked':''}> Звук при отметках</label></section>
   <section class="win pad"><h2 class="sec">Сохранение</h2>
    <p class="small" style="margin:0 0 8px">${saveMode==='account'?'Сохраняется в твоём аккаунте, другим не видно. Откроется и на других устройствах.':'Сохраняется только в этом браузере. Сделай копию, чтобы не потерять.'}</p>
    <p class="small" style="margin:0 0 8px">Копию из «Квантового скачка» тоже можно вставить сюда: дни, квесты и темы перенесутся.</p>
    <div class="inline"><button class="btn ghost" id="exp" data-act="export">${showExport?'Скрыть копию':'Показать копию данных'}</button></div>
    ${showExport?`<textarea id="exptext" readonly aria-label="Копия данных" style="margin-top:8px">${esc(JSON.stringify(S))}</textarea><div class="inline" style="margin-top:6px"><button class="btn ghost" id="copy" data-act="copy">Скопировать</button></div>`:''}
    <textarea id="imp" placeholder="Вставь сюда копию, чтобы восстановить" aria-label="Восстановить из копии" style="margin-top:8px"></textarea>
    <div class="inline" style="margin-top:6px"><button class="btn ghost" id="impb" data-act="import">Восстановить</button></div>
    ${importMsg?`<p class="small" role="status" style="margin:6px 0 0">${esc(importMsg)}</p>`:''}
    <div class="inline" style="margin-top:12px">${confirmReset?`<button class="btn red" id="res2" data-act="reset2">Да, стереть всё</button><button class="btn ghost" id="res0" data-act="reset0">Отмена</button>`:`<button class="btn red" id="res1" data-act="reset1">Начать сагу заново</button>`}</div></section>
   </div></div></div>`;
}
function render(){
 const fid=document.activeElement&&document.activeElement.id;
 const C=computeAll();
 const v={today:todayView,hero:heroView,quests:questsView,topics:topicsView,journal:journalView,ach:achView,shop:shopView,rules:rulesView}[tab](C);
 $('#app').innerHTML=header(C)+'<main>'+v+'</main>';
 if(fid){const el=document.getElementById(fid);if(el)try{el.focus({preventScroll:true})}catch(e){}}
 return C;
}

/* ---------- Обратная связь ---------- */
let actx=null;
function beep(up){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=up?660:200;if(up)o.frequency.setValueAtTime(990,actx.currentTime+.07);g.gain.value=.03;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.18);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.19)}catch(e){}}
function floatAt(ev,txt,neg){const el=document.createElement('div');el.className='fl'+(neg?' neg':'');el.textContent=txt;el.style.left=Math.min(innerWidth-140,Math.max(8,(ev.clientX||innerWidth/2)-20))+'px';el.style.top=Math.max(8,(ev.clientY||innerHeight/2)-26)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),950)}
function toast(t,s){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${esc(t)}</b>${s?esc(s):''}`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3800)}
function levelUp(i){const r=RANKS[i],o=$('#lvl');o.innerHTML=`<div class="inner"><div class="px" style="font-size:11px;color:var(--gold)">Level up!</div><h2>${esc(r[0])}</h2><div class="sz">${r[1]}</div><div class="small">Уровень героини ${i+1}</div><button class="btn" id="lvlok" data-act="lvlok">Дальше</button></div>`;o.hidden=false;const b=$('#lvlok');if(b)b.focus()}
const achSet=C=>new Set(ACH.filter(a=>a[3](C.T)>=a[4]).map(a=>a[1]));
function commit(fn,ev){
 const b=computeAll();
 fn();persist();
 const a=render();
 if(ev){const diff={};STATS.forEach(s=>{const v=(a.sxp[s.k]||0)-(b.sxp[s.k]||0);if(v)diff[s.k]=v});const ks=Object.keys(diff);
  if(ks.length){const txt=ks.slice(0,2).map(k=>sg(diff[k])+' '+SN[k].ab).join(' ');floatAt(ev,txt,sumX(diff)<0);beep(sumX(diff)>0)}}
 const s1=achSet(b),s2=achSet(a);s2.forEach(n=>{if(!s1.has(n))toast('Трофей',n)});
 STATS.forEach(s=>{if(a.sl[s.k]>b.sl[s.k])toast(s.name+': уровень '+a.sl[s.k],a.sl[s.k]>=TAL_LVL&&b.sl[s.k]<TAL_LVL?'Открыт талант «'+TAL[s.k][0]+'»':'')});
 const r1=b.days[view],r2=a.days[view];if(r1&&r2&&!r1.all&&r2.all)toast('Клятвы исполнены','+10 золота, +10 здоровья');
 if(a.lvl>b.lvl)levelUp(a.lvl);
 if(a.T.boss>b.T.boss)toast('Энтропия повержена','+'+bossGold()+' золота');
}
function dayLog(d){if(!S.days[d])S.days[d]={a:{},type:'normal'};if(!S.days[d].a)S.days[d].a={};return S.days[d]}
function cleanup(d){const L=S.days[d];if(L&&!Object.keys(L.a||{}).length&&(L.type||'normal')==='normal'&&!L.chest&&!L.tdone&&!L.tpick&&!L.tnote&&!L.wk&&!L.qm&&!L.qe&&!L.ql&&!(L.q&&L.q.length))delete S.days[d]}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

/* ---------- События ---------- */
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 const act=t.dataset.act,id=t.dataset.id,val=t.dataset.v;
 const simple={
  tab(){tab=val;confirmReset=false;importMsg='';render();scrollTo(0,0)},
  day(){const n=addDays(view,+val);if(n<=today()){view=n;render()}},
  gotoday(){view=today();render()},
  openday(){view=val;tab='today';hideTip();render();scrollTo(0,0)},
  lvlok(){$('#lvl').hidden=true},
  export(){showExport=!showExport;render()},
  copy(){const x=$('#exptext');const done=()=>toast('Скопировано');if(navigator.clipboard)navigator.clipboard.writeText(x.value).then(done).catch(()=>{x.select()});else x.select()},
  theme(){toggleTheme()},
  reset1(){confirmReset=true;render()},reset0(){confirmReset=false;render()},
 };
 if(simple[act])return simple[act]();
 const mut={
  inc(){const L=dayLog(view);L.a[id]=(L.a[id]||0)+1},
  dec(){const L=dayLog(view);L.a[id]=Math.max(0,(L.a[id]||0)-1);if(!L.a[id])delete L.a[id];cleanup(view)},
  toggle(){const L=dayLog(view);if(L.a[id])delete L.a[id];else L.a[id]=1;cleanup(view)},
  choice(){const L=dayLog(view);if(L.a[id]===val)delete L.a[id];else L.a[id]=val;cleanup(view)},
  type(){const L=dayLog(view);L.type=val;cleanup(view)},
  chest(){dayLog(view).chest=true},
  tdone(){const L=dayLog(view);if(L.tdone){delete L.tdone}else{L.tpick=dayTopic(view).id;L.tdone=1;toast('Свиток прочитан',dayTopic(view).title)}},
  tswap(){const cur=dayTopic(view),L=dayLog(view);delete L.tnote;L.tpick=nextTopic(TOPICS,TOPICS.indexOf(cur)+1,seenDays(),cur.id).id},
  wdone(){const m=monday(view),W=weekRec(m);if(W.day){const L=S.days[W.day];if(L){delete L.wk;cleanup(W.day)}delete W.day}else{W.pick=weekTopic(m).id;W.day=view;dayLog(view).wk=1;toast('Фолиант изучен',weekTopic(m).title)}},
  wswap(){const m=monday(view),cur=weekTopic(m),W=weekRec(m);delete W.note;W.pick=nextTopic(WEEKLY,WEEKLY.indexOf(cur)+1,seenWeeks(),cur.id).id},
  qtoggle(){const slot=t.dataset.slot||'',dd=t.dataset.d;
   if(dd){const L=S.days[dd];if(L&&L.q){L.q=L.q.filter(x=>x!==id);if(!L.q.length)delete L.q;cleanup(dd)}return}
   const L=dayLog(view);if(slot==='m')L.qm=id;if(slot==='e')L.qe=id;if(slot==='l')L.ql=id;
   if(slot[0]==='w'){const m=monday(view);weekRec(m).qp=weekQ(m).map(x=>x.id)}
   L.q=(L.q||[]).concat(id);toast('Квест выполнен',AQ[id]?AQ[id].title:'')},
  qswap(){const slot=t.dataset.slot,s=qSeen();
   if(QLIST[slot]){const list=QLIST[slot],cur=AQ[id],L=dayLog(view);L['q'+slot]=nextTopic(list,list.indexOf(cur)+1,s,cur.id).id;return}
   const m=monday(view),cur=weekQ(m),i=+slot[1],other=cur[1-i];s.add(other.id);
   const n=nextTopic(QW,QW.indexOf(cur[i])+1,s,cur[i].id);if(n.id===other.id||n.id===cur[i].id)return;
   cur[i]=n;weekRec(m).qp=cur.map(x=>x.id)},
  buy(){const r=S.rewards.find(x=>x.id===id);if(!r)return;S.buys.push({name:r.name,cost:r.cost,date:today(),ts:Date.now()});toast('Куплено',r.name+' за '+r.cost+' золота')},
  refund(){S.buys=S.buys.filter(b=>String(b.ts)!==val);toast('Золото вернулось в кошелёк')},
  rdel(){S.rewards=S.rewards.filter(x=>x.id!==id)},
  radd(){const n=$('#newr-name').value.trim(),c=parseInt($('#newr-cost').value,10);if(!n||!(c>0)){toast('Нужны название и цена больше нуля');return}S.rewards.push({id:uid('r'),name:n.slice(0,80),cost:c})},
  cadd(){const n=$('#c-name').value.trim(),p=parseInt($('#c-xp').value,10);if(!n||!Number.isFinite(p)||p===0){toast('Нужны название и опыт, не ноль');return}S.custom.push({id:uid('c'),group:$('#c-group').value,kind:$('#c-kind').value,name:n.slice(0,80),note:'',xp:{[$('#c-stat').value]:Math.max(-50,Math.min(50,p))}});toast('Дело добавлено',n.slice(0,80))},
  cdel(){S.custom=S.custom.filter(x=>x.id!==id)},
  cqadd(){const n=$('#cq-name').value.trim(),p=parseInt($('#cq-pts').value,10);if(!n||!(p>0)){toast('Нужны название и опыт больше нуля');return}S.cq.push({id:uid('qc'),title:n.slice(0,80),stat:$('#cq-stat').value,pts:Math.min(200,p),rep:$('#cq-rep').checked});toast('Квест добавлен',n.slice(0,80))},
  cqdel(){const c=(S.cq||[]).find(x=>x.id===id);if(c)c.gone=1},
  import(){try{const o=JSON.parse($('#imp').value);if(!o||typeof o.days!=='object')throw 0;S=normalize(o);importMsg='Данные восстановлены.'}catch(e){importMsg='Текст не похож на копию данных. Вставь его целиком.'}},
  reset2(){S=fresh();view=today();confirmReset=false},
 };
 if(mut[act])commit(mut[act],ev);
});
document.addEventListener('change',ev=>{
 const t=ev.target,k=t.dataset&&t.dataset.chg;if(!k)return;const id=t.dataset.id;
 const n=parseInt(t.value,10);
 commit(()=>{
  if(k==='vis'){if(t.checked)delete S.hidden[id];else S.hidden[id]=1}
  if(k==='oath'){if(t.checked)delete S.oathOff[id];else S.oathOff[id]=1}
  if(k==='pen'&&n>=0)S.pen[id]=Math.min(99,n);
  if(k==='goal'&&n>0)S.goals[id]=Math.min(9999,n);
  if(k==='sound')S.sound=t.checked;
  if(k==='tnote'){const v=t.value.trim().slice(0,600),L=dayLog(view);if(v){L.tnote=v;if(!L.tpick)L.tpick=dayTopic(view).id}else{delete L.tnote;cleanup(view)}}
  if(k==='wnote'){const m=monday(view),W=weekRec(m),v=t.value.trim().slice(0,1500);if(v){W.note=v;if(!W.pick)W.pick=weekTopic(m).id}else delete W.note}
  if(k==='rname'&&t.value.trim()){const r=S.rewards.find(x=>x.id===id);if(r)r.name=t.value.trim().slice(0,80)}
  if(k==='rcost'&&n>0){const r=S.rewards.find(x=>x.id===id);if(r)r.cost=n}
 });
});
const tip=$('#tip');function hideTip(){tip.hidden=true}
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){hideTip();return}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(innerWidth-150,e.clientX+12)+'px';tip.style.top=Math.max(4,e.clientY-34)+'px'});

let lastDay=today(),lastH=new Date().getHours();
setInterval(()=>{const n=today(),h=new Date().getHours();
 if(n!==lastDay){if(view===lastDay)view=n;lastDay=n;render()}
 else if(lastH<EVENING_H&&h>=EVENING_H){render();toast('Открылся вечерний квест',dayQ(n,'e').title)}
 lastH=h},60000);
try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render()})}catch(e){}
render();
connect();
</script>
