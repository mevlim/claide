<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Квантовая сага</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Neucha&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: тетрадь в клетку. Слева страница с полем, где красной ручкой стоят баллы; справа атом дня и босс недели. В тёмной теме та же тетрадь становится школьной доской. */
:root{
  --paper:#eaf0f9; --sheet:#fbfcff; --ink:#16264f; --muted:#56658a; --grid:#d3dff0; --line:#dbe4f2;
  --pen:#2346c7; --on-pen:#ffffff; --red:#c92626; --red-soft:#fbe7e6; --gold:#9a6500; --gold-soft:#fbf0d4; --green:#17734a; --green-soft:#dff3e8; --pen-soft:#e5eafb;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --hand:"Neucha","Segoe Print","Comic Sans MS",cursive;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#1b2a27; --sheet:#233531; --ink:#eef2e6; --muted:#a8b9ae; --grid:#293d38; --line:#354b45;
  --pen:#8ec5ff; --on-pen:#0f1f25; --red:#ff918b; --red-soft:#46302e; --gold:#f2cf6b; --gold-soft:#413c26; --green:#9bdc8c; --green-soft:#2b4531; --pen-soft:#2b4149; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1b2a27; --sheet:#233531; --ink:#eef2e6; --muted:#a8b9ae; --grid:#293d38; --line:#354b45;
  --pen:#8ec5ff; --on-pen:#0f1f25; --red:#ff918b; --red-soft:#46302e; --gold:#f2cf6b; --gold-soft:#413c26; --green:#9bdc8c; --green-soft:#2b4531; --pen-soft:#2b4149; color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font:400 15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:2px;border-radius:4px}
h1,h2,h3{margin:0;text-wrap:balance}
.wrap{max-width:1080px;margin:0 auto}
/* top */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:12px 0;margin-inline:-4px;padding-inline:4px;border-bottom:2px solid var(--ink)}
.toprow{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.brand{font:800 15px/1.1 var(--display);letter-spacing:-.01em}
.rank{flex:1 1 240px;min-width:0}
.rankline{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}
.rankline b{font:700 13px var(--display)}
.rankline span{color:var(--muted);font:500 12px var(--mono);white-space:nowrap}
.xp{height:8px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:2px;margin-top:4px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--pen);transition:width .35s}
.stats{display:flex;gap:18px}
.stat{line-height:1.1}
.stat b{display:block;font:700 19px var(--display)}
.stat small{color:var(--muted);font-size:11.5px}
.tabrow{display:flex;align-items:center;gap:8px;margin-top:10px}
.tabs{display:flex;gap:2px;flex:1;min-width:0;align-self:flex-end;overflow-x:auto;scrollbar-width:none}
.themebtn{flex:none;width:40px;height:40px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;background:var(--sheet);color:var(--ink);border:1.5px solid var(--ink);border-radius:6px;padding:0}
.themebtn:hover{background:var(--pen-soft)}
.tab{background:none;border:0;padding:8px 13px;font-weight:600;font-size:14px;color:var(--muted);border-radius:6px 6px 0 0;white-space:nowrap;min-height:40px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
/* layout */
.today{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);grid-template-areas:"day hero" "quests hero" "quests side";grid-template-rows:auto auto 1fr;gap:16px 22px;margin-top:16px;align-items:start}
.dayhead{grid-area:day}.quests{grid-area:quests}.hero{grid-area:hero}.side{grid-area:side;display:grid;gap:16px}
@media (max-width:820px){.today{grid-template-columns:minmax(0,1fr);grid-template-areas:"day" "hero" "quests" "side";grid-template-rows:none}}
.dayhead{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.daynav{display:flex;align-items:center;gap:6px}
.iconbtn{width:40px;height:40px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:6px;font-weight:700;font-size:17px;line-height:1}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn:not(:disabled):hover{background:var(--pen-soft)}
.daytitle{font:700 16px/1.2 var(--display);min-width:0}
.todaybtn{background:none;border:0;color:var(--pen);font-weight:600;text-decoration:underline;padding:8px 4px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--sheet);flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 10px;font-size:13px;font-weight:500;min-height:36px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
/* sheet */
.sheet{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;box-shadow:3px 3px 0 var(--grid)}
.pad{padding:14px 16px}
.alert{background:var(--red-soft);border:1.5px solid var(--red);color:var(--ink);border-radius:4px;padding:9px 12px;font-size:14px;margin-bottom:12px}
.alert b{color:var(--red)}
.blocks{display:grid;gap:18px}
.block{overflow:hidden}
.g-study{--head:var(--pen-soft)}.g-work{--head:var(--gold-soft)}.g-move{--head:var(--green-soft)}.g-body{--head:var(--line)}.g-extra{--head:var(--sheet)}.g-bad{--head:var(--red-soft)}
.ghead{display:grid;grid-template-columns:66px 1fr;background:var(--head,none);font:700 13px var(--display);letter-spacing:.02em;border-bottom:1.5px solid var(--ink)}
.ghead span:first-child{border-right:2px solid var(--red);padding:12px 0}
.ghead span:last-child{padding:12px 12px 8px}
.ghead.bad span:last-child{color:var(--red)}
.row{display:grid;grid-template-columns:66px minmax(0,1fr) auto;align-items:center;border-bottom:1px solid var(--line);min-height:58px}
.row:last-child{border-bottom:0}
.margin{align-self:stretch;display:flex;align-items:center;justify-content:center;border-right:2px solid var(--red);font:400 19px/1 var(--hand);color:var(--red);padding:0 4px;text-align:center}
.margin.pos{color:var(--pen)}
.rname{padding:9px 10px 9px 12px;min-width:0}
.rname b{font-weight:600;display:block}
.rname small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.ctl{padding:7px 12px 7px 0;display:flex;align-items:center;gap:6px}
.cnt{display:flex;align-items:center;gap:2px}
.cnt output{min-width:32px;text-align:center;font:700 17px var(--mono)}
.step{width:40px;height:40px;background:none;border:1.5px solid var(--ink);border-radius:6px;font-size:19px;font-weight:700;line-height:1}
.step.plus{background:var(--pen);color:var(--on-pen);border-color:var(--pen)}
.step:disabled{opacity:.3;cursor:default}
.step:not(:disabled):active{transform:scale(.94)}
.tick{width:44px;height:44px;background:none;border:2px solid var(--ink);border-radius:6px;font:400 22px/1 var(--hand);padding:0}
.tick[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:var(--on-pen)}
.tick.badt[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:var(--sheet)}
.row.choice{grid-template-columns:66px minmax(0,1fr)}
.row.choice .rname{padding-bottom:4px}
.choices{display:flex;flex-wrap:wrap;gap:6px;padding:2px 12px 10px}
.opt{border:1.5px solid var(--ink);background:none;border-radius:6px;padding:6px 10px;font-size:13.5px;font-weight:500;min-height:38px}
.opt em{font:700 13px var(--mono);font-style:normal;margin-left:4px}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.row.off{opacity:.55}
.row .choicewrap{min-width:0}
/* hero */
.hero .pad{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:12px;align-items:center}
.atom{width:100%;max-width:190px;aspect-ratio:1;display:block}
.orbit{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;opacity:.7}
.orbit.on{stroke:var(--pen);stroke-width:2;stroke-dasharray:none;opacity:1}
.nuc{fill:var(--ink)}
.el{fill:var(--pen)}
.el.ion{fill:var(--gold)}
.spin{transform-origin:150px 150px;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.orbn{font:500 11px var(--mono);fill:var(--muted)}
.photon{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;opacity:0;animation:ph 1s ease-out}
@keyframes ph{0%{opacity:1;transform:translate(0,0)}100%{opacity:0;transform:translate(70px,-70px)}}
.score{display:flex;align-items:flex-start;gap:8px}
.score b{font:800 clamp(38px,6vw,52px)/1 var(--display);letter-spacing:-.03em}
.score b.neg{color:var(--red)}
.grade{font:400 27px/1 var(--hand);color:var(--red);border:2px solid var(--red);border-radius:50%;width:48px;height:48px;display:inline-flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex:none}
.state{font-weight:600;margin-top:6px;line-height:1.25}
.next{color:var(--muted);font-size:13px;margin-top:2px}
.h3{font:700 13px/1.2 var(--display);margin-bottom:8px}
.quest{display:flex;gap:10px;align-items:flex-start}
.quest .mark{flex:none;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font:400 18px/1 var(--hand)}
.quest.done .mark{background:var(--green);border-color:var(--green);color:var(--sheet)}
.q-v{font:700 14px var(--mono);margin-left:auto;white-space:nowrap}
.chest{width:100%;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:4px;padding:11px 12px;display:flex;gap:10px;align-items:center;text-align:left;font-weight:600;min-height:52px}
.chest:hover{filter:brightness(.97)}
.chest:disabled{cursor:default}
.chest b{margin-left:auto;font:700 17px var(--mono);color:var(--gold);white-space:nowrap}
.chest.wiggle{animation:wig 1.4s ease-in-out infinite}
@keyframes wig{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-1deg)}95%{transform:rotate(1deg)}}
.boss-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.boss-top span{font:700 13px var(--mono);white-space:nowrap}
.hp{height:14px;background:var(--line);border:1.5px solid var(--ink);border-radius:2px;margin:6px 0 10px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--red);transition:width .35s}
.hp.dead i{background:var(--green)}
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13.5px;margin-top:6px}
.goal span:nth-child(2){font:500 12.5px var(--mono)}
.goal .bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--pen)}
.small{font-size:13px;color:var(--muted)}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.lines li:last-child{border-bottom:0}
.lines b{font:700 13px var(--mono);white-space:nowrap}
.lines .minus b{color:var(--red)}
.lines .mod{color:var(--muted)}
.lines .bonus b{color:var(--green)}
.total{display:flex;justify-content:space-between;font:400 22px var(--hand);border-top:2px solid var(--ink);margin-top:6px;padding-top:4px}
/* journal etc */
.page{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin-top:18px}
@media (max-width:820px){.top{position:static}}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:0;border:1.5px solid var(--ink);background:var(--sheet);border-radius:4px}
.tile{padding:12px 14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile b{display:block;font:700 24px/1.1 var(--display)}
.tile small{color:var(--muted);font-size:12.5px}
.chartwrap{overflow-x:auto}
.chart{display:block;width:100%;min-width:520px;height:auto}
.chart text{font:500 11px var(--mono);fill:var(--muted)}
.chart .gridl{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--ink);stroke-width:1.5}
.chart .up{fill:var(--pen)}.chart .dn{fill:var(--red)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover{fill:var(--grid);opacity:.5}
#tip{position:fixed;z-index:30;background:var(--ink);color:var(--paper);font-size:12.5px;padding:5px 8px;border-radius:4px;pointer-events:none;max-width:220px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1.5px solid var(--ink);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-family:var(--mono)}
.linkbtn{background:none;border:0;color:var(--pen);font-weight:600;text-decoration:underline;padding:4px 0;text-align:left}
.gr{font:400 19px/1 var(--hand);color:var(--red)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.badge{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:center;padding:12px;background:var(--sheet);border:1.5px solid var(--line);border-radius:4px}
.badge.got{border-color:var(--ink)}
.sym{width:48px;height:48px;border:2px dashed var(--muted);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 20px var(--mono);color:var(--muted)}
.badge.got .sym{border:2px solid var(--gold);background:var(--gold-soft);color:var(--gold)}
.badge b{display:block;line-height:1.2}
.badge small{color:var(--muted);font-size:12.5px;line-height:1.25;display:block}
.prog{height:4px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pen)}
.ladder{list-style:none;margin:0;padding:0}
.ladder li{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;padding:7px 4px;border-bottom:1px solid var(--line);align-items:baseline}
.ladder li:last-child{border-bottom:0}
.ladder .sz{font:500 12.5px var(--mono);color:var(--muted);white-space:nowrap}
.ladder .thr{font:500 12.5px var(--mono);white-space:nowrap;min-width:64px;text-align:right}
.ladder .lk{color:var(--muted)}
.ladder .cur{background:var(--pen-soft);font-weight:700}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:13px;display:flex;flex-direction:column;gap:9px;justify-content:space-between}
.card .pr{font:700 19px var(--display)}
.btn{background:var(--pen);color:var(--on-pen);border:1.5px solid var(--pen);border-radius:6px;padding:8px 13px;font-weight:600;min-height:42px}
.btn.ghost{background:none;color:var(--ink);border-color:var(--ink)}
.btn.red{background:none;color:var(--red);border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.rulelist{margin:0;padding-left:18px;display:grid;gap:6px;max-width:65ch}
.field{display:grid;grid-template-columns:minmax(0,1fr) 80px;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0}
.field label{min-width:0}
input[type=number],input[type=text],select,textarea{background:var(--sheet);border:1.5px solid var(--ink);border-radius:5px;padding:7px 8px;width:100%;min-height:38px}
textarea{min-height:90px;font:500 12px var(--mono)}
.inline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline>*{flex:1 1 130px;min-width:0}
.inline .btn{flex:0 0 auto}
.chk{display:flex;gap:8px;align-items:center;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--pen)}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) 72px 56px;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow .hd{font-size:12px;color:var(--muted)}
.setrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--pen);justify-self:center}
.sec{font:700 16px var(--display);margin-bottom:10px}
.note{font:400 18px/1.2 var(--hand);color:var(--red)}
/* темы */
.ghead.more[aria-expanded="false"]{border-bottom:0}
.ghead.more{width:100%;border:0;border-bottom:1.5px solid var(--ink);padding:0;text-align:left;color:inherit;min-height:44px}
.ghead.more span:last-child{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ghead.more:hover{background:var(--pen-soft)}
.ghead.more i{font-style:normal;font-size:14px}
.topic{display:grid;gap:9px;align-content:start;min-width:0}
.tophead{display:flex;justify-content:space-between;gap:10px;align-items:center}
.tag{flex:none;font:500 11.5px var(--mono);border:1.5px solid currentColor;border-radius:3px;padding:1px 6px;white-space:nowrap}
.tag.space{color:var(--pen)}.tag.phys{color:var(--red)}.tag.math{color:var(--green)}
.hook{margin:0;font-size:14px;max-width:65ch}
.ttl{font:700 18px/1.25 var(--display)}
.ask{font:400 18px/1.25 var(--hand);color:var(--red)}
.tbtns{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.ext{color:var(--pen);font-weight:600;padding:8px 0}
textarea.tnote{font:400 14px/1.4 var(--body);min-height:72px;resize:vertical}
.found{list-style:none;margin:14px 0 0;padding:0}
.found li{padding:10px 0;border-top:1px solid var(--line)}
.fnote{margin:2px 0 0;font:400 16px/1.3 var(--hand);overflow-wrap:anywhere;white-space:pre-wrap}
/* приключения */
.aq{display:grid;gap:8px;align-content:start;min-width:0}
.quest small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3;margin-top:2px;font-weight:400}
.quest.locked .mark{border-style:dashed;color:var(--muted)}
button.mark{background:none;color:inherit;padding:0;width:36px!important;height:36px!important;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.board .aq{border:1.5px solid var(--line);border-radius:4px;padding:12px;background:var(--sheet)}
.qlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
/* overlays */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;display:grid;gap:8px;width:min(92vw,380px)}
.toast{background:var(--ink);color:var(--paper);padding:10px 13px;border-radius:5px;font-weight:500;animation:up .25s ease-out}
.toast b{display:block;font:700 13px var(--display)}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.fl{position:fixed;z-index:26;pointer-events:none;font:400 26px var(--hand);color:var(--pen);animation:fl .9s ease-out forwards}
.fl.neg{color:var(--red)}
@keyframes fl{to{transform:translateY(-46px);opacity:0}}
#lvl{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;align-items:center;justify-content:center;text-align:center;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#lvl .inner{display:grid;gap:12px;justify-items:center;max-width:480px;animation:pop .5s cubic-bezier(.2,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
#lvl h2{font:800 clamp(30px,8vw,52px)/1.05 var(--display)}

/* RPG */
.brand .cls{display:block;font:500 11.5px var(--body);color:var(--muted);letter-spacing:0;margin-top:3px;max-width:200px}
.statbtn{background:none;border:0;padding:0;text-align:left;line-height:1.1;color:inherit}
.statbtn:hover small{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.chip{font:500 11px/1.5 var(--mono);border:1px solid var(--pen);color:var(--pen);border-radius:3px;padding:0 5px;white-space:nowrap}
.chip.neg{border-color:var(--red);color:var(--red)}
.chips.big .chip{font-size:12.5px;padding:2px 7px}
.aq.legend,.topic.legend{border-color:var(--gold)!important;background:var(--gold-soft)}
.tag.gold{color:var(--gold)}
.herotop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.herotop{grid-template-columns:minmax(0,1fr)}}
.heroname{font:800 clamp(22px,4vw,32px)/1.1 var(--display);letter-spacing:-.02em;margin-top:2px}
.radar{display:block;width:100%;max-width:420px;margin:6px auto 0;height:auto}
.radar text{font:700 12px var(--mono);fill:var(--ink)}
.rring{fill:none;stroke:var(--line);stroke-width:1}
.raxis{stroke:var(--line);stroke-width:1}
.rpoly{fill:var(--pen);fill-opacity:.22;stroke:var(--pen);stroke-width:2;stroke-linejoin:round}
.rdot{fill:var(--pen)}
.stats8{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.statc{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:12px;display:grid;gap:6px;align-content:start}
.sthead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.sthead small{display:block;color:var(--muted);font-size:12px;line-height:1.25}
.stab{width:44px;height:44px;border:2px solid var(--pen);color:var(--pen);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px var(--mono)}
.stlv{font:800 26px/1 var(--display)}
.stmeta{display:flex;justify-content:space-between;gap:8px;font:500 11.5px var(--mono);color:var(--muted)}
.talent{border-top:1px dashed var(--line);padding-top:6px;color:var(--muted)}
.talent b{display:block;font-size:13.5px}
.talent small{display:block;font-size:12.5px;line-height:1.3}
.talent.on{color:var(--ink)}
.talent.on b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}.spin{animation:none!important}}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7; // 0=пн
const monday=s=>addDays(s,-dow(s));
const isSat=s=>dow(s)===5;
const today=()=>iso(new Date());
const longDate=s=>parse(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const shortDate=s=>parse(s).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sg=n=>(n>0?'+':n<0?'−':'')+Math.abs(n);
const plural=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c};

let remote=null,writing=false,dirty=false,timer=null;

async function flush(){if(!remote)return;if(writing){dirty=true;return}writing=true;
 try{await remote.set(JSON.parse(JSON.stringify(S)));saveMode='account'}
 catch(e){saveMode='device';if(e&&e.code==='invalid_argument')remote=null}
 writing=false;if(dirty){dirty=false;flush()}}
async function connect(){
 if(!window.claude||!window.claude.use)return;
 try{
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/state');remote=ref;let first=true;
  ref.onSnapshot(snap=>{
    if(snap.metadata&&snap.metadata.hasPendingWrites)return;
    const confirmed=!(snap.metadata&&snap.metadata.fromCache);
    if(snap.exists){const d=snap.data();
      if((d.updatedAt||0)>(S.updatedAt||0)){S=normalize(JSON.parse(JSON.stringify(d)));try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}baseline=null;render()}
      else if(confirmed&&first&&(S.updatedAt||0)>(d.updatedAt||0))flush();
      if(confirmed){saveMode='account';render()}
    }else if(confirmed&&first){if(S.updatedAt)flush();else{saveMode='account';render()}}
    if(confirmed)first=false;
  },()=>{remote=null;saveMode='device';render()});
 }catch(e){}
}

function calcDay(d,prevStreak,now,start,lv){

 const L=log(d),a=L.a||{},type=L.type||'normal',lines=[],sx={};

 }

 for(const id of (L.q||[])){const x=AQ[id];if(!x)continue;const ex=['str','cha','cre'].some(k=>x.st.includes(k)&&tal(k))?5:0;otherPos+=x.pts+ex;lines.push({t:QKIND[x.kind]+': '+x.title,v:x.pts+ex,k:''});addX(qXP(x),1);mastery(x.pts,x.st[0])}

  if(a.sat)T.sat++;if(a.work)T.work++;if(r.perfect)T.perfect++;if(r.qDone)T.quests++;if(r.chestOn)T.chests++;if(r.total>=IONIZE)T.orbit5++;

}

function radarSVG(sl){

 const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*R*v/max,cy+Math.sin(a)*R*v/max]};
 let g='';const step=max>10?5:max>5?2:1;
 for(let v=step;v<=max;v+=step)g+=`<polygon class="rring" points="${STATS.map((_,i)=>pt(i,v).join(',')).join(' ')}"/>`;
 g+=STATS.map((_,i)=>{const p=pt(i,max);return `<line class="raxis" x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}"/>`}).join('');
 const poly=STATS.map((s,i)=>pt(i,sl[s.k]).join(',')).join(' ');
 const labs=STATS.map((s,i)=>{const a=-Math.PI/2+i*2*Math.PI/N,x=cx+Math.cos(a)*(R+20),y=cy+Math.sin(a)*(R+20)+4,an=Math.abs(Math.cos(a))<.2?'middle':Math.cos(a)>0?'start':'end';return `<text x="${x}" y="${y}" text-anchor="${an}">${s.ab} ${sl[s.k]}</text>`}).join('');

}

function chartSVG(C){
 const now=today(),N=30,W=640,H=210,L=34,R=8,T=12,B=26,ds=[];
 for(let i=N-1;i>=0;i--)ds.push(addDays(now,-i));
 const vals=ds.map(d=>C.days[d]?C.days[d].total:0);
 const maxA=Math.max(50,...vals.map(Math.abs));const step=maxA>200?100:maxA>100?50:25;
 const top=Math.ceil(Math.max(50,...vals)/step)*step,bot=Math.floor(Math.min(0,...vals)/step)*step;
 const y=v=>T+(top-v)/(top-bot)*(H-T-B),bw=(W-L-R)/N;
 let g='';for(let v=bot;v<=top;v+=step)g+=`<line class="gridl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${String(v).replace('-','−')}</text>`;
 const bars=ds.map((d,i)=>{const v=vals[i],x=L+i*bw,bh=Math.abs(y(v)-y(0));
  const m=v?`<rect class="${v>0?'up':'dn'}" x="${x+1.5}" y="${v>0?y(v):y(0)}" width="${Math.max(2,bw-3)}" height="${Math.max(1,bh)}" rx="2"/>`:'';
  const lab=(N-1-i)%5===0?`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle">${parse(d).getDate()}.${pad(parse(d).getMonth()+1)}</text>`:'';
  return m+lab+`<rect class="hit" x="${x}" y="${T}" width="${bw}" height="${H-T-B}" data-act="openday" data-v="${d}" data-tip="${esc(shortDate(d))}: ${sg(v)||'0'}"/>`}).join('');
 return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Баллы по дням за последние 30 дней">${g}<line class="base" x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}"/>${bars}</svg>`;
}

  </ol></section>
  <div class="rules">
   <section class="sheet pad"><h2 class="sec">Цены дел</h2><div class="setrow"><span class="hd">Дело</span><span class="hd">Баллы</span><span class="hd" style="text-align:center">Видно</span></div>${std}</section>
   <div style="display:grid;gap:18px;align-content:start">
   <section class="sheet pad"><h2 class="sec">Своё дело или штраф</h2>
    <div style="display:grid;gap:8px"><input type="text" id="c-name" placeholder="Например, английский" aria-label="Название дела">
    <div class="inline"><select id="c-group" aria-label="Раздел">${Object.keys(GROUPS).map(g=>`<option value="${g}">${GROUPS[g]}</option>`).join('')}</select><select id="c-kind" aria-label="Как отмечать"><option value="count">Считать штуки</option><option value="toggle">Сделано или нет</option></select></div>
    <select id="c-stat" aria-label="Что качает"><option value="">Качает: по разделу</option>${STATS.map(s=>`<option value="${s.k}">Качает: ${esc(s.name.toLowerCase())}</option>`).join('')}</select>
    <div class="inline"><input type="number" id="c-pts" placeholder="Баллы, минус для штрафа" aria-label="Баллы"><button class="btn" id="c-add" data-act="cadd">Добавить</button></div></div></section>
   <section class="sheet pad"><h2 class="sec">Штрафы и цели</h2>
    <label class="chk"><input type="checkbox" id="s-auto" data-chg="auto" ${S.auto?'checked':''}> Считать автоштрафы</label>
    <div class="field"><label for="pt-auto_nostudy">День без учёбы</label><input type="number" id="pt-auto_nostudy" data-chg="pts" data-id="auto_nostudy" value="${autoNoStudy()}"></div>
    <div class="field"><label for="pt-auto_sat">Пропуск субботы</label><input type="number" id="pt-auto_sat" data-chg="pts" data-id="auto_sat" value="${autoSat()}"></div>
    <div class="field"><label for="pt-boss">Награда за босса</label><input type="number" id="pt-boss" data-chg="pts" data-id="boss" value="${bossBonus()}"></div>
    <div class="field"><label for="pt-topic_day">Тема дня</label><input type="number" id="pt-topic_day" data-chg="pts" data-id="topic_day" value="${topicDayPts()}"></div>
    <div class="field"><label for="pt-topic_week">Тема недели</label><input type="number" id="pt-topic_week" data-chg="pts" data-id="topic_week" value="${topicWeekPts()}"></div>
    <div class="field"><label for="g-lecture">Лекций в неделю</label><input type="number" min="1" id="g-lecture" data-chg="goal" data-id="lecture" value="${S.goals.lecture}"></div>
    <div class="field"><label for="g-tasks">Задач в неделю</label><input type="number" min="1" id="g-tasks" data-chg="goal" data-id="tasks" value="${S.goals.tasks}"></div>
    <div class="field"><label for="g-bike">Поездок в неделю</label><input type="number" min="1" id="g-bike" data-chg="goal" data-id="bike" value="${S.goals.bike}"></div>
    <label class="chk" style="margin-top:6px"><input type="checkbox" id="s-sound" data-chg="sound" ${S.sound?'checked':''}> Звук при отметках</label></section>
   <section class="sheet pad"><h2 class="sec">Данные</h2>
    <p class="small" style="margin:0 0 8px">${saveMode==='account'?'Сохраняется в твоём аккаунте, другим не видно. Откроется и на других устройствах.':'Сохраняется только в этом браузере. Сделай копию, чтобы не потерять.'}</p>
    <div class="inline"><button class="btn ghost" id="exp" data-act="export">${showExport?'Скрыть копию':'Показать копию данных'}</button></div>
    ${showExport?`<textarea id="exptext" readonly aria-label="Копия данных" style="margin-top:8px">${esc(JSON.stringify(S))}</textarea><div class="inline" style="margin-top:6px"><button class="btn ghost" id="copy" data-act="copy">Скопировать</button></div>`:''}
    <textarea id="imp" placeholder="Вставь сюда копию, чтобы восстановить" aria-label="Восстановить из копии" style="margin-top:8px"></textarea>
    <div class="inline" style="margin-top:6px"><button class="btn ghost" id="impb" data-act="import">Восстановить</button></div>
    ${importMsg?`<p class="small" role="status" style="margin:6px 0 0">${esc(importMsg)}</p>`:''}
    <div class="inline" style="margin-top:12px">${confirmReset?`<button class="btn red" id="res2" data-act="reset2">Да, стереть всё</button><button class="btn ghost" id="res0" data-act="reset0">Отмена</button>`:`<button class="btn red" id="res1" data-act="reset1">Начать игру заново</button>`}</div></section>
   </div></div></div>`;
}
function render(){
 const fid=document.activeElement&&document.activeElement.id;
 const C=computeAll();
 const v={today:todayView,hero:heroView,quests:questsView,topics:topicsView,journal:journalView,ach:achView,shop:shopView,rules:rulesView}[tab](C);
 $('#app').innerHTML=header(C)+'<main>'+v+'</main>';
 photonNow=false;
 if(fid){const el=document.getElementById(fid);if(el)try{el.focus({preventScroll:true})}catch(e){}}
 return C;
}

/* ---------- Обратная связь ---------- */
let actx=null;
function beep(up){if(!S.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=up?740:210;if(up)o.frequency.exponentialRampToValueAtTime(1100,actx.currentTime+.09);g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.16);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.17)}catch(e){}}
function floatAt(ev,n){if(!n)return;const el=document.createElement('div');el.className='fl'+(n<0?' neg':'');el.textContent=sg(n);el.style.left=Math.min(innerWidth-70,Math.max(8,(ev.clientX||innerWidth/2)-14))+'px';el.style.top=Math.max(8,(ev.clientY||innerHeight/2)-26)+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),950)}
function toast(t,s){const el=document.createElement('div');el.className='toast';el.innerHTML=`<b>${esc(t)}</b>${s?esc(s):''}`;$('#toasts').appendChild(el);setTimeout(()=>el.remove(),3800)}
function levelUp(i){const r=RANKS[i],o=$('#lvl');o.innerHTML=`<div class="inner"><div class="note">Новый масштаб!</div><h2>${esc(r[0])}</h2><div class="sz">${r[1]}</div><div class="small">Уровень ${i+1}</div><button class="btn" id="lvlok" data-act="lvlok">Дальше</button></div>`;o.hidden=false;const b=$('#lvlok');if(b)b.focus()}
const achSet=C=>new Set(ACH.filter(a=>a[3](C.T)>=a[4]).map(a=>a[1]));
function commit(fn,ev){
 const b=computeAll(),bo=b.days[view]?orbitOf(b.days[view].total):0;
 fn();persist();
 const a=computeAll(),ao=a.days[view]?orbitOf(a.days[view].total):0;
 if(ao>bo)photonNow=true;
 const d=a.exp-b.exp;render();
 if(ev&&d){floatAt(ev,d);beep(d>0)}
 const s1=achSet(b),s2=achSet(a);s2.forEach(n=>{if(!s1.has(n))toast('Достижение',n)});
 if(ao>bo&&ao>=3)toast('Квантовый скачок','Электрон на орбите '+(ao+1));
 STATS.forEach(s=>{if(a.sl[s.k]>b.sl[s.k])toast(s.name+': уровень '+a.sl[s.k],a.sl[s.k]>=TAL_LVL&&b.sl[s.k]<TAL_LVL?'Открыт талант «'+TAL[s.k][0]+'»':'')});
 if(a.lvl>b.lvl)levelUp(a.lvl);
 const m=monday(view),wb=bossState(m);if(wb.win&&a.T.boss>b.T.boss)toast('Энтропия побеждена','+'+bossBonus()+' к счёту');
}
function dayLog(d){if(!S.days[d])S.days[d]={a:{},type:'normal'};if(!S.days[d].a)S.days[d].a={};return S.days[d]}
function cleanup(d){const L=S.days[d];if(L&&!Object.keys(L.a||{}).length&&(L.type||'normal')==='normal'&&!L.chest&&!L.tdone&&!L.tpick&&!L.tnote&&!L.wk&&!L.qm&&!L.qe&&!L.ql&&!(L.q&&L.q.length))delete S.days[d]}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36)}

/* ---------- События ---------- */
document.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-act]');if(!t)return;
 const act=t.dataset.act,id=t.dataset.id,val=t.dataset.v;
 const simple={
  tab(){tab=val;confirmReset=false;importMsg='';render();scrollTo(0,0)},
  day(){const n=addDays(view,+val);if(n<=today()){view=n;render()}},
  gotoday(){view=today();render()},
  openday(){view=val;tab='today';hideTip();render();scrollTo(0,0)},
  lvlok(){$('#lvl').hidden=true},
  more(){extraOpen=!extraOpen;render()},
  export(){showExport=!showExport;render()},
  copy(){const x=$('#exptext');const done=()=>toast('Скопировано');if(navigator.clipboard)navigator.clipboard.writeText(x.value).then(done).catch(()=>{x.select()});else x.select()},
  theme(){toggleTheme()},
  reset1(){confirmReset=true;render()},reset0(){confirmReset=false;render()},
 };
 if(simple[act])return simple[act]();
 const mut={
  inc(){const L=dayLog(view);L.a[id]=(L.a[id]||0)+1},
  dec(){const L=dayLog(view);L.a[id]=Math.max(0,(L.a[id]||0)-1);if(!L.a[id])delete L.a[id];cleanup(view)},
  toggle(){const L=dayLog(view);if(L.a[id])delete L.a[id];else L.a[id]=1;cleanup(view)},
  choice(){const L=dayLog(view);if(L.a[id]===val)delete L.a[id];else L.a[id]=val;cleanup(view)},
  type(){const L=dayLog(view);L.type=val;cleanup(view)},
  chest(){dayLog(view).chest=true},
  tdone(){const L=dayLog(view);if(L.tdone){delete L.tdone}else{L.tpick=dayTopic(view).id;L.tdone=1;toast('Тема дня изучена',dayTopic(view).title)}},
  tswap(){const cur=dayTopic(view),L=dayLog(view);delete L.tnote;L.tpick=nextTopic(TOPICS,TOPICS.indexOf(cur)+1,seenDays(),cur.id).id},
  wdone(){const m=monday(view),W=weekRec(m);if(W.day){const L=S.days[W.day];if(L){delete L.wk;cleanup(W.day)}delete W.day}else{W.pick=weekTopic(m).id;W.day=view;dayLog(view).wk=1;toast('Тема недели изучена',weekTopic(m).title)}},
  wswap(){const m=monday(view),cur=weekTopic(m),W=weekRec(m);delete W.note;W.pick=nextTopic(WEEKLY,WEEKLY.indexOf(cur)+1,seenWeeks(),cur.id).id},
  qtoggle(){const slot=t.dataset.slot||'',dd=t.dataset.d;
   if(dd){const L=S.days[dd];if(L&&L.q){L.q=L.q.filter(x=>x!==id);if(!L.q.length)delete L.q;cleanup(dd)}return}
   const L=dayLog(view);if(slot==='m')L.qm=id;if(slot==='e')L.qe=id;if(slot==='l')L.ql=id;
   if(slot[0]==='w'){const m=monday(view);weekRec(m).qp=weekQ(m).map(x=>x.id)}
   L.q=(L.q||[]).concat(id);toast('Квест выполнен',AQ[id]?AQ[id].title:'')},
  qswap(){const slot=t.dataset.slot,s=qSeen();
   if(QLIST[slot]){const list=QLIST[slot],cur=AQ[id],L=dayLog(view);L['q'+slot]=nextTopic(list,list.indexOf(cur)+1,s,cur.id).id;return}
   const m=monday(view),cur=weekQ(m),i=+slot[1],other=cur[1-i];s.add(other.id);
   const n=nextTopic(QW,QW.indexOf(cur[i])+1,s,cur[i].id);if(n.id===other.id||n.id===cur[i].id)return;
   cur[i]=n;weekRec(m).qp=cur.map(x=>x.id)},
  buy(){const r=S.rewards.find(x=>x.id===id);if(!r)return;S.buys.push({name:r.name,cost:r.cost,date:today(),ts:Date.now()});toast('Куплено',r.name+' за '+r.cost)},
  refund(){S.buys=S.buys.filter(b=>String(b.ts)!==val);toast('Баллы вернулись на счёт')},
  rdel(){S.rewards=S.rewards.filter(x=>x.id!==id)},
  radd(){const n=$('#newr-name').value.trim(),c=parseInt($('#newr-cost').value,10);if(!n||!(c>0)){toast('Нужны название и цена больше нуля');return}S.rewards.push({id:uid('r'),name:n.slice(0,80),cost:c})},
  cadd(){const n=$('#c-name').value.trim(),p=parseInt($('#c-pts').value,10);if(!n||!Number.isFinite(p)||p===0){toast('Нужны название и баллы, не ноль');return}const st=$('#c-stat').value;S.custom.push(Object.assign({id:uid('c'),group:$('#c-group').value,kind:$('#c-kind').value,name:n.slice(0,80),note:'',pts:Math.max(-999,Math.min(999,p))},st?{stat:st}:{}))},
  cdel(){S.custom=S.custom.filter(x=>x.id!==id)},
  cqadd(){const n=$('#cq-name').value.trim(),p=parseInt($('#cq-pts').value,10);if(!n||!(p>0)){toast('Нужны название и баллы больше нуля');return}if(!S.cq)S.cq=[];S.cq.push({id:uid('qc'),title:n.slice(0,80),stat:$('#cq-stat').value,pts:Math.min(200,p),rep:$('#cq-rep').checked});toast('Квест добавлен',n.slice(0,80))},
  cqdel(){const c=(S.cq||[]).find(x=>x.id===id);if(c)c.gone=1},
  import(){try{const o=JSON.parse($('#imp').value);if(!o||typeof o.days!=='object')throw 0;S=normalize(o);importMsg='Данные восстановлены.'}catch(e){importMsg='Текст не похож на копию данных. Вставь его целиком.'}},
  reset2(){S=fresh();view=today();confirmReset=false},
 };
 if(mut[act])commit(mut[act],ev);
});
document.addEventListener('change',ev=>{
 const t=ev.target,k=t.dataset&&t.dataset.chg;if(!k)return;const id=t.dataset.id;
 const n=parseInt(t.value,10);
 commit(()=>{
  if(k==='pts'&&Number.isFinite(n))S.pts[id]=Math.max(-999,Math.min(999,n));
  if(k==='vis'){if(t.checked)delete S.hidden[id];else S.hidden[id]=1}
  if(k==='goal'&&n>0)S.goals[id]=Math.min(9999,n);
  if(k==='auto')S.auto=t.checked;
  if(k==='sound')S.sound=t.checked;
  if(k==='tnote'){const v=t.value.trim().slice(0,600),L=dayLog(view);if(v){L.tnote=v;if(!L.tpick)L.tpick=dayTopic(view).id}else{delete L.tnote;cleanup(view)}}
  if(k==='wnote'){const m=monday(view),W=weekRec(m),v=t.value.trim().slice(0,1500);if(v){W.note=v;if(!W.pick)W.pick=weekTopic(m).id}else delete W.note}
  if(k==='rname'&&t.value.trim()){const r=S.rewards.find(x=>x.id===id);if(r)r.name=t.value.trim().slice(0,80)}
  if(k==='rcost'&&n>0){const r=S.rewards.find(x=>x.id===id);if(r)r.cost=n}
 });
});
const tip=$('#tip');function hideTip(){tip.hidden=true}
document.addEventListener('pointermove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(!t){hideTip();return}tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(innerWidth-150,e.clientX+12)+'px';tip.style.top=Math.max(4,e.clientY-34)+'px'});

/* ---------- Смена суток, пока вкладка открыта ---------- */
let lastDay=today();
let lastH=new Date().getHours();
setInterval(()=>{const n=today(),h=new Date().getHours();
 if(n!==lastDay){if(view===lastDay)view=n;lastDay=n;render()}
 else if(lastH<EVENING_H&&h>=EVENING_H){render();toast('Открылся вечерний квест',dayQ(n,'e').title)}
 lastH=h},60000);

try{matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme)render()})}catch(e){}
render();
connect();
</script>
