/* Единый облик: дерево и пергамент, чёткие пиксели, никакого сглаживания у картинок */
:root {
  color-scheme: light;
  --ink: #4a2410; --ink2: #7a4a22; --paper: #fbdc9f; --paper2: #f4c67e; --paper3: #e8ad62;
  --wood: #b5651d; --wood-l: #e0953f; --wood-d: #6b3410; --ok: #4f8a2a; --bad: #c0392b; --gold: #ffd93b;
  --font: 'DotGothic16', 'Trebuchet MS', 'Segoe UI', sans-serif;
  --head: 'Press Start 2P', 'DotGothic16', monospace;
  --logo: 'Pixelify Sans', 'DotGothic16', sans-serif;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: #1b1420; overscroll-behavior: none; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: none; font-size: 20px; line-height: 1.3; letter-spacing: -1px; touch-action: none; user-select: none; -webkit-user-select: none; }
canvas, img, .px { image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
#game { position: fixed; left: 0; top: 0; display: block; cursor: default; }
button { font-family: var(--font); color: inherit; letter-spacing: -1px; }
.title, .logo, #clock .goldbox b { letter-spacing: 0; }
.row.wrap > .grow { flex: 1 1 200px; }
input, select, textarea { font-family: var(--font); font-size: 17px; color: var(--ink); background: #fff3d2; border: 3px solid var(--wood-d); padding: 4px 6px; border-radius: 0; user-select: text; -webkit-user-select: text; }

a { color: #1d5f8a; }

.frame { border-style: solid; border-width: 15px; border-color: var(--wood); background: var(--paper); background-clip: padding-box; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; cursor: pointer; font-size: 18px; font-weight: 600; color: #fff6dc; padding: 6px 12px 8px; background: #c97a2b; box-shadow: inset 0 3px 0 #f0ab5a, inset 0 -3px 0 #8a4a15, inset 3px 0 0 #e0953f, inset -3px 0 0 #a65f1d, 0 0 0 3px var(--wood-d), 0 3px 0 3px #2c150a; text-shadow: 2px 2px 0 #6b3410; }
.btn:hover { background: #dd8b36; }

.btn[disabled] { filter: grayscale(.75) brightness(.95); cursor: default; }
.btn.green { background: #5f9e2f; box-shadow: inset 0 3px 0 #9ad25a, inset 0 -3px 0 #3c6e1a, inset 3px 0 0 #7fbc42, inset -3px 0 0 #4a8020, 0 0 0 3px #274a10, 0 3px 0 3px #17300a; text-shadow: 2px 2px 0 #2c5a10; }
.btn.green:hover { background: #6db136; }
.btn.red { background: #bf4a35; box-shadow: inset 0 3px 0 #ea8366, inset 0 -3px 0 #812a1a, inset 3px 0 0 #d6614a, inset -3px 0 0 #9a3724, 0 0 0 3px #4d170c, 0 3px 0 3px #2c0d06; text-shadow: 2px 2px 0 #6a2010; }
.btn.small { font-size: 18px; padding: 2px 8px 4px; }
.btn.flat { background: var(--paper2); color: var(--ink); text-shadow: none; box-shadow: inset 0 2px 0 #ffe9bd, inset 0 -2px 0 #c98f48, 0 0 0 2px var(--wood-d); }
.btn.flat:hover { background: #ffd894; }
.btn img { width: 24px; height: 24px; }

/* HUD */
#hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
#hud > * { pointer-events: auto; }
#menubtns { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; display: flex; gap: 6px; }
.mbtn { position: relative; width: 54px; height: 54px; padding: 0; border: 0; cursor: pointer; background: var(--paper); box-shadow: inset 0 0 0 3px var(--wood-l), inset 0 0 0 6px var(--wood), 0 0 0 3px var(--wood-d), 0 3px 0 3px rgba(30,10,0,.5); display: grid; place-items: center; }
.mbtn:hover { background: #ffe9bd; transform: translateY(-1px); }
.mbtn img { width: 32px; height: 32px; }
.mbtn .badge { position: absolute; right: -6px; top: -6px; min-width: 22px; height: 22px; padding: 0 3px; background: #d4493f; color: #fff; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 2px #fff, 0 0 0 4px #4d170c; display: grid; place-items: center; animation: nudge 1.2s steps(3) infinite; }
.mbtn .key { position: absolute; left: 3px; bottom: 0; font-size: 12px; color: var(--ink2); font-weight: 600; }
@keyframes nudge { 50% { transform: translateY(-2px); } }

#clock { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; width: 190px; padding: 2px 4px 3px; text-align: center; font-weight: 600; }
#clock .d { font-size: 20px; line-height: 1.15; }
#clock .sep { height: 3px; background: var(--paper3); margin: 3px 0; }
#clock .row { display: flex; justify-content: center; align-items: center; gap: 6px; font-size: 19px; }
#clock .row img { width: 24px; height: 24px; }
#clock .goldbox { margin-top: 3px; background: #8a4a15; box-shadow: inset 0 3px 0 #5e2f0a; padding: 2px 6px; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
#clock .goldbox b { font-family: var(--head); font-weight: 400; color: #ff9a6a; font-size: 16px; text-shadow: 2px 2px 0 #3a1a06; font-variant-numeric: tabular-nums; }
#clock .goldbox img { width: 20px; height: 20px; margin-right: auto; }
#clock .cloud { font-size: 12px; font-weight: 400; color: var(--ink2); }

#bars { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 12px; display: flex; gap: 8px; align-items: flex-end; }
.bar { width: 28px; height: 150px; position: relative; background: #4a2a10; box-shadow: 0 0 0 3px var(--wood-l), 0 0 0 6px var(--wood-d), 0 3px 0 6px rgba(30,10,0,.5); }
.bar i { position: absolute; left: 3px; right: 3px; bottom: 3px; display: block; background: #62c23a; box-shadow: inset 4px 0 0 rgba(255,255,255,.3), inset -4px 0 0 rgba(0,0,0,.14); transition: height .15s steps(5); }
.bar.hp i { background: #e5484d; }
.bar b { position: absolute; left: 50%; transform: translateX(-50%); top: -31px; width: 26px; height: 26px; display: grid; place-items: center; }
.bar b img { width: 24px; height: 24px; }
.bar.low i { animation: lowb .6s steps(2) infinite; }
@keyframes lowb { 50% { filter: brightness(1.5); } }

#toolbar { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 0; padding: 0; border-width: 9px; background-color: #f4c67e; max-width: calc(100vw - 110px); overflow-x: auto; scrollbar-width: none; }
.slot { position: relative; width: 50px; height: 50px; flex: 0 0 50px; display: grid; place-items: center; background: #f7cf8c; box-shadow: inset 0 0 0 2px #c98f48, inset 3px 3px 0 #d9a35c; cursor: pointer; padding: 0; border: 0; }
.slot img { width: 40px; height: 40px; pointer-events: none; }
.slot .n { position: absolute; right: 3px; bottom: 0; font-size: 18px; font-weight: 700; color: #fff; text-shadow: 1px 1px 0 #3a1a06, -1px -1px 0 #3a1a06, 1px -1px 0 #3a1a06, -1px 1px 0 #3a1a06; pointer-events: none; }
.slot .k { position: absolute; left: 3px; top: 0; font-size: 11px; color: var(--ink2); pointer-events: none; }
.slot.sel { box-shadow: inset 0 0 0 3px #e5302a, inset 0 0 0 4px #ffb0a0; background: #ffe0a8; z-index: 1; }
.slot:hover { background: #ffe0a8; }
#hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); background: rgba(50,24,10,.88); color: #fff3d2; font-size: 17px; font-weight: 600; padding: 3px 10px 4px; white-space: nowrap; box-shadow: 0 0 0 3px #2c150a; pointer-events: auto; cursor: pointer; }
#hint kbd { font: inherit; color: #ffd93b; }
#toasts { position: fixed; z-index: 70; left: 50%; top: 14px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; width: min(70vw, 540px); }
.toast { background: var(--paper); box-shadow: 0 0 0 3px var(--wood), 0 0 0 6px var(--wood-d); padding: 3px 10px 5px; font-weight: 600; text-align: center; animation: tin .18s steps(3), tout .3s steps(3) 2.6s forwards; }
.toast.warn { background: #ffd0b8; }
@keyframes tin { from { transform: translateY(-14px); opacity: 0; } }
@keyframes tout { to { opacity: 0; transform: translateY(-8px); } }

/* Оверлей меню */
#screen { position: fixed; inset: 0; z-index: 20; background: rgba(20,10,20,.55); display: flex; align-items: center; justify-content: center; padding: max(6px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.menu { position: relative; width: min(1040px, 100%); height: min(690px, 100%); display: flex; flex-direction: column; min-height: 0; }
.menu.frame { padding: 0; }
.tabs { position: absolute; left: 10px; top: 6px; display: flex; gap: 3px; z-index: 2; }
.menuwrap { position: relative; width: min(1080px, 100%); max-height: 100%; padding-top: 54px; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0; }
.menuwrap .menu { height: auto; min-height: 0; width: 100%; box-sizing: border-box; }
.tab { height: 48px; width: 56px; padding: 0 0 4px; cursor: pointer; border: 0; background: var(--paper3); display: grid; place-items: center; box-shadow: inset 0 3px 0 var(--wood-l), inset 3px 0 0 var(--wood-l), inset -3px 0 0 var(--wood), 0 0 0 3px var(--wood-d); }
.tab img { width: 32px; height: 32px; }
.tab.on { background: var(--paper); height: 54px; margin-top: -6px; }
.tab:hover { filter: brightness(1.07); }
.close { position: absolute; right: 8px; top: 4px; z-index: 3; width: 44px; height: 44px; padding: 0; font-size: 26px; }
.body { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 14px; touch-action: pan-y; scrollbar-color: var(--wood) var(--paper2); }
.body::-webkit-scrollbar { width: 14px; } .body::-webkit-scrollbar-thumb { background: var(--wood); box-shadow: inset 0 0 0 3px var(--wood-l), inset 0 0 0 5px var(--wood-d); } .body::-webkit-scrollbar-track { background: var(--paper2); }
.title { font-family: var(--head); font-size: 22px; line-height: 1.35; font-weight: 400; color: #5b2b0d; }
.sub { color: var(--ink2); font-size: 18px; }
.cols { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 14px; }
@media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; }
.sheet { background: #ffe9bd; box-shadow: inset 0 0 0 2px #c98f48, inset 3px 3px 0 #f6cf8c; padding: 8px 10px; }
.sheet.dim { background: #f3d398; }
.sheet.done { background: #dff0a8; box-shadow: inset 0 0 0 2px #7ea63c, inset 3px 3px 0 #c8e080; }
.sheet.miss { background: #ffd4c0; box-shadow: inset 0 0 0 2px #c0604a; }
.ti { width: 40px; height: 40px; flex: none; }
.tname { font-size: 22px; font-weight: 700; line-height: 1.1; }
.chips { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 18px; color: var(--ink2); margin-top: 2px; }
.chip { display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.chip img { width: 16px; height: 16px; }
.chip.bad { color: var(--bad); font-weight: 600; }
.chip.must { background: #c0392b; color: #fff; padding: 0 6px; font-size: 16px; }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 9px; height: 9px; background: #d9a35c; box-shadow: inset 0 0 0 1px #7a4a22; }
.pips i.on { background: #5f9e2f; }
.meter { height: 16px; background: #4a2a10; padding: 3px; box-shadow: 0 0 0 2px #2c150a; }
.meter i { display: block; height: 100%; background: #b264e0; box-shadow: inset 0 3px 0 rgba(255,255,255,.3); transition: width .3s steps(6); }
.meter.xp i { background: #e9a82c; }
.seg { display: inline-flex; box-shadow: 0 0 0 2px var(--wood-d); }
.seg button { border: 0; background: var(--paper2); padding: 2px 10px 4px; font-size: 16px; font-weight: 600; cursor: pointer; }
.seg button.on { background: var(--wood); color: #fff3d2; }
.fly { position: fixed; z-index: 60; font-weight: 700; font-size: 26px; color: #fff; text-shadow: 2px 2px 0 #3a1a06, -2px -2px 0 #3a1a06, 2px -2px 0 #3a1a06, -2px 2px 0 #3a1a06; pointer-events: none; display: flex; align-items: center; gap: 5px; animation: flyup 1.1s steps(14) forwards; }
.fly img { width: 28px; height: 28px; }
@keyframes flyup { to { transform: translateY(-70px); opacity: 0; } }
.bossimg { width: 104px; height: 104px; display: block; margin: 0 auto; }
.bossimg.hit { animation: bhit .3s steps(3); }
@keyframes bhit { 30% { transform: translateX(-6px); filter: brightness(2); } 60% { transform: translateX(6px); } }

/* Рюкзак */
.invgrid { display: grid; grid-template-columns: repeat(auto-fill, 50px); gap: 2px; }
.invgrid .slot.pick { box-shadow: inset 0 0 0 3px #2f7fbf; background: #cde9ff; }
/* Навыки */
.stars { display: inline-flex; gap: 2px; flex-wrap: wrap; }
.stars span { width: 16px; height: 16px; background-size: 16px; }
.portrait { width: 192px; height: 192px; box-shadow: 0 0 0 3px var(--wood-l), 0 0 0 6px var(--wood-d); flex: none; }
.portrait.s { width: 128px; height: 128px; }
/* Знания */
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px; }
.tcard { display: flex; gap: 6px; align-items: center; padding: 5px 7px; cursor: pointer; border: 0; text-align: left; font-size: 15px; line-height: 1.1; background: #f3d398; box-shadow: inset 0 0 0 2px #c98f48; }
.tcard img { width: 28px; height: 28px; flex: none; }
.tcard.got { background: #ffe9bd; }
.tcard.lock { color: #9a7a50; }
.tcard.lock img { filter: grayscale(1) opacity(.55); }
.tcard:hover { background: #ffdf9f; }
.reading { font-size: 20px; line-height: 1.35; max-width: 65ch; }
.opt { display: block; width: 100%; text-align: left; border: 0; padding: 7px 10px 8px; font-size: 18px; cursor: pointer; background: #ffe9bd; box-shadow: inset 0 0 0 2px #c98f48; margin-bottom: 6px; font-weight: 500; }
.opt:hover { background: #fff4d6; }
.opt.right { background: #c6e68a; box-shadow: inset 0 0 0 2px #4f8a2a; }
.opt.wrong { background: #ffc0a8; box-shadow: inset 0 0 0 2px #c0392b; }
/* Лавка */
.shopwrap { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 14px; height: 100%; min-height: 0; }
@media (max-width: 760px) { .shopwrap { grid-template-columns: minmax(0, 1fr); } .shopwrap .portrait { width: 96px; height: 96px; } .keeper { flex-direction: row !important; text-align: left !important; } }
.keeper { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-width: 0; }
.bubble { background: #fff3d2; box-shadow: inset 0 0 0 2px #c98f48; padding: 8px; font-size: 16px; line-height: 1.2; }
.price { display: inline-flex; gap: 4px; align-items: center; font-weight: 700; white-space: nowrap; }
.price img { width: 22px; height: 22px; }

/* Диалог как в фермерских играх: текст слева, портрет справа */
#dlg { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(960px, calc(100vw - 32px)); z-index: 40; display: flex; gap: 0; }
#dlg .txt { flex: 1; min-width: 0; min-height: 180px; padding: 6px 12px; font-size: 22px; line-height: 1.3; cursor: pointer; display: flex; flex-direction: column; }
#dlg .opts { display: flex; flex-direction: column; gap: 6px; margin-top: auto; padding-top: 10px; }
#dlg .opts .opt { margin: 0; font-size: 19px; }
#dlg .who { flex: none; width: 222px; text-align: center; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; margin-left: -6px; }
#dlg .who img { width: 192px; height: 192px; box-shadow: 0 0 0 3px #c98f48; }
#dlg .who b { display: block; font-size: 20px; padding: 4px 0 2px; }
#dlg .more { position: absolute; right: 250px; bottom: 26px; animation: nudge .8s steps(2) infinite; color: var(--wood); font-size: 22px; }
@media (max-width: 640px) { #dlg .who { width: 104px; } #dlg .who img { width: 96px; height: 96px; } #dlg .who b { font-size: 15px; } #dlg .txt { font-size: 18px; min-height: 140px; } #dlg .more { right: 120px; } }

/* Отчёт о дне */
.report { width: min(680px, 100%); max-height: 100%; display: flex; flex-direction: column; min-height: 0; }
.report .body { padding: 10px 14px; }
.rline { display: flex; align-items: center; gap: 8px; padding: 3px 0; border-bottom: 2px dotted #d9a35c; font-size: 19px; }
.rline img { width: 28px; height: 28px; }
.rline .v { margin-left: auto; font-weight: 700; white-space: nowrap; }
.rline .v.plus { color: var(--ok); } .rline .v.minus { color: var(--bad); }
.foot { padding: 8px 14px 10px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; background: var(--paper2); }
.levelup { text-align: center; padding: 18px; max-width: 480px; }
.levelup img { width: 96px; height: 96px; animation: nudge .7s steps(2) infinite; }

/* Заставка */
#title { position: fixed; inset: 0; z-index: 50; background: #6db8e8; overflow: hidden; }
#titlec { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
#titleui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 5vh 16px 16px; gap: 2vh; text-align: center; overflow: auto; }
.logo { font-family: var(--logo); font-weight: 700; line-height: .95; font-size: clamp(44px, 10vw, 118px); color: #ffd23f; letter-spacing: 2px; text-shadow: 0 5px 0 #d9722a, 0 9px 0 #8a3f12, 5px 5px 0 #4d2008, -5px 5px 0 #4d2008, 5px -3px 0 #4d2008, -5px -3px 0 #4d2008, 0 -5px 0 #4d2008, 0 14px 0 rgba(30,20,40,.3); }
.logo small { display: block; font-size: .72em; color: #a4e36a; text-shadow: 0 4px 0 #4f8a2a, 0 8px 0 #285a14, 5px 4px 0 #1f3f10, -5px 4px 0 #1f3f10, 5px -3px 0 #1f3f10, -5px -3px 0 #1f3f10, 0 -5px 0 #1f3f10, 0 13px 0 rgba(30,20,40,.3); margin-top: .12em; }
.tagline { color: #fff; font-size: clamp(17px, 2.2vw, 24px); font-weight: 600; text-shadow: 2px 2px 0 #245a80; }
.titlebox { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 6px 10px; margin-top: auto; margin-bottom: 3vh; }
.titlebox .btn { font-size: 24px; padding: 8px 26px 11px; min-width: 240px; }

/* Сенсорное управление */
#touch { position: absolute; inset: 0; pointer-events: none; }
#joy { position: absolute; left: max(18px, env(safe-area-inset-left, 0px)); bottom: 90px; width: 118px; height: 118px; background: rgba(255,240,200,.18); box-shadow: 0 0 0 3px rgba(60,30,10,.55); border-radius: 50%; pointer-events: auto; touch-action: none; }
#joyk { position: absolute; left: 34px; top: 34px; width: 50px; height: 50px; background: var(--wood-l); box-shadow: 0 0 0 3px var(--wood-d), inset 0 4px 0 #ffc47a; border-radius: 50%; }
.tbtn { position: absolute; pointer-events: auto; border: 0; font-weight: 700; color: #fff6dc; width: 66px; height: 66px; font-size: 18px; background: #c97a2b; box-shadow: 0 0 0 3px var(--wood-d), inset 0 4px 0 #f0ab5a; border-radius: 50%; text-shadow: 2px 2px 0 #6b3410; touch-action: none; }
#btnA { right: 26px; bottom: 90px; background: #5f9e2f; box-shadow: 0 0 0 3px #274a10, inset 0 4px 0 #9ad25a; }
#btnB { right: 96px; bottom: 92px; }
.touch #bars .bar { height: 96px; }
.touch #toolbar .slot { width: 42px; height: 42px; flex-basis: 42px; }
.touch #toolbar .slot img { width: 32px; height: 32px; }
.touch #toolbar .k, .touch .mbtn .key { display: none; }
@media (max-width: 620px) { .trow { flex-wrap: wrap; } .trow > .grow { flex: 1 1 60%; } .trow > .row:last-child { margin-left: auto; } .title { font-size: 17px; } }
.touch #toolbar { left: 8px; transform: none; max-width: calc(100vw - 96px); }
@media (max-width: 720px) { #clock { width: 172px; border-width: 12px; } #clock .d, #clock .row { font-size: 16px; } #clock .goldbox b { font-size: 13px; } .mbtn { width: 44px; height: 44px; } .mbtn img { width: 26px; height: 26px; } .tab { width: 44px; } .tab img { width: 26px; height: 26px; } }
@media (prefers-reduced-motion: reduce) { .toast, .fly, .mbtn .badge, .bar.low i, .levelup img { animation-duration: .01s; } }

/* Приборы */
.instr { position: fixed; inset: 0; background: #04040e; }
#skyc { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.instr-top { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; pointer-events: none; }

.instr-bottom { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; pointer-events: none; }
#skyCard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(4,4,14,.55); }
.factcard { width: min(820px, 100%); max-height: 100%; overflow-y: auto; padding: 6px 10px; touch-action: pan-y; }
.factpic { width: 192px; height: 192px; flex: none; box-shadow: 0 0 0 3px #d9a24a, 0 0 0 6px #6b3410; margin: 6px; }
.micro { width: min(1000px, 100%); max-height: 100%; }
.micwrap { display: grid; grid-template-columns: minmax(0, 400px) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .micwrap { grid-template-columns: minmax(0, 1fr); } }
.miclens { display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; }
#micc { width: min(384px, 100%); aspect-ratio: 1; background: #0a0a12; border-radius: 50%; box-shadow: 0 0 0 5px #8a96a2, 0 0 0 9px #3f3a48; cursor: crosshair; touch-action: manipulation; }

.micfocus input { flex: 1; min-width: 0; padding: 0; accent-color: #b5651d; touch-action: pan-x; height: 24px; }
.micgrid { display: grid; grid-template-columns: repeat(auto-fill, 44px); gap: 4px; }

// ==== 01_gfx.js ====
/* Мини-движок пиксель-арта: всё рисуется кодом на низком разрешении, без сглаживания. */
const TILE = 16;
const OUT = '#3b2027'; // тёплый тёмный контур вместо чёрного: как в уютных фермерских играх

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return c;
}
function hash2(x, y, s = 0) {
  let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y, s = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function shade(hex, f) { // f<0 темнее, f>0 светлее, с тёплым сдвигом в тенях
  const [r, g, b] = rgb(hex);
  const m = f < 0
    ? [r * (1 + f) , g * (1 + f * 1.1), b * (1 + f * 0.8)]
    : [r + (255 - r) * f, g + (255 - g) * f, b + (240 - b) * f];
  return '#' + m.map(v => Math.max(0, Math.min(255, v | 0)).toString(16).padStart(2, '0')).join('');
}

class Painter {
  constructor(c) { this.c = c; this.g = c.getContext('2d'); this.g.imageSmoothingEnabled = false; }
  r(x, y, w, h, col) { this.g.fillStyle = col; this.g.fillRect(x, y, w, h); return this; }
  p(x, y, col) { this.g.fillStyle = col; this.g.fillRect(x, y, 1, 1); return this; }
  pts(col, list) { this.g.fillStyle = col; for (let i = 0; i < list.length; i += 2) this.g.fillRect(list[i], list[i + 1], 1, 1); return this; }
  ell(cx, cy, rx, ry, col) {
    this.g.fillStyle = col;
    for (let y = -ry; y <= ry; y++) {
      const t = ry === 0 ? 0 : y / (ry + 0.25);
      const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - t * t)));
      this.g.fillRect(Math.round(cx - hw), Math.round(cy + y), hw * 2 + 1, 1);
    }
    return this;
  }
  line(x0, y0, x1, y1, col) {
    this.g.fillStyle = col;
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    let dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, err = dx + dy;
    for (;;) {
      this.g.fillRect(x0, y0, 1, 1);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
    return this;
  }
  poly(points, col) { // заливка многоугольника построчно, без сглаживания
    let minY = 1e9, maxY = -1e9;
    points.forEach(q => { minY = Math.min(minY, q[1]); maxY = Math.max(maxY, q[1]); });
    this.g.fillStyle = col;
    for (let y = minY; y <= maxY; y++) {
      const xs = [];
      for (let i = 0; i < points.length; i++) {
        const a = points[i], b = points[(i + 1) % points.length];
        if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) / (b[1] - a[1]) * (b[0] - a[0]));
      }
      xs.sort((m, n) => m - n);
      for (let i = 0; i + 1 < xs.length; i += 2) this.g.fillRect(Math.round(xs[i]), y, Math.max(1, Math.round(xs[i + 1]) - Math.round(xs[i])), 1);
    }
    return this;
  }
  ascii(rows, pal, ox = 0, oy = 0) {
    rows.forEach((row, y) => {
      for (let x = 0; x < row.length; x++) {
        const col = pal[row[x]];
        if (col) { this.g.fillStyle = col; this.g.fillRect(ox + x, oy + y, 1, 1); }
      }
    });
    return this;
  }
  img(c, x = 0, y = 0) { this.g.drawImage(c, x, y); return this; }
}

function outline(c, col = OUT, corners = false) {
  const w = c.width, h = c.height, g = c.getContext('2d');
  const d = g.getImageData(0, 0, w, h), a = d.data, marks = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (a[(y * w + x) * 4 + 3] > 0) continue;
    const on = (i, j) => i >= 0 && j >= 0 && i < w && j < h && a[(j * w + i) * 4 + 3] > 0;
    if (on(x - 1, y) || on(x + 1, y) || on(x, y - 1) || on(x, y + 1) ||
      (corners && (on(x - 1, y - 1) || on(x + 1, y - 1) || on(x - 1, y + 1) || on(x + 1, y + 1)))) marks.push(x, y);
  }
  g.fillStyle = col;
  for (let i = 0; i < marks.length; i += 2) g.fillRect(marks[i], marks[i + 1], 1, 1);
  return c;
}
function spr(w, h, fn, ol) {
  const c = mkCanvas(w, h);
  fn(new Painter(c));
  if (ol !== false && ol !== undefined) outline(c, ol === true ? OUT : ol);
  return c;
}
function flipH(c) {
  const o = mkCanvas(c.width, c.height), g = o.getContext('2d');
  g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0);
  return o;
}
function tinted(c, col, alpha = 1) {
  const o = mkCanvas(c.width, c.height), g = o.getContext('2d');
  g.drawImage(c, 0, 0);
  g.globalCompositeOperation = 'source-atop'; g.globalAlpha = alpha;
  g.fillStyle = col; g.fillRect(0, 0, c.width, c.height);
  return o;
}
function rotated(c, deg) { // поворот без сглаживания (метод обратного отображения)
  const w = c.width, h = c.height, s = Math.ceil(Math.hypot(w, h)) + 2;
  const src = c.getContext('2d').getImageData(0, 0, w, h);
  const o = mkCanvas(s, s), g = o.getContext('2d'), out = g.createImageData(s, s);
  const t = deg * Math.PI / 180, cs = Math.cos(t), sn = Math.sin(t);
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const dx = x - s / 2 + 0.5, dy = y - s / 2 + 0.5;
    const ix = Math.floor(dx * cs + dy * sn + w / 2), iy = Math.floor(-dx * sn + dy * cs + h / 2);
    if (ix < 0 || iy < 0 || ix >= w || iy >= h) continue;
    const a = (iy * w + ix) * 4, b = (y * s + x) * 4;
    for (let k = 0; k < 4; k++) out.data[b + k] = src.data[a + k];
  }
  g.putImageData(out, 0, 0);
  return o;
}

function skateHeldVertical(d = DECK) {
  return spr(6, 19, p => {
    p.r(1, 1, 3, 17, d.base).r(2, 0, 1, 19, d.base);
    p.r(1, 1, 1, 17, d.light).r(3, 2, 1, 15, d.dark);

    p.r(0, 14, 1, 2, d.wheel).r(4, 14, 1, 2, d.wheel);

function skateSide(d = DECK) {

    const ox = 2, oy = 1;
    if (dir === 'up') p.img(held, 16 + ox - 2, oy + 7);
    if (dir === 'side') p.img(held, ox + 13, oy + 7);
    p.ascii(legs, HERO_PAL, ox, oy + 24);
    p.ascii(upper, HERO_PAL, ox, oy + 1);
    if (dir === 'down') { p.img(held, ox + 15, oy + 8); p.pts(HERO_PAL.s, [ox + 16, oy + 17, ox + 17, oy + 17, ox + 16, oy + 18, ox + 17, oy + 18]); p.pts(OUT, [ox + 18, oy + 17, ox + 18, oy + 18]); }

  out.ride.up = onBoard(HERO_BACK, LEGS_FRONT[0], fr, 8, 30);
  return out;
}

function planks(p, x, y, w, h, c, dir = 'h') {
  p.r(x, y, w, h, c);
  if (dir === 'h') for (let j = 0; j < h; j += 5) {
    p.r(x, y + j, w, 1, shade(c, 0.16)); p.r(x, y + j + 4, w, 1, shade(c, -0.28));
    for (let i = 0; i < 7; i++) { const gx = x + Math.floor(hash2(i, j + y, 3) * w); p.r(gx, y + j + 1 + Math.floor(hash2(i, j, 4) * 3), 2 + Math.floor(hash2(i, j, 5) * 4), 1, shade(c, -0.12)); }
    p.r(x + ((j * 7 + 11) % Math.max(1, w)), y + j, 1, 4, shade(c, -0.3));
  } else for (let i = 0; i < w; i += 5) {
    p.r(x + i, y, 1, h, shade(c, -0.28)); p.r(x + i + 1, y, 1, h, shade(c, 0.14));
  }
}
function shingles(p, x, y, w, h, c) {
  p.r(x, y, w, h, c);
  for (let j = 0, row = 0; j < h; j += 5, row++) {
    p.r(x, y + j + 4, w, 1, shade(c, -0.34));
    for (let i = (row % 2 ? -4 : 0); i < w; i += 8) {
      const X = x + i;
      const f = hash2(i, row, 6);
      if (X >= x) p.r(X, y + j, 1, 4, shade(c, -0.22));
      const a = Math.max(x, X + 1), b = Math.min(x + w, X + 8);
      if (b > a) { p.r(a, y + j, b - a, 1, shade(c, 0.2 + f * 0.1)); if (f > 0.7) p.r(a, y + j + 1, b - a, 3, shade(c, 0.07)); if (f < 0.22) p.r(a, y + j + 1, b - a, 3, shade(c, -0.08)); }
    }
  }
}
function stoneBase(p, x, y, w, h) {
  p.r(x, y, w, h, '#6f6555');
  for (let row = 0, j = 0; j < h; j += 4, row++) for (let i = (row % 2 ? -5 : 0); i < w; i += 10) {
    const a = Math.max(x, x + i + 1), b = Math.min(x + w, x + i + 9), f = hash2(i, row, 4);
    if (b > a) { const col = f > 0.6 ? '#b5aa97' : f > 0.3 ? '#a59a88' : '#938876'; p.r(a, y + j, b - a, 3, col); p.r(a, y + j, b - a, 1, shade(col, 0.18)); }
  }
}

  else { p.poly([[x, y + h - 2], [x + w - 3, y], [x + w, y], [x, y + h]], '#a4d4ec'); p.r(x, y + h - 1, w, 1, '#3f7aa8'); }
  p.r(x + (w >> 1), y, 1, h, trim); p.r(x, y + (h >> 1), w, 1, trim);

      'График функции показывает всю её сразу. Вверх по графику — значит функция растёт. Вершины и впадины подсказывают, где значение наибольшее или наименьшее. Линейная функция y = kx + b рисует прямую: k задаёт наклон, b — точку пересечения с осью y.'],
    q: [{ q: 'Что отличает функцию от произвольного соответствия?', a: 'Одному входу соответствует ровно один выход', o: ['Выход всегда больше входа', 'График всегда прямая'], why: 'Это и есть определение функции.' },
      { q: 'Что задаёт k в формуле y = kx + b?', a: 'Наклон прямой', o: ['Точку пересечения с осью y', 'Длину прямой'], why: 'Чем больше k, тем круче прямая.' }] },
  { id: 'l-log', sub: 'math', t: 'Степени и логарифмы', f: 'log_a(b) = c ⇔ aᶜ = b',
    body: ['Логарифм отвечает на вопрос: в какую степень возвести основание, чтобы получить число? log₂8 = 3, потому что 2³ = 8. Это операция, обратная возведению в степень.',
      'Главная сила логарифма в том, что он превращает умножение в сложение: log(ab) = log a + log b. Именно поэтому до калькуляторов инженеры считали на логарифмических линейках.',
      'Логарифмы описывают многое вокруг нас. Децибелы громкости и шкала землетрясений устроены логарифмически: прибавка на единицу означает рост в несколько раз.'],
    q: [{ q: 'Чему равен log₂32?', a: '5', o: ['16', '6'], why: '2⁵ = 32.' }, { q: 'Во что логарифм превращает умножение?', a: 'В сложение', o: ['В деление', 'В возведение в степень'], why: 'log(ab) = log a + log b.' }] },
  { id: 'l-limit', sub: 'math', t: 'Предел: как приблизиться к бесконечности', f: 'lim(x→a) f(x) = L',
    body: ['Предел описывает, к чему стремится значение функции, когда x подходит всё ближе к некоторой точке. Важно: сама точка может быть и недоступна. Выражение sin(x)/x при x = 0 не определено, но при приближении к нулю оно стремится к 1.',
      'Представь, что идёшь к стене и каждый шаг покрывает половину оставшегося пути. Ты никогда её не коснёшься, но расстояние стремится к нулю. Сумма 1/2 + 1/4 + 1/8 + … равна ровно 1: бесконечное число слагаемых даёт конечный ответ.',
      'На пределах стоит весь математический анализ: и производная, и интеграл определяются через них.'],
    q: [{ q: 'Чему равна сумма 1/2 + 1/4 + 1/8 + …?', a: '1', o: ['Бесконечности', '2'], why: 'Геометрическая прогрессия с q = 1/2.' }, { q: 'Должна ли функция быть определена в самой точке, чтобы иметь там предел?', a: 'Нет', o: ['Да, всегда', 'Только если она линейная'], why: 'Предел говорит о поведении рядом с точкой.' }] },
  { id: 'l-deriv', sub: 'math', t: 'Производная: скорость изменения', f: "f′(x) = lim(h→0) [f(x+h) − f(x)] / h",
    body: ['Производная показывает, как быстро меняется функция в данной точке. Это наклон касательной к графику. Если f(t) — пройденный путь, то f′(t) — скорость в момент t, то есть показание спидометра.',
      'Основное правило: производная xⁿ равна n·xⁿ⁻¹. Так, производная x² равна 2x. А функция eˣ особенная: она равна своей производной.',
      'Там, где производная равна нулю, функция на мгновение перестаёт расти или падать. Это кандидаты на максимум и минимум, поэтому производные нужны для любых задач оптимизации.'],
    q: [{ q: 'Чему равна производная x³?', a: '3x²', o: ['x²', '3x³'], why: 'Правило: n·xⁿ⁻¹.' }, { q: 'Что можно сказать о функции, где производная равна нулю?', a: 'Возможен максимум или минимум', o: ['Функция равна нулю', 'Функция не определена'], why: 'Касательная горизонтальна.' }] },
  { id: 'l-integral', sub: 'math', t: 'Интеграл: сумма бесконечно малых', f: '∫ₐᵇ f(x) dx = F(b) − F(a)',
    body: ['Интеграл считает площадь под графиком. Идея проста: разрежь область на множество узких полосок, сложи их площади и устреми ширину к нулю.',
      'Самое удивительное — формула Ньютона — Лейбница. Интегрирование и дифференцирование оказались взаимно обратными действиями. Чтобы найти площадь, достаточно найти первообразную F и вычесть её значения на концах отрезка.',
      'Если скорость — производная пути, то путь — интеграл скорости. Интегралами считают работу, заряд, массу неоднородных тел и вероятность.'],
    q: [{ q: 'Что геометрически означает определённый интеграл?', a: 'Площадь под графиком', o: ['Наклон касательной', 'Длину кривой'], why: 'С учётом знака.' }, { q: 'Как связаны интеграл и производная?', a: 'Это взаимно обратные операции', o: ['Они никак не связаны', 'Это одно и то же'], why: 'Формула Ньютона — Лейбница.' }] },
  { id: 'l-prob', sub: 'math', t: 'Вероятность и интуиция', f: 'P(A) = благоприятные / все исходы',
    body: ['Вероятность измеряет шансы от 0 до 1. Для равновозможных исходов это доля благоприятных. Выпадение шестёрки на кубике: 1/6.',
      'Для независимых событий вероятности перемножаются. Две шестёрки подряд: 1/6 · 1/6 = 1/36. Кубик ничего не помнит, поэтому после пяти неудач шанс шестёрки всё те же 1/6. Вера в обратное называется ошибкой игрока.',
      'Закон больших чисел обещает: при множестве повторений доля успехов приближается к истинной вероятности. Именно этим пользуются страховые компании и казино.'],
    q: [{ q: 'Какова вероятность двух орлов подряд?', a: '1/4', o: ['1/2', '1/8'], why: '1/2 · 1/2 = 1/4.' }, { q: 'Как называется вера в то, что после череды неудач успех «должен» случиться?', a: 'Ошибка игрока', o: ['Закон больших чисел', 'Парадокс Монти Холла'], why: 'Независимые события не имеют памяти.' }] },
  { id: 'l-vector', sub: 'math', t: 'Векторы и матрицы', f: 'A·v = v′',
    body: ['Вектор — это стрелка: у неё есть длина и направление. В координатах это просто список чисел. Скорость, сила и смещение удобно описывать именно векторами.',
      'Матрица — это преобразование пространства. Умножая вектор на матрицу, ты можешь повернуть, растянуть или отразить его. Определитель матрицы показывает, во сколько раз меняется площадь. Определитель 0 означает, что пространство сплющилось в прямую.',
      'На матрицах держится компьютерная графика, поисковые системы и нейросети.'],
    q: [{ q: 'Что показывает определитель матрицы 2×2?', a: 'Во сколько раз меняется площадь', o: ['Длину вектора', 'Угол поворота'], why: 'Определитель — коэффициент изменения площади.' }, { q: 'Что значит определитель, равный нулю?', a: 'Пространство сжалось в меньшую размерность', o: ['Матрица единичная', 'Векторы удлинились'], why: 'Такую матрицу нельзя обратить.' }] },
  { id: 'l-complex', sub: 'math', t: 'Комплексные числа', f: 'i² = −1, e^(iθ) = cos θ + i sin θ',
    body: ['Уравнение x² = −1 не имеет решений среди обычных чисел, поэтому математики ввели число i с таким свойством. Несмотря на название «мнимое», оно очень полезно.',
      'Комплексное число a + bi — это точка на плоскости. Умножение на i поворачивает её на 90 градусов. Значит, такие числа естественно описывают вращения и колебания.',
      'Электротехника, обработка звука и квантовая механика говорят на языке комплексных чисел. Волновая функция в квантовой физике принципиально комплексная.'],
    q: [{ q: 'Что делает умножение на i на комплексной плоскости?', a: 'Поворачивает на 90°', o: ['Удваивает длину', 'Отражает относительно оси'], why: 'Дважды повернули — получили −1.' }, { q: 'Модуль числа 3 + 4i равен:', a: '5', o: ['7', '12'], why: '√(9 + 16) = 5.' }] },
  { id: 'l-prime', sub: 'math', t: 'Простые числа', f: 'n = p₁·p₂·…·pₖ',
    body: ['Простое число делится только на 1 и на себя: 2, 3, 5, 7, 11… Любое натуральное число больше единицы единственным образом раскладывается на простые множители. Это основная теорема арифметики: простые — атомы чисел.',
      'Простых чисел бесконечно много. Доказательство Евклида красиво: перемножь все известные простые и прибавь 1. Результат не делится ни на одно из них, значит, простых больше, чем ты думала.',
      'На трудности разложения больших чисел держится шифрование RSA, защищающее интернет.'],
    q: [{ q: 'Какое из этих чисел простое?', a: '29', o: ['27', '51'], why: '27 = 3·9, 51 = 3·17.' }, { q: 'Кто доказал бесконечность простых чисел?', a: 'Евклид', o: ['Ньютон', 'Эйнштейн'], why: 'Это было более двух тысяч лет назад.' }] },
  { id: 'l-graph', sub: 'math', t: 'Графы и сети', f: 'V − E + F = 2',
    body: ['Граф — это точки и линии между ними. Города и дороги, люди и знакомства, страницы и ссылки. Теория графов началась с задачи Эйлера о мостах Кёнигсберга.',
      'Чтобы пройти все рёбра по одному разу, нечётных вершин должно быть не более двух. В Кёнигсберге их было четыре, поэтому прогулка невозможна.',
      'Для любого связного плоского графа верна формула Эйлера: вершины минус рёбра плюс грани равно 2. Проверь её на кубе: 8 − 12 + 6 = 2.'],
    q: [{ q: 'Сколько нечётных вершин допускает эйлеров путь?', a: 'Не более двух', o: ['Любое число', 'Ровно четыре'], why: 'Нечётными могут быть только начало и конец.' }, { q: 'Чему равно V − E + F для куба?', a: '2', o: ['0', '6'], why: '8 − 12 + 6 = 2.' }] },
  // ---------- Физика ----------
  { id: 'p-kin', sub: 'phys', t: 'Движение: скорость и ускорение', f: 'v = v₀ + at, s = v₀t + at²/2',
    body: ['Кинематика описывает движение. Скорость показывает, как быстро меняется положение. Ускорение показывает, как быстро меняется скорость.',
      'При равноускоренном движении всё описывается двумя формулами. Когда скейт скатывается с горки длиной в несколько метров, его путь растёт как квадрат времени: за вдвое большее время он пройдёт вчетверо больший путь.',
      'Галилей заметил, что тела падают с одинаковым ускорением, если не мешает воздух. На Земле оно около 9,8 м/с². Астронавт на Луне уронил молоток и перо, и они упали вместе.'],
    q: [{ q: 'Во сколько раз больше путь за вдвое большее время при разгоне с места?', a: 'В 4 раза', o: ['В 2 раза', 'В 8 раз'], why: 's ∝ t².' }, { q: 'Почему на Луне перо падает как молоток?', a: 'Там нет сопротивления воздуха', o: ['Там нет гравитации', 'Перо там тяжелее'], why: 'Ускорение свободного падения не зависит от массы.' }] },
  { id: 'p-newton', sub: 'phys', t: 'Законы Ньютона', f: 'F = ma',
    body: ['Первый закон: без действия сил тело движется равномерно и прямолинейно или покоится. Нам кажется иначе только потому, что повсюду трение.',
      'Второй закон связывает силу и ускорение: F = ma. Чем больше масса, тем труднее изменить движение.',
      'Третий закон: силы всегда парные. Толкаясь ногой, скейтбордист толкает Землю назад, а Земля толкает его вперёд. Земля тоже сдвигается, но её масса огромна, и сдвиг неизмерим. На этом же законе летают ракеты: они отбрасывают газ и получают тягу.'],
    q: [{ q: 'Что нужно, чтобы тело двигалось с постоянной скоростью без трения?', a: 'Никаких сил', o: ['Постоянная сила', 'Растущая сила'], why: 'Первый закон Ньютона.' }, { q: 'На каком законе основано движение ракеты?', a: 'На третьем', o: ['На первом', 'На законе Ома'], why: 'Действие равно противодействию.' }] },
  { id: 'p-energy', sub: 'phys', t: 'Энергия и её сохранение', f: 'E = mv²/2 + mgh',
    body: ['Энергию нельзя создать или уничтожить, только превратить. Скейт вверху рампы обладает потенциальной энергией mgh. Внизу она переходит в кинетическую mv²/2.',
      'Если приравнять их, получим скорость внизу: v = √(2gh). Интересно, что масса сокращается: лёгкий и тяжёлый райдер без трения разгонятся одинаково.',
      'На деле часть энергии уходит в тепло из-за трения. Сохранение энергии — причина, по которой вечный двигатель невозможен. Все попытки его построить заканчивались одинаково.'],
    q: [{ q: 'С какой скоростью без трения скейт окажется внизу рампы высотой 5 м (g = 10)?', a: '10 м/с', o: ['5 м/с', '50 м/с'], why: 'v = √(2·10·5) = 10.' }, { q: 'Зависит ли эта скорость от массы?', a: 'Нет', o: ['Да, прямо пропорционально', 'Да, обратно пропорционально'], why: 'Масса сокращается.' }] },
  { id: 'p-momentum', sub: 'phys', t: 'Импульс и вращение', f: 'p = mv, L = Iω',
    body: ['Импульс — это масса, умноженная на скорость. В замкнутой системе суммарный импульс сохраняется. Поэтому при выстреле ружьё отдаёт в плечо.',
      'У вращения есть свой аналог — момент импульса. Фигуристка прижимает руки к телу, момент инерции падает, а вращение ускоряется. Это не магия, а сохранение момента импульса.',
      'Этот же закон объясняет, почему нейтронная звезда делает сотни оборотов в секунду: огромная звезда сжалась до размеров города.'],
    q: [{ q: 'Почему фигуристка ускоряется, прижав руки?', a: 'Сохраняется момент импульса', o: ['Сила трения исчезает', 'Её масса уменьшается'], why: 'Меньше момент инерции — больше скорость вращения.' }, { q: 'Какова единица импульса?', a: 'кг·м/с', o: ['Н/м', 'Дж·с²'], why: 'p = mv.' }] },
  { id: 'p-osc', sub: 'phys', t: 'Колебания и волны', f: 'T = 2π√(L/g), v = λν',
    body: ['Колебания повсюду: маятник, струна, атомы в кристалле. Период математического маятника зависит от длины и g, но не от массы и почти не зависит от размаха. Это открыл Галилей, наблюдая за люстрой в соборе.',
      'Волна переносит энергию без переноса вещества. Её скорость связана с частотой и длиной волны: v = λν. Звук — волна в воздухе, а свет — электромагнитная волна, которой среда не нужна.',
      'Если раскачивать систему на её собственной частоте, наступает резонанс: амплитуда резко растёт. Так раскачивают качели и настраивают радиоприёмник.'],
    q: [{ q: 'Как изменится период маятника, если его длину увеличить в 4 раза?', a: 'Вырастет в 2 раза', o: ['Вырастет в 4 раза', 'Не изменится'], why: 'T ∝ √L.' }, { q: 'Что переносит волна?', a: 'Энергию', o: ['Вещество', 'Массу среды'], why: 'Частицы колеблются почти на месте.' }] },
  { id: 'p-thermo', sub: 'phys', t: 'Тепло и энтропия', f: 'ΔU = Q − A, ΔS ≥ 0',
    body: ['Температура — это мера средней энергии хаотичного движения частиц. Абсолютный ноль, −273,15 °C, — предел, ниже которого не опуститься.',
      'Первое начало термодинамики — это сохранение энергии с учётом теплоты. Второе начало говорит, что в изолированной системе энтропия не убывает. Тепло само не перетекает от холодного к горячему.',
      'Энтропия связана с числом микросостояний: беспорядочных расположений намного больше, поэтому система почти всегда движется к ним. Отсюда и стрела времени: разбитая кружка сама не собирается.'],
    q: [{ q: 'Что такое абсолютный ноль?', a: '−273,15 °C', o: ['0 °C', '−100 °C'], why: 'Это 0 К.' }, { q: 'Может ли энтропия изолированной системы убывать?', a: 'Нет, это запрещает второе начало', o: ['Да, легко', 'Только в воде'], why: 'Статистически это практически невозможно.' }] },
  { id: 'p-elec', sub: 'phys', t: 'Электричество', f: 'I = U/R, P = UI',
    body: ['Электрический ток — это упорядоченное движение зарядов. Напряжение подобно давлению, сила тока — объёму потока, а сопротивление — узости трубы. Отсюда закон Ома: I = U/R.',
      'Мощность равна произведению напряжения на ток. Лампа на 220 В и 0,5 А потребляет 110 Вт.',

/* Состояние игры и сохранения. Никакого расписания: только знания, поручения и приключения. */
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const WD_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function pad2(n) { return String(n).padStart(2, '0'); }
function keyOf(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; }
function gameNow() { return new Date(); }
function todayKey() { return keyOf(gameNow()); }
function dateOfKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); }
function weekday(k) { const w = dateOfKey(k).getDay(); return w === 0 ? 7 : w; }
function seasonOf(k) { const m = dateOfKey(k).getMonth(); return m < 2 || m === 11 ? 'winter' : m < 5 ? 'spring' : m < 8 ? 'summer' : 'fall'; }
function weatherOf(k) { const s = seasonOf(k), [y, m, d] = k.split('-').map(Number), r = hash2(y * 13 + m, d, 77); if (s === 'winter') return r < 0.3 ? 'snow' : 'clear'; return r < 0.16 ? 'rain' : 'clear'; }
function prettyDate(k) { const d = dateOfKey(k); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }

let S = null;
function newState(name) {
  return {
    v: 3, name: name || 'Искательница', rev: Date.now(), gold: 120, hp: 3,
    xp: { math: 0, phys: 0, astro: 0, cur: 0 }, seenLvl: { math: 0, phys: 0, astro: 0, cur: 0 },
    read: {}, topics: {}, sky: {}, slides: {}, facts: {}, sims: {}, owned: {}, exp: {},
    items: { coffee: 2, crib: 2 }, wheels: 0, bosses: {}, done: {}, kills: 0,
    stats: { solved: 0, right: 0, bestCombo: 0, goldEarned: 0, wins: 0 },
    settings: { music: false, sfx: true, alwaysDay: false }, pos: null, intro: true, talked: {},
  };
}
function curioFx(key) { let n = 0; if (!S || !S.owned) return 0; CURIOS.forEach(c => { if (S.owned[c.id] && c.fx[key]) n += c.fx[key]; }); return n; }
function skillLevel(sk) { const x = S.xp[sk] || 0; let l = 0; while (l < 10 && x >= XP_LEVELS[l + 1]) l++; return l; }
function totalXp() { return Object.values(S.xp).reduce((a, b) => a + b, 0); }
function rank() { const x = totalXp(); let r = RANKS[0], i = 0; RANKS.forEach((q, n) => { if (x >= q[0]) { r = q; i = n; } }); return { name: r[1], next: RANKS[i + 1] || null, at: r[0] }; }
function maxHearts() { return 3 + curioFx('hearts'); }
function goldBonus() { return 1 + skillLevel('cur') * 0.03 + curioFx('gold') / 100; }
function earn(g, mult = 1) { const v = Math.round(g * goldBonus() * mult); S.gold += v; S.stats.goldEarned += v; return v; }
function gainXp(sk, n) { S.xp[sk] = (S.xp[sk] || 0) + n; }
function damageOf(sub) { return 1 + (sub !== 'any' ? Math.floor(skillLevel(sub) / 4) : 0); }
function critChance() { return 0.08 + curioFx('crit') / 100; }

  const cv = $('simc'), g = cv.getContext('2d'), P = new Painter(cv), GM = 40 * 40 * 50; let k = 0.8, st = null, tr = [];
  bindSlider('ov', x => k = x);

    if (st && !st.done) {

        const R = Math.hypot(st.x, st.y); st.rmin = Math.min(st.rmin, R); st.rmax = Math.max(st.rmax, R);
        const an = Math.atan2(st.y, st.x); let da = an - st.last; if (da > Math.PI) da -= 2 * Math.PI; if (da < -Math.PI) da += 2 * Math.PI; st.ang += da; st.last = an;

async function exportSave() {
  const text = JSON.stringify(S, null, 1), filename = `dolina-kvarkov-${todayKey()}.json`, msg = $('stMsg');
  try { const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (dl) { await dl.save({ filename, data: new Blob([text], { type: 'application/json' }) }); msg.textContent = 'Копия сохранена.'; return; } } catch (e) { msg.textContent = 'Сохранение отменено.'; return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename; a.click(); msg.textContent = 'Копия скачивается.';
}

function npcTalk(id, opts) {
  const ready = QUESTLINE.filter(q => q.who === id && questReady(q)); let line = pick(DIALOG[id].hello), total = 0;
  if (ready.length) { ready.forEach(q => { total += claimQuest(q.id); }); line = `Поручение выполнено: «${ready.map(q => q.t).join('», «')}». Вот твоя награда: ${total} монет!`; Sfx.play('levelup'); UI.refreshHud(); checkLevelUps(); }
  else { const q = QUESTLINE.find(x => x.who === id && !S.done[x.id]); if (q && Math.random() < 0.6) line = `Есть просьба: ${q.d} (${Math.min(q.need, q.n())}/${q.need})`; }
  UI.dialog(id, DIALOG[id].name, [line], [...opts, { label: 'Пока', act: () => { } }]);
}

/* Звук (синтез прямо в браузере), заставка и запуск */
const Sfx = {
  ctx: null,
  unlock() { if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } } if (this.ctx.state === 'suspended') this.ctx.resume(); if (S) Music.sync(); },
  tone(f, d = 0.08, type = 'square', vol = 0.05, delay = 0, slide = 0) {
    const a = this.ctx; if (!a) return;
    const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.1, vol = 0.05) {
    const a = this.ctx; if (!a) return;
    const len = a.sampleRate * d, buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = vol; s.connect(g); g.connect(a.destination); s.start();
  },
  play(n) {
    if (!S || !S.settings.sfx || !this.ctx) return;
    const T = (...x) => this.tone(...x);
    ({
      tick: () => T(660, 0.03, 'square', 0.02), blip: () => T(520 + Math.random() * 80, 0.025, 'triangle', 0.03),
      coin: () => { T(988, 0.06, 'square', 0.04); T(1319, 0.14, 'square', 0.04, 0.06); },
      pickup: () => { T(740, 0.05, 'triangle', 0.06); T(988, 0.08, 'triangle', 0.06, 0.05); },
      levelup: () => [523, 659, 784, 1047].forEach((f, i) => T(f, 0.14, 'square', 0.04, i * 0.09)),
      hit: () => { this.noise(0.06, 0.08); T(180, 0.08, 'square', 0.05, 0, -100); }, swing: () => this.noise(0.09, 0.04), tool: () => this.noise(0.05, 0.03),
      kill: () => { T(300, 0.14, 'square', 0.05, 0, -220); this.noise(0.1, 0.05); }, ouch: () => T(220, 0.18, 'sawtooth', 0.05, 0, -120),
      dig: () => this.noise(0.12, 0.07), rock: () => { this.noise(0.05, 0.1); T(130, 0.06, 'square', 0.04); }, plant: () => T(392, 0.06, 'triangle', 0.06), water: () => { this.noise(0.18, 0.04); },
      eat: () => { T(300, 0.05, 'square', 0.03); T(360, 0.05, 'square', 0.03, 0.08); }, hop: () => T(300, 0.09, 'triangle', 0.06, 0, 300), door: () => T(180, 0.1, 'square', 0.03), stairs: () => [392, 330, 262].forEach((f, i) => T(f, 0.08, 'triangle', 0.06, i * 0.08)), no: () => T(160, 0.12, 'square', 0.04),
    }[n] || (() => { }))();
  },
};
const Music = { // спокойная петля на треугольной волне
  on: false, timer: null, step: 0,
  chords: [[262, 330, 392], [220, 262, 330], [175, 220, 262], [196, 247, 294]],
  sync() { const want = S && S.settings.music && Sfx.ctx; if (want && !this.on) this.start(); else if (!want && this.on) this.stop(); },
  start() { this.on = true; this.timer = setInterval(() => this.tick(), 340); },
  stop() { this.on = false; clearInterval(this.timer); },
  tick() {
    const s = this.step++, c = this.chords[Math.floor(s / 8) % 4], i = s % 8;
    const melody = [0, 1, 2, 1, 2, 0, 1, 2];
    Sfx.tone(c[melody[i]] * 2, 0.32, 'triangle', 0.018);
    if (i % 4 === 0) Sfx.tone(c[0] / 2, 0.6, 'triangle', 0.026);
    if (s % 32 === 28) Sfx.tone(c[2] * 4, 0.5, 'sine', 0.012);
  },
};

/* Заставка: небо, облака, горы, холмы и героиня на обрыве */
function titleScene() {
  const cv = $('titlec'); const W = 480, H = 270, sc = 4;
  const season = seasonOf(todayKey());
  const fit = () => { const r = innerWidth / innerHeight; cv.width = Math.round(Math.max(W, H * r)); cv.height = H; };
  fit(); window.addEventListener('resize', fit);
  const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
  const hero = heroFrames(DECK).side[0], cat = catFrames().sit, oak = oakTree(season, 2), oak2 = oakTree(season, 3), pine = pineTree(season, 1), pine2 = pineTree(season, 2);
  const cloud = spr(64, 26, p => { [[14, 16, 10], [30, 12, 12], [46, 16, 10], [22, 18, 8], [38, 18, 8]].forEach(a => p.ell(a[0], a[1], a[2], a[2] - 1, '#c8e2f4')); [[14, 14, 9], [30, 10, 11], [46, 14, 9]].forEach(a => p.ell(a[0], a[1], a[2], a[2] - 2, '#fff')); p.g.clearRect(0, 24, 64, 3); });
  const hillCol = GRASS[season];
  const bandSky = ['#4aa3e0', '#5bb0e6', '#6fbdea', '#86caed', '#a0d6ef', '#bde2ef', '#d6ecec'];
  let run = true;
  function frame(ms) {
    if (!run) return;
    const t = ms / 1000, w = cv.width;
    bandSky.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * 26, w, 28); });
    for (let i = 0; i < 8; i++) { const x = ((i * 137 + t * (4 + i % 3 * 2)) % (w + 80)) - 70, y = 8 + (i * 53) % 100; g.drawImage(cloud, Math.round(x), y); }
    // дальние горы
    const ridge = (base, amp, col, sd) => { g.fillStyle = col; for (let x = 0; x < w; x++) { const h = base - (vnoise(x / 34, 0, sd) * amp + vnoise(x / 11, 3, sd) * amp * 0.28); g.fillRect(x, Math.round(h), 1, H - Math.round(h)); } };
    ridge(190, 58, '#8fb3cf', 3); ridge(208, 44, '#6e97ad', 4);
    ridge(222, 26, shade(hillCol.b, -0.32), 5);
    pinesRow(g, w, 214, pine, 80, 6);
    ridge(240, 16, shade(hillCol.b, -0.14), 6);
    ridge(254, 14, hillCol.b, 8);
    // передний холм с героиней
    g.fillStyle = hillCol.d; for (let x = 0; x < w; x++) if ((x * 7) % 13 === 0) g.fillRect(x, 255 + (x % 9), 2, 1);
    g.drawImage(oak, 14, 256 - oak.height + 4); g.drawImage(oak2, w - 72, 256 - oak2.height + 4); g.drawImage(pine2, w - 108, 258 - pine2.height);
    const hx = Math.round(w * 0.27);
    drawShadow(g, hx + 12, 261, 9);
    g.drawImage(hero, hx, 230);
    g.drawImage(cat, hx + 24, 249);
    requestAnimationFrame(frame);
  }
  function pinesRow(g, w, y, sp, step, s) { for (let x = -10; x < w; x += step) { const c = Math.round(hash2(x, s) * 30); g.drawImage(sp, x + c, y - sp.height + 14); } }
  requestAnimationFrame(frame);
  return () => { run = false; };
}

    <div class="titlebox">${existing ? `<button class="btn green" id="tPlay">Играть за ${esc(existing.name)}</button>` : `<label class="frame" style="padding:0 8px 8px;font-weight:600;font-size:18px;color:var(--ink)">Как зовут героиню?<br><input id="tName" maxlength="20" value="" placeholder="Твоё имя" style="margin-top:4px;width:220px;text-align:center"></label><button class="btn green" id="tPlay">Начать</button>`}</div>`;
  $('tPlay').onclick = () => {
    Sfx.unlock();
    if (!existing) { const nm = ($('tName').value || '').trim() || 'Хозяйка'; S = newState(nm); } else S = migrate(existing);
    stop(); $('title').hidden = true; $('hud').hidden = false;
    startWorld(!existing);

  if (!existing) $('tName').addEventListener('keydown', e => { if (e.key === 'Enter') $('tPlay').click(); });
}

      'В Кампусе есть Библиотека со статьями, Зал Математики с задачами и головоломками, Лаборатория с настоящими опытами.',
      'На севере Звёздный Холм с телескопом. На востоке Лес Заблуждений: монстров там побеждают только правильными ответами.',
      'Лови золотых светлячков: в каждом спрятан факт. А ещё у жителей есть для тебя поручения. Загляни в журнал, клавиша J.',
    ], null, () => { UI.showToast('Выйди из дома и загляни в Библиотеку'); });
    Store.write();
  } else if (S.upgraded) { delete S.upgraded; UI.dialog('ada', 'Ада', ['Долина изменилась! Расписания больше нет, зато теперь это большая игра о науке. Твои монеты, редкости и открытия остались с тобой.']); saveSoon(true); }
  setInterval(() => { if (S) { S.pos = { map: G.map.id, x: G.p.x, y: G.p.y }; saveSoon(); } }, 30000);
  window.addEventListener('pagehide', () => { if (S) Store.write(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && S) Store.write(); });
}
(async function boot() {
