<title>Хроники Анны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tiny5&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: пиксельное меню персонажа. Слева сцена с Анной в её комнате (портрет с эмоциями), характеристики и снаряжение; справа вкладки журнала на бумажных панелях с пиксельными рамками. Беатрис говорит в окне визуальной новеллы на фоне своего кабинета. Одна тёмная тема намеренно. */
:root{
  --bg:#1d2135; --bg2:#22273f; --ink:#17121d;
  --paper:#e7e3c6; --paper-hi:#fbf8e4; --paper-lo:#c9c4a2; --text:#2a2130; --text2:#6a6274;
  --slate:#2b3150; --slate-hi:#3d4570; --slate-lo:#20243b; --light:#efe8d6; --light2:#a9a6c4;
  --teal:#3f8f86; --teal-hi:#6cc1b3; --gold:#e3a93a; --gold-hi:#f8d36c; --gold-lo:#a8711e;
  --red:#c8473d; --plum:#7a3b8c; --wine:#4a1a2c; --wine-hi:#7a2c45; --green:#5f9e48; --green-hi:#8fd06e; --sky:#5a7ec4;
  --pix:"Tiny5","Courier New",monospace;
  --body:"PT Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:repeating-conic-gradient(var(--bg) 0 25%,var(--bg2) 0 50%) 0 0/24px 24px;color:var(--light);font:400 15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px;font-variant-numeric:tabular-nums;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--gold-hi);outline-offset:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--pix);font-weight:400}
canvas,.pixel{image-rendering:pixelated;image-rendering:crisp-edges}
.sym{font-variant-emoji:text}
.wrap{max-width:1180px;margin:0 auto}

/* Пиксельные рамки: внешний контур из четырёх теней даёт срезанные углы, внутренние тени дают фаску */
.px{background:var(--paper);color:var(--text);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--paper-hi),inset -4px -4px 0 0 var(--paper-lo)}
.px.dark{background:var(--slate);color:var(--light);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--slate-hi),inset -4px -4px 0 0 var(--slate-lo)}
.px.wine{background:var(--wine);color:var(--light);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--wine-hi),inset -4px -4px 0 0 #2e0f1c}
.px.done{background:#d3e2b4;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 #eaf5d2,inset -4px -4px 0 0 #a9c487}
.pad{padding:16px 18px}
.label{font:400 15px var(--pix);letter-spacing:.08em;text-transform:uppercase}
.t2{color:var(--text2)}
.l2{color:var(--light2)}

/* кнопки */
.pbtn{font:400 20px var(--pix);letter-spacing:.02em;border:0;padding:8px 14px;min-height:42px;background:var(--gold);color:var(--ink);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold-hi),inset -3px -3px 0 0 var(--gold-lo);margin:3px}
.pbtn:hover{filter:brightness(1.07)}
.pbtn:active{transform:translateY(2px);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold-lo),inset -3px -3px 0 0 var(--gold-hi)}
.pbtn.teal{background:var(--teal);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--teal-hi),inset -3px -3px 0 0 #2b6862}
.pbtn.plain{background:var(--paper);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--paper-hi),inset -3px -3px 0 0 var(--paper-lo)}
.pbtn.on{background:var(--green);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--green-hi),inset -3px -3px 0 0 #3f7230}
.pbtn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.pbtn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);transform:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* полоски: сегментированные */
.pbar{height:14px;background:var(--ink);padding:2px;position:relative}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c,var(--teal-hi)) 0 6px,var(--c2,var(--teal)) 6px 8px);transition:width .5s steps(8)}
.pbar.gold i{--c:var(--gold-hi);--c2:var(--gold)}.pbar.green i{--c:var(--green-hi);--c2:var(--green)}.pbar.red i{--c:#ef8f6a;--c2:var(--red)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.hudin{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px 14px;margin:4px}
.lv{flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--wine);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--wine-hi),inset -3px -3px 0 0 #2e0f1c;margin:3px;text-align:center;line-height:1}
.lv b{font:400 30px var(--pix);color:var(--gold-hi);display:block}
.lv small{font:400 15px var(--pix);color:var(--light2);letter-spacing:.12em}
.hudava{width:56px;height:56px;flex:none;margin:3px;background:#2f3a5e;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink)}
.who{flex:1 1 220px;min-width:0;display:grid;gap:5px}
.who h1{font:400 25px/1 var(--pix)}
.who h1 span{font:400 20px var(--pix);color:var(--gold-hi);margin-left:8px}
.xpline{display:flex;justify-content:space-between;font:400 15px var(--pix);color:var(--light2)}
.purse{display:flex;gap:16px;align-items:center}
.coin{display:inline-flex;align-items:center;gap:6px;font:400 20px var(--pix);color:var(--gold-hi)}
.coin i{width:14px;height:14px;background:var(--gold);box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo),0 0 0 2px var(--ink);display:inline-block}
.streak{font:400 20px var(--pix);color:#ef8f6a;display:inline-flex;gap:6px;align-items:center}
.streak i{width:10px;height:14px;background:linear-gradient(var(--gold-hi) 0 40%,#ef8f6a 40% 75%,var(--red) 75%);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);display:inline-block}
.bell{position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center}
.bell .dot{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;background:var(--red);color:#fff;font:400 15px/20px var(--pix);padding:0 4px;box-shadow:0 0 0 2px var(--ink)}
.bell.ring svg{animation:bell 2.4s steps(1) infinite}
@keyframes bell{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(15deg)}88%{transform:rotate(-15deg)}92%{transform:rotate(10deg)}96%{transform:rotate(-6deg)}}

.main{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:22px;align-items:start;margin-top:6px}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}.hud{position:static}}

/* героиня */
.herocard{margin:4px;padding:12px}
.stagebox{position:relative;background:var(--ink);padding:4px}
.stagebox canvas{display:block;width:100%;height:auto;aspect-ratio:112/80;max-width:100%}
.speech{position:absolute;left:10px;top:8px;max-width:50%;font:400 15px/1.3 var(--pix);background:var(--paper-hi);color:var(--text);padding:6px 9px;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);animation:pop .25s steps(3)}
.speech::after{content:"";position:absolute;left:14px;bottom:-9px;width:9px;height:6px;background:var(--paper-hi);box-shadow:3px 0 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink);clip-path:polygon(0 0,100% 0,0 100%)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.gain{position:absolute;font:400 25px var(--pix);color:var(--gold-hi);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);pointer-events:none;animation:gain 1.1s steps(10) forwards}
@keyframes gain{to{transform:translateY(-54px);opacity:0}}
.classline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.classline b{font:400 20px var(--pix);color:var(--wine)}
.classline span{font:400 15px var(--pix);color:var(--text2)}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center;font:400 20px var(--pix)}
.bar output{text-align:right;color:var(--text2)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px}
.stat{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:center;font:400 15px var(--pix)}
.stat .g{color:var(--plum);font-weight:700;text-align:center}
.stat b{color:var(--teal);font-weight:700}
.stat .pbar{grid-column:2/-1;height:8px;padding:1px}
.equiphead{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.equip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px;padding:3px}
.slot{aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative;background:#cdc8a6;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 #b3ae8c,inset -3px -3px 0 0 #e6e1c0}
.slot canvas{width:72%;height:auto;aspect-ratio:1}
.slot.relic{background:#f0d48a;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold),inset -3px -3px 0 0 #fff0c0}
.slot .rg{font:400 30px/1 var(--pix);color:var(--wine)}
.slot.empty .rg{color:#a8a384}
.tt{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--light);font:400 15px var(--pix);padding:4px 7px;white-space:nowrap;opacity:0;pointer-events:none;z-index:3}
.slot:hover .tt,.slot:focus .tt{opacity:1}

/* вкладки */
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 10px;margin-bottom:12px}
.tab{position:relative;font:400 20px var(--pix);border:0;padding:8px 14px;min-height:44px;white-space:nowrap;background:var(--slate);color:var(--light2);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--slate-hi),inset -3px -3px 0 0 var(--slate-lo);margin:3px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--text);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--paper-hi),inset -3px -3px 0 0 var(--paper-lo);transform:translateY(-2px)}
.tab .pip{position:absolute;top:-6px;right:-6px;width:10px;height:10px;background:var(--red);box-shadow:0 0 0 2px var(--ink);animation:blinkpip 1s steps(1) infinite}
@keyframes blinkpip{50%{opacity:.3}}
.sec{display:grid;gap:14px;margin-bottom:24px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.sechead h2{font:400 25px var(--pix);color:var(--gold-hi);text-shadow:2px 2px 0 var(--ink)}
.sechead small{color:var(--light2);font:400 15px var(--pix)}

/* Беатрис */
.mentor{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:start;margin:4px}
.ava{background:#3a2030;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);margin:3px;display:block}
.ava img,.ava canvas{display:block;width:100%;height:auto}
.mentor .ava{width:98px}
.voice{font:400 20px/1.35 var(--pix)}
.legend{display:grid;gap:10px;min-width:0}
.legend h3{font:400 25px/1.15 var(--pix);color:var(--gold-hi)}
.rarity{font:400 15px var(--pix);letter-spacing:.1em;color:#f3a6c0;text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.check{width:30px;height:30px;border:0;padding:0;margin:3px;background:var(--paper-hi);color:var(--ink);font:400 20px/1 var(--pix);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 #fff,inset -2px -2px 0 0 var(--paper-lo)}
.check[aria-pressed="true"]{background:var(--gold);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--gold-hi),inset -2px -2px 0 0 var(--gold-lo)}
.check.big{width:38px;height:38px}
.check.big[aria-pressed="true"]{background:var(--green);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--green-hi),inset -2px -2px 0 0 #3f7230}
.steps li span{padding-top:6px;font-size:15px}
.steps li.done span{opacity:.6;text-decoration:line-through}
.letter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;width:calc(100% - 8px);margin:4px;text-align:left;border:0;cursor:pointer;animation:wiggle 2s steps(1) infinite}
@keyframes wiggle{0%,86%,100%{transform:none}90%{transform:translate(2px,-2px)}94%{transform:translate(-2px,0)}}
.letter b{font:400 20px var(--pix);color:var(--wine);display:block}
.letter canvas{width:72px;height:auto;aspect-ratio:1}

/* квесты */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:4px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;align-content:start}
.q .kind{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font:400 15px var(--pix);letter-spacing:.08em;text-transform:uppercase}
.q .kind em{font-style:normal;color:var(--text2);letter-spacing:0;text-transform:none}
.q.morning .kind span{color:#b5651d}.q.evening .kind span{color:var(--plum)}.q.week .kind span{color:var(--red)}.q.board .kind span{color:var(--teal)}.q.goal .kind span{color:#3f7230}
.q b{font:400 20px/1.2 var(--pix)}
.q small{grid-column:1/-1;color:var(--text2);font-size:14px;line-height:1.35}
.q .rw{font:400 20px var(--pix);color:var(--teal);white-space:nowrap}
.q .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.q.locked{opacity:.6}
.skt{font:400 15px var(--pix);color:var(--text2);display:inline-flex;gap:5px;align-items:center}
.skt i{font-style:normal;color:var(--plum);font-weight:700}
.gprog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font:400 15px var(--pix);color:var(--text2)}
.quote{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;margin:4px;padding:12px 16px}
.quote .ava{width:58px}

/* навыки */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:4px}
.sk{padding:14px 16px;display:grid;gap:8px;align-content:start}
.skhead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.rune{width:40px;height:40px;display:grid;place-items:center;font:400 25px var(--pix);color:var(--gold-hi);background:var(--wine);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--wine-hi);margin:3px}
.skhead b{font:400 20px var(--pix);display:block}
.skhead small{color:var(--text2);font:400 15px var(--pix)}
.sklv{font:400 30px var(--pix);color:var(--teal)}
.perks{display:flex;flex-wrap:wrap;gap:8px;padding:2px}
.perk{font:400 15px var(--pix);padding:3px 8px;background:var(--paper-lo);color:var(--text2);box-shadow:0 0 0 2px var(--ink)}
.perk.on{background:var(--gold-hi);color:var(--ink)}
.feeds{font-size:13px;color:var(--text2)}

/* дела */
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font:400 20px var(--pix);color:var(--light)}
.acts{margin:4px;padding:6px 14px}
.act{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:3px dotted var(--paper-lo);min-height:62px}
.act:last-child{border-bottom:0}
.act .rune{width:34px;height:34px;font-size:16px}
.act b{font:400 20px var(--pix);display:block}
.act b span{color:var(--teal);font-size:14px}
.act small{color:var(--text2);font-size:13.5px;display:block;line-height:1.3}
.cnt{display:flex;align-items:center;gap:4px}
.cnt output{min-width:30px;text-align:center;font:400 25px var(--pix)}
.cnt .pbtn{width:40px;height:40px;min-height:0;padding:0;font-size:20px}

/* сундук, хроника */
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:4px}
.relic{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px}
.relic .slot{width:48px;margin:3px}
.relic b{font:400 20px var(--pix);display:block}
.relic small{color:var(--text2);font-size:13px;line-height:1.3;display:block}
.relic.lock b{color:var(--text2)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:4px}
.ware{padding:14px 16px;display:grid;gap:10px;align-content:start}
.ware b{font:400 20px var(--pix)}
.ware .coin{color:var(--gold-lo)}
.ware .coin i{box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo),0 0 0 2px var(--ink)}
.log{list-style:none;margin:4px;padding:4px 14px}
.log li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:3px dotted var(--paper-lo);align-items:start;font-size:14.5px}
.log li:last-child{border-bottom:0}
.log b{font:400 20px var(--pix)}
.log time{font:400 15px var(--pix);color:var(--text2);white-space:nowrap;padding-top:2px}
.ico{width:34px;height:34px;display:grid;place-items:center;font:400 20px var(--pix);color:#fff;box-shadow:0 0 0 2px var(--ink)}
.ico img{width:100%;height:100%;display:block}
.k-xp{background:var(--teal)}.k-lv{background:var(--gold);color:var(--ink)}.k-bea{background:var(--wine)}.k-quest{background:var(--green)}.k-info{background:var(--sky)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px;padding:4px}
.mood{display:grid;gap:6px;justify-items:center;text-align:center;font:400 15px var(--pix);padding:8px}
.mood canvas{width:100%;max-width:100%;height:auto;aspect-ratio:1;background:#2f3a5e;box-shadow:0 0 0 3px var(--ink)}
.mood.b canvas{background:#3a2030}
.settings{display:grid;gap:12px;margin:4px;padding:16px}
.setrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font:400 20px var(--pix)}
input[type=text]{background:var(--paper-hi);border:0;box-shadow:0 0 0 3px var(--ink);padding:8px 10px;min-height:42px;font:400 20px var(--pix);color:var(--text)}

@keyframes tin{from{transform:translateX(40px);opacity:0}}

#lvl{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#0b0a12e8;padding-inline:16px;animation:fade .2s steps(3)}

#lvl .stars i{position:absolute;width:8px;height:8px;background:var(--gold-hi);box-shadow:0 0 0 2px var(--ink);animation:twk 1s steps(2) infinite}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:920px){.statgrid,.equiphead,.equip{display:none}}

<script>
"use strict";
/* ===== Пиксельный движок: всё рисуется в маленькой сетке и увеличивается без сглаживания ===== */
function Grid(w,h){this.w=w;this.h=h;this.c=new Array(w*h).fill(null)}
Grid.prototype.p=function(x,y,c){x|=0;y|=0;if(x>=0&&y>=0&&x<this.w&&y<this.h)this.c[y*this.w+x]=c};
Grid.prototype.g=function(x,y){if(x<0||y<0||x>=this.w||y>=this.h)return null;return this.c[y*this.w+x]};
Grid.prototype.r=function(x,y,w,h,c){for(let j=0;j<h;j++)for(let i=0;i<w;i++)this.p(x+i,y+j,c)};
Grid.prototype.e=function(cx,cy,rx,ry,c,pred){for(let y=Math.floor(cy-ry-1);y<=cy+ry+1;y++)for(let x=Math.floor(cx-rx-1);x<=cx+rx+1;x++){const dx=(x+.5-cx)/rx,dy=(y+.5-cy)/ry;if(dx*dx+dy*dy<=1&&(!pred||pred(x,y)))this.p(x,y,c)}};
Grid.prototype.ring=function(cx,cy,rx,ry,c){const o=new Grid(this.w,this.h);o.e(cx,cy,rx,ry,1);const i=new Grid(this.w,this.h);i.e(cx,cy,rx-1,ry-1,1);for(let k=0;k<o.c.length;k++)if(o.c[k]&&!i.c[k])this.c[k]=c};
Grid.prototype.poly=function(pts,c){let y0=Infinity,y1=-Infinity;pts.forEach(p=>{y0=Math.min(y0,p[1]);y1=Math.max(y1,p[1])});for(let y=Math.floor(y0);y<=Math.ceil(y1);y++){const yc=y+.5,xs=[];for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];if((a[1]<=yc&&b[1]>yc)||(b[1]<=yc&&a[1]>yc))xs.push(a[0]+(yc-a[1])/(b[1]-a[1])*(b[0]-a[0]))}xs.sort((a,b)=>a-b);for(let k=0;k+1<xs.length;k+=2)for(let x=Math.ceil(xs[k]-.5);x<=Math.floor(xs[k+1]-.5);x++)this.p(x,y,c)}};
Grid.prototype.l=function(x0,y0,x1,y1,c){x0|=0;y0|=0;x1|=0;y1|=0;const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){this.p(x0,y0,c);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}};
Grid.prototype.path=function(pts,c){for(let i=0;i+1<pts.length;i++)this.l(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],c)};
Grid.prototype.outline=function(c){const add=[];for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++){if(this.g(x,y))continue;if(this.g(x-1,y)||this.g(x+1,y)||this.g(x,y-1)||this.g(x,y+1))add.push([x,y])}add.forEach(([x,y])=>this.p(x,y,c))};

Grid.prototype.shade=function(fromC,toC,pred){for(let y=0;y<this.h;y++)for(let x=0;x<this.w;x++)if(this.g(x,y)===fromC&&pred(x,y))this.p(x,y,toC)};

Grid.prototype.canvas=function(cv){cv=cv||document.createElement('canvas');cv.width=this.w;cv.height=this.h;const x=cv.getContext('2d');const im=x.createImageData(this.w,this.h);for(let k=0;k<this.c.length;k++){const v=this.c[k];if(!v)continue;const n=parseInt(v.slice(1),16);im.data[k*4]=n>>16;im.data[k*4+1]=n>>8&255;im.data[k*4+2]=n&255;im.data[k*4+3]=255}x.putImageData(im,0,0);return cv};

const OUT='#241a24';
/* ===== Анна: каштановые волосы до плеч, очки ===== */
const AN={skin:'#f3c49c',sk2:'#dc9a72',sk3:'#b06c4e',hair:'#7b4022',h2:'#552813',h3:'#a65a2e',h4:'#cf8548',glass:'#7a3b8c',gl2:'#b56cc4',lens:'#d9ecf2',iris:'#5a3420',pupil:'#24140c',mouth:'#8a3236',mouth2:'#5c1c22',tongue:'#e07a7a',blush:'#ee8d8a',top:'#3f8f86',top2:'#2b6862',top3:'#62b3a6',coll:'#f1eedc',coll2:'#c7c2a8',pin:'#f2c13c',white:'#ffffff'};
function anna(mood,o={}){
  const g=new Grid(64,64),C=AN;
  // волосы сзади: до плеч
  g.e(32,27,19,18,C.hair);g.poly([[13,27],[51,27],[53,50],[47,53],[17,53],[11,50]],C.hair);

  // тело
  g.poly([[5,64],[8,55],[18,49],[46,49],[56,55],[59,64]],C.top);
  g.shade(C.top,C.top2,(x,y)=>x<14||x>51||(y>58&&(x<20||x>44)));

  g.r(27,41,10,9,C.sk2);
  g.poly([[23,49],[32,57],[41,49],[38,48],[32,53],[26,48]],C.coll);
  g.path([[23,49],[32,57],[41,49]],C.coll2);
  g.r(31,57,2,7,C.top2);g.p(31,59,C.pin);g.p(32,59,C.pin);
  // лицо
  g.e(32,29,13,15,C.skin);g.poly([[20,30],[44,30],[42,38],[37,43],[32,45],[27,43],[22,38]],C.skin);
  g.shade(C.skin,C.sk2,(x,y)=>y>=42||x<=20||x>=44);
  g.e(19,32,2,3,C.skin);g.e(45,32,2,3,C.skin);g.p(19,33,C.sk2);g.p(45,33,C.sk2);
  // чёлка и макушка
  g.e(32,22,16,12,C.hair,(x,y)=>y<23);
  g.poly([[17,22],[47,22],[47,27],[44,25],[41,28],[38,24],[34,27],[30,23],[25,27],[22,24],[19,29],[17,30]],C.hair);
  g.poly([[16,22],[20,22],[20,34],[17,40],[15,34]],C.hair);g.poly([[44,22],[48,22],[49,34],[47,40],[44,32]],C.hair);
  g.path([[22,12],[26,10],[31,9]],C.h3);g.path([[24,14],[29,12]],C.h4);g.path([[36,10],[41,12],[44,15]],C.h3);
  g.path([[30,13],[28,18],[25,22]],C.h2);g.path([[37,13],[39,18],[41,22]],C.h2);g.path([[33,12],[33,20]],C.h2);
  [[15,34,16,48],[18,38,19,50],[46,36,45,48],[49,34,48,47]].forEach(([a,b,c2,d])=>g.l(a,b,c2,d,C.h2));[[13,46,14,52],[50,46,49,52]].forEach(([a,b,c2,d])=>g.l(a,b,c2,d,C.h3));
  g.p(12,51,C.hair);g.p(11,52,C.hair);g.p(52,51,C.hair);g.p(53,52,C.hair);
  g.edge([C.hair,C.h2,C.h3,C.h4],[C.skin,C.sk2],'#3d1d0e');g.edge([C.top,C.top2,C.top3],[C.sk2,C.coll],'#1f4a46');
  g.p(42,16,C.pin);g.p(43,17,C.pin);g.p(44,18,C.pin);g.p(43,16,'#fff2b0');
  // лицо: эмоции
  const E={L:[26,32],R:[38,32]};
  const eyeOpen=(x,y,look=0)=>{g.r(x-2,y-2,5,4,C.white);g.r(x-1+look,y-2,3,4,C.iris);g.r(x+look,y-1,1,2,C.pupil);g.p(x-1+look,y-2,C.white);g.l(x-3,y-3,x+2,y-3,OUT);g.p(x+3,y-2,OUT)};
  const eyeClosedHappy=(x,y)=>{g.path([[x-2,y],[x-1,y-1],[x+1,y-1],[x+2,y]],OUT)};
  const eyeFlat=(x,y)=>{g.l(x-2,y,x+2,y,OUT)};
  const eyeHalf=(x,y)=>{g.r(x-2,y-1,5,2,C.white);g.r(x-1,y-1,3,2,C.iris);g.p(x,y,C.pupil);g.l(x-3,y-2,x+2,y-2,OUT);g.l(x-2,y-2,x+2,y-2,OUT)};
  const eyeWide=(x,y)=>{g.r(x-2,y-3,5,5,C.white);g.r(x-1,y-2,3,3,C.iris);g.p(x,y-1,C.pupil);g.p(x-1,y-2,C.white);g.l(x-2,y-4,x+2,y-4,OUT)};
  const brow=(x,y,t)=>{const s=x<32?-1:1;if(t==='up')g.path([[x-2,y-2],[x+2,y-2]],C.h2),g.p(x+2*s,y-1,C.h2);else if(t==='angry')g.path([[x-2*s,y-1],[x+2*s,y+1]].map(p=>[p[0],p[1]-1]),C.h2);else if(t==='sad')g.path([[x-2*s,y+1],[x+2*s,y-1]].map(p=>[p[0],p[1]-1]),C.h2);else g.l(x-2,y,x+2,y,C.h2)};
  const by=26;

  else if(mood==='tired'){brow(E.L[0],by,'sad');brow(E.R[0],by,'sad');if(o.blink){eyeFlat(...E.L);eyeFlat(...E.R)}else{eyeHalf(...E.L);eyeHalf(...E.R)}g.path([[30,40],[32,39],[34,40]],C.mouth);g.p(41,26,'#7fc6e8');g.p(41,27,'#7fc6e8');g.p(40,28,'#7fc6e8')}
  else if(mood==='shy'){brow(E.L[0],by,'sad');brow(E.R[0],by,'sad');if(o.blink){eyeFlat(...E.L);eyeFlat(...E.R)}else{eyeOpen(E.L[0],E.L[1],1);eyeOpen(E.R[0],E.R[1],1)}g.path([[30,39],[31,40],[32,39],[33,40],[34,39]],C.mouth)}
  else{brow(E.L[0],by,'n');brow(E.R[0],by,'n');if(o.blink){eyeFlat(...E.L);eyeFlat(...E.R)}else{eyeOpen(...E.L);eyeOpen(...E.R)}g.path([[29,38],[30,39],[34,39],[35,38]],C.mouth)}
  if(mood==='joy'||mood==='shy'){g.r(21,35,3,1,C.blush);g.r(41,35,3,1,C.blush);if(mood==='shy'){g.r(22,36,2,1,C.blush);g.r(41,36,2,1,C.blush)}}
  // нос
  g.p(32,35,C.sk2);g.p(33,36,C.sk3);
  // очки
  g.ring(26,32,6,5,C.glass);g.ring(38,32,6,5,C.glass);g.l(31,31,33,31,C.glass);g.l(20,31,18,30,C.glass);g.l(44,31,46,30,C.glass);
  g.p(22,29,C.gl2);g.p(34,29,C.gl2);
  if(o.glint){g.l(22,35,25,28,C.lens);g.l(23,35,26,28,C.white);g.l(34,35,37,28,C.lens);g.l(35,35,38,28,C.white)}
  g.outline(OUT);
  return g;
}
/* ===== Беатрис: чёрные кудри, острые черты ===== */
const BE={skin:'#e8bb98',sk2:'#c78a68',sk3:'#94573e',hair:'#221e30',h2:'#3a3452',h3:'#5f5884',h4:'#9a94c4',eye:'#2e6b56',lip:'#8e2236',lip2:'#5a1220',coat:'#4a1a2c',coat2:'#2e0f1c',coat3:'#6e2a40',trim:'#e2b443',blouse:'#efe9dc',bl2:'#c4bcab',gem:'#c8323c',white:'#ffffff'};
function curl(g,cx,cy,r,C){g.e(cx,cy,r,r,C.hair);g.e(cx,cy,r,r,'#141120',(x,y)=>y+.5>cy+r*.45);const a=[];for(let t=3.4;t<5.6;t+=0.35)a.push([Math.round(cx+Math.cos(t)*(r-1.3)),Math.round(cy+Math.sin(t)*(r-1.3))]);g.path(a,C.h3);g.p(a[Math.floor(a.length/2)][0],a[Math.floor(a.length/2)][1],C.h4);g.p(cx,cy,C.h2)}
function bea(mood,o={}){
  const g=new Grid(64,64),C=BE;
  // кудри сзади, объём
  [[14,30,6],[13,40,6],[16,49,6],[50,30,6],[51,40,6],[48,49,6],[19,18,7],[45,18,7],[32,12,8],[24,13,7],[40,13,7],[12,22,5],[52,22,5],[20,53,5],[44,53,5]].forEach(([x,y,r])=>curl(g,x,y,r,C));

  g.l(19,49,12,63,C.coat3);g.l(45,49,52,63,C.coat3);
  g.poly([[24,47],[32,58],[40,47],[42,50],[32,64],[22,50]],C.trim);
  g.poly([[25,47],[32,57],[39,47]],C.blouse);g.path([[26,48],[32,55],[38,48]],C.bl2);
  g.r(28,41,8,8,C.sk2);
  g.e(32,59,2.2,2.2,C.trim);g.p(32,59,C.gem);g.p(31,58,C.white);

  g.poly([[20,22],[44,22],[45.5,32],[42,40],[36,46],[32,48],[28,46],[22,40],[18.5,32]],C.skin);
  g.e(32,24,12,9,C.skin);
  g.shade(C.skin,C.sk2,(x,y)=>(x<23&&y>33)||(x>41&&y>33)||y>=46);
  g.path([[21,35],[24,40],[28,44]],C.sk2);g.path([[43,35],[40,40],[36,44]],C.sk2);
  g.e(19,31,2,3,C.skin);g.e(45,31,2,3,C.skin);g.p(19,34,C.trim);g.p(45,34,C.trim);g.p(19,35,C.gem);g.p(45,35,C.gem);

/* ================= Утилиты ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const monday=s=>addDays(s,-dow(s));
const today=()=>iso(new Date());
const longDate=s=>parse(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c};
const seeded=(arr,seed)=>arr.map(x=>[hash(seed+'|'+(x.id||x.t)),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const hourNow=()=>new Date().getHours();
const timeStr=ts=>{const d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ================= Расчёты (всё выводится из записей, поэтому любую отметку можно отменить) ================= */
const charNeed=l=>120+60*(l-1);
const skillNeed=l=>40+25*(l-1);
function lvlOf(xp,needFn){let l=1,x=xp;while(x>=needFn(l)){x-=needFn(l);l++}return{l,into:x,need:needFn(l)}}
function dayGoals(d){const order=seeded(GOALS,'g'+d);const g=order.slice(0,3);if(dow(d)===5)g[2]=SAT_GOAL;return g}
function goalProg(g,a){let cur=0,max=0,ok=true;g.p.forEach(([ids,n])=>{const c=ids.reduce((s,i)=>s+(+a[i]||0),0);cur+=Math.min(c,n);max+=n;if(c<n)ok=false});return{cur,max,ok}}
function morningQ(d){return QM[hash('m'+d)%QM.length]}
function eveningQ(d){return QE[hash('e'+d)%QE.length]}
function weekQs(m){const o=seeded(QW,'w'+m);return o.slice(0,2)}
function boardOpen(){const done=new Set(S.board.map(b=>b.id));let open=seeded(QB,'board').filter(q=>!done.has(q.id));if(!open.length)open=seeded(QB,'board2');return open.slice(0,6)}
function calc(){
  const sk={};SK_ORDER.forEach(k=>sk[k]=0);let xp=0;const goalsMet={};const byDay={};
  const add=(pts,s,d)=>{xp+=pts;sk[s]=(sk[s]||0)+pts;if(d)byDay[d]=(byDay[d]||0)+pts};
  for(const[d,day]of Object.entries(S.days)){
    const a=day.acts||{};
    for(const[id,c]of Object.entries(a)){const A=ACT[id];if(A&&c>0)add(A.pts*c,A.s,d)}
    for(const id of Object.keys(day.q||{})){if(day.q[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,d)}
    dayGoals(d).forEach((g,i)=>{if(goalProg(g,a).ok){add(g.b,g.s,d);goalsMet[d+'#'+i]=g}});
  }
  for(const[m,w]of Object.entries(S.weeks))for(const id of Object.keys(w)){if(w[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,null)}
  S.board.forEach(b=>{const q=AQ[b.id];if(q)add(q.pts,q.s,b.date)});
  S.bea.done.forEach(b=>{const c=CH[b.id];if(!c)return;const per=Math.round(c.xp/c.sk.length);c.sk.forEach(s=>add(per,s,b.date))});
  const spent=S.buys.reduce((s,b)=>s+b.cost,0);
  return{xp,sk,coins:xp-spent,goalsMet,byDay};
}
function streak(byDay){let n=0,d=today();if(!(byDay[d]>=20))d=addDays(d,-1);while((byDay[d]||0)>=20){n++;d=addDays(d,-1)}return n}

let AC=null;
function chime(notes,dur=.12){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*2.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*2.4)})}catch(e){}}


/* ================= Пиксельные портреты: кэш и анимация ================= */
const ART_CACHE={};
function artGrid(who,mood,o={}){const k=who+mood+(o.blink?1:0)+(o.glint?1:0);return ART_CACHE[k]||(ART_CACHE[k]=(who==='anna'?anna:bea)(mood,o))}
const URL_CACHE={};
function headURL(who,mood){const k=who+mood;if(URL_CACHE[k])return URL_CACHE[k];const g=artGrid(who,mood),h=new Grid(40,40);h.r(0,0,40,40,who==='anna'?'#2f3a5e':'#3a2030');for(let y=0;y<40;y++)for(let x=0;x<40;x++){const v=g.g(x+12,y+8);if(v)h.p(x,y,v)}return URL_CACHE[k]=h.canvas().toDataURL()}
function headImg(who,mood,alt){return `<img class="pixel" src="${headURL(who,mood)}" alt="${esc(alt||'')}" width="40" height="40">`}
function bustCanvas(who,mood,bg){const g=new Grid(64,64);g.r(0,0,64,64,bg||(who==='anna'?'#2f3a5e':'#3a2030'));g.blit(artGrid(who,mood),0,0);return g.canvas()}
function icon16(kind){
  const g=new Grid(16,16),O='#17121d';
  if(kind==='bike'){g.ring(4,11,3.6,3.6,O);g.ring(12,11,3.6,3.6,O);g.path([[4,11],[7,6],[11,6],[12,11]],'#c8473d');g.path([[7,6],[8,11],[4,11]],'#c8473d');g.l(6,5,8,5,O);g.l(10,4,12,4,O);g.l(11,4,11,6,O)}
  if(kind==='skate'){g.r(1,8,14,2,'#7a3b8c');g.p(0,7,'#7a3b8c');g.p(15,7,'#7a3b8c');g.r(3,10,2,1,'#888');g.r(11,10,2,1,'#888');g.r(3,11,2,2,'#f6d36c');g.r(11,11,2,2,'#f6d36c');g.outline(O)}
  if(kind==='book'){g.r(3,2,10,12,'#3f8f86');g.r(5,2,1,12,'#2b6862');g.r(7,5,4,1,'#e7e3c6');g.r(7,7,4,1,'#e7e3c6');g.outline(O)}
  if(kind==='card'){g.r(1,4,14,9,'#e7e3c6');g.r(2,6,4,5,'#5a7ec4');g.r(8,6,5,1,'#6a6274');g.r(8,8,4,1,'#6a6274');g.r(8,10,5,1,'#6a6274');g.outline(O)}
  return g.canvas();
}
function envGrid(){const g=new Grid(24,24);g.r(2,6,20,13,'#f3e3c3');g.path([[2,6],[12,13],[21,6]],'#b98a3e');g.e(12,13,3,3,'#8e2236');g.p(12,13,'#f8d36c');g.outline('#17121d');return g}

/* сцена Анны: комната, звёзды мерцают, Анна дышит, моргает, бликуют очки, меняет эмоции */
let annaMood='neutral',moodUntil=0,moodQueue=null,stageCv=null,lastKey='';
const ROOM=sceneRoom();
const STARS=[[12,12],[20,10],[33,14],[40,11],[15,20],[28,18],[38,22],[24,26]];
function baseMood(){const h=hourNow();if(h>=23||h<6)return 'tired';if(tab==='diary')return 'focus';return 'neutral'}
function setMood(m,ms,then){annaMood=m;moodUntil=performance.now()+ms;moodQueue=then||null;drawStage(true)}
function drawStage(force){
  if(!stageCv||!stageCv.isConnected){stageCv=document.getElementById('stage');if(!stageCv)return}
  const t=performance.now();
  if(moodUntil&&t>moodUntil){if(moodQueue){const q=moodQueue;moodQueue=null;annaMood=q[0];moodUntil=t+q[1]}else{annaMood=null;moodUntil=0}}
  const mood=annaMood||baseMood();
  const blink=(t%4300)<140&&mood!=='joy',glint=(t%7600)<300,bob=Math.floor(t/900)%2,tw=Math.floor(t/500);
  const key=mood+blink+glint+bob+(tw%4);
  if(!force&&key===lastKey)return;lastKey=key;
  const g=new Grid(ROOM.w,ROOM.h);g.c=ROOM.c.slice();
  STARS.forEach(([x,y],i)=>{if((i+tw)%4===0)g.p(x,y,'#203a6b');else if((i+tw)%4===1){g.p(x-1,y,'#9bb0e0');g.p(x+1,y,'#9bb0e0')}});
  g.blit(artGrid('anna',mood,{blink,glint}),24,16+bob);
  g.canvas(stageCv);
}
setInterval(()=>drawStage(),100);

/* ================= Уведомления ================= */
const KIND_ICON={xp:'+',lv:'★',bea:'Б',quest:'✓',info:'i'};
function iconFor(k){if(k==='bea')return headImg('bea','smile');if(k==='lv')return headImg('anna','joy');return KIND_ICON[k]||'•'}
function notify(kind,title,text,{log=true,sticky=false}={}){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');el.className='toast px dark';
  el.innerHTML=`<span class="ico k-${kind}">${iconFor(kind)}</span><div><b>${esc(title)}</b>${text?`<span>${esc(text)}</span>`:''}</div>`;
  box.prepend(el);while(box.children.length>4)box.lastChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},sticky?6500:3800);
  el.onclick=()=>el.remove();
  if(log){S.log.unshift({k:kind,t:title,x:text||'',ts:Date.now()});S.log=S.log.slice(0,150);if(!drawerOpen)S.unread=(S.unread||0)+1}
}

/* ================= Изменения с последствиями ================= */
function act(mutator,{x,y}={}){
  const before=calc();
  mutator();
  const after=calc();
  persist();
  const gained=after.xp-before.xp;
  Object.keys(after.goalsMet).forEach(k=>{if(!before.goalsMet[k]){const g=after.goalsMet[k];notify('quest','Цель дня выполнена',g.t+' · +'+g.b+' опыта');chime([660,880,1100])}});
  const lvUps=[];
  SK_ORDER.forEach(k=>{const a=lvlOf(before.sk[k],skillNeed).l,b=lvlOf(after.sk[k],skillNeed).l;if(b>a){notify('lv',SKILLS[k].n+': уровень '+b,'Навык вырос');perksAt(k,b).filter(p=>p[0]>a).forEach(p=>notify('lv','Новое умение: '+p[1],SKILLS[k].n));lvUps.push(k)}});
  const la=lvlOf(before.xp,charNeed).l,lb=lvlOf(after.xp,charNeed).l;
  renderAll();
  if(gained>0){setMood('joy',1600);floatGain('+'+gained);if(!lvUps.length&&lb===la)chime([523,784])}
  else if(gained<0)setMood('shy',1400);
  if(lvUps.length&&lb===la)chime([523,659,784,1046],.1);
  if(lb>la)setTimeout(()=>levelUp(lb,la),300);
}
function floatGain(t){const st=document.querySelector('.stagebox');if(!st)return;const r=st.getBoundingClientRect();const el=document.createElement('div');el.className='gain';el.textContent=t;el.style.left=(r.width*0.62+(Math.random()*30-15))+'px';el.style.top=(r.height*0.3)+'px';st.appendChild(el);setTimeout(()=>el.remove(),1100)}
function levelUp(l,prev){
  const t=titleOf(l),tp=titleOf(prev);
  notify('lv','Уровень '+l+'!',t!==tp?'Новый титул: '+t:'Опыт растёт',{sticky:true});
  chime([523,659,784,1046,1318],.13);setMood('surprise',900,['joy',2500]);
  const el=document.getElementById('lvl');
  const stars=Array.from({length:14},(_,i)=>`<i style="left:${(hash('s'+i)%96)+2}%;top:${(hash('t'+i)%90)+3}%;animation-delay:${(i%5)*.2}s"></i>`).join('');
  el.innerHTML=`<div class="stars">${stars}</div><div class="inner px dark" role="dialog" aria-label="Новый уровень"><div class="label" style="color:var(--gold-hi)">Новый уровень</div><canvas id="lvlcv"></canvas><div class="big">${l}</div>${t!==tp?`<p style="margin:0;font:400 20px var(--pix);color:#f3a6c0">Новый титул: ${esc(t)}</p>`:''}<div style="display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left"><span class="ico k-bea" style="width:44px;height:44px">${headImg('bea','smile')}</span><p class="voice" style="margin:0;font-size:15px;line-height:1.4">${esc(BEA_LV[l%BEA_LV.length])}</p></div><button class="pbtn" data-act="closelvl">Дальше</button></div>`;
  el.hidden=false;
  const cv=el.querySelector('#lvlcv');const g=bustCanvas('anna','surprise');cv.width=64;cv.height=64;cv.getContext('2d').drawImage(g,0,0);
  setTimeout(()=>{if(cv.isConnected)cv.getContext('2d').drawImage(bustCanvas('anna','joy'),0,0)},900);
  el.querySelector('button').focus();
}

function pickSpeech(C){
  const d=today(),a=(S.days[d]||{}).acts||{};
  const tot=C.byDay[d]||0,h=hourNow();
  if(h>=23||h<6)return tot?'Хватит на сегодня… Спать.':'Уже ночь. Может, завтра?';
  if(!tot)return h<12?'Утро! С чего начнём?':'Ещё ни одного опыта. Одна задача?';
  if(tot>=80)return 'Сегодня я в ударе!';
  if((a.phys||0)+(a.math||0)>=5)return 'Формулы так и щёлкают.';
  if((a.bike||0)+(a.skate||0))return 'Ветер в волосах, задачи в голове.';
  return 'Ещё немного, и новый уровень.';
}

function beaNext(){return CHAINS.find(c=>!S.bea.done.some(b=>b.id===c.id))}
function beaAvailable(){return !S.bea.cur&&!!beaNext()&&(!S.bea.nextAt||today()>=S.bea.nextAt)}
function beaReady(){const c=S.bea.cur&&CH[S.bea.cur];if(!c)return false;const st=S.bea.steps[c.id]||[];return c.steps.every((_,i)=>st[i])}

    const S2=SKILLS[k],L=lvlOf(C.sk[k],skillNeed),nx=S2.perks.find(p=>p[0]>L.l);
    return `<div class="sk px"><div class="skhead"><span class="rune sym">${S2.g}</span><div><b>${S2.n}</b><small>${C.sk[k]} опыта</small></div><span class="sklv">${L.l}</span></div>
    <div class="pbar"><i style="width:${L.into/L.need*100}%"></i></div>
    <small class="t2" style="font:400 15px var(--pix)">${L.into}/${L.need} до ур. ${L.l+1}${nx?' · на ур. '+nx[0]+': «'+esc(nx[1])+'»':''}</small>
    <div class="perks">${S2.perks.map(p=>`<span class="perk ${L.l>=p[0]?'on':''}">${L.l>=p[0]?'':'ур. '+p[0]+' · '}${esc(p[1])}</span>`).join('')}</div>
    <div class="feeds">${esc(S2.d)}</div></div>`}).join('')}</div></section>`;
}
function vDiary(C){
  const d=view,day=S.days[d]||{},a=day.acts||{},t=today();
  const min=addDays(t,-6);
  return `<section class="sec"><div class="sechead"><div class="daynav"><button class="pbtn plain sm" data-act="day" data-n="-1" ${d<=min?'disabled':''} aria-label="Предыдущий день">‹</button><b>${d===t?'Сегодня, ':''}${esc(longDate(d))}</b><button class="pbtn plain sm" data-act="day" data-n="1" ${d>=t?'disabled':''} aria-label="Следующий день">›</button></div><small>за день: +${C.byDay[d]||0} опыта</small></div>
  <div class="acts px">${ACTIONS.map(A=>{const v=+a[A.id]||0;return `<div class="act"><span class="rune sym">${SKILLS[A.s].g}</span><div><b>${esc(A.n)} <span>+${A.pts}</span></b><small>${esc(A.d)}${A.d?' · ':''}${SKILLS[A.s].n}</small></div>
   ${A.k==='count'?`<div class="cnt"><button class="pbtn plain" data-act="cnt" data-id="${A.id}" data-n="-1" ${v?'':'disabled'} aria-label="Убрать: ${esc(A.n)}">−</button><output>${v}</output><button class="pbtn teal" data-act="cnt" data-id="${A.id}" data-n="1" aria-label="Добавить: ${esc(A.n)}">+</button></div>`
   :`<button class="check big" aria-pressed="${!!v}" aria-label="${esc(A.n)}" data-act="tog" data-id="${A.id}">${v?'✓':''}</button>`}</div>`}).join('')}</div></section>`;
}
function vBag(C){
  const done=S.bea.done.map(b=>b.id);
  return `<section class="sec"><div class="sechead"><h2>Реликвии Беатрис</h2><small>${done.length} из ${CHAINS.length}</small></div>
  <div class="relics">${CHAINS.map(c=>{const got=done.includes(c.id);return `<div class="relic px ${got?'':'lock'}"><div class="slot ${got?'relic':'empty'}"><span class="rg sym">${got?c.relic[0]:'?'}</span></div><div><b>${got?esc(c.relic[1]):'Не найдена'}</b><small>${got?esc(c.relic[2])+' · за «'+esc(c.t)+'»':'Награда за легендарный квест'}</small></div></div>`}).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Лавка наград</h2><span class="coin"><i></i>${C.coins} квантов</span></div>
  <div class="shop">${REWARDS.map(([id,n,cost])=>{const cnt=S.buys.filter(b=>b.id===id).length;return `<div class="ware px"><b>${esc(n)}</b><span class="coin"><i></i>${cost}</span><button class="pbtn teal" data-act="buy" data-id="${id}" ${C.coins<cost?'disabled':''}>${C.coins<cost?'Нужно ещё '+(cost-C.coins):'Получить'}</button>${cnt?`<small class="t2">Получено: ${cnt}</small>`:''}</div>`}).join('')}</div>
  ${S.buys.length?`<div class="btnrow"><button class="pbtn plain" data-act="unbuy">Отменить последнюю покупку</button></div>`:''}</section>`;
}
const ANNA_MOODS=[['neutral','Спокойна'],['joy','Радость'],['surprise','Удивление'],['focus','Сосредоточена'],['tired','Устала'],['shy','Смущена']];
const BEA_MOODS=[['neutral','Спокойна'],['smile','Тёплая улыбка'],['smirk','Ухмылка'],['surprised','Впечатлена'],['stern','Строгая']];
function vChron(C){
  const quests=[];
  for(const[d,day]of Object.entries(S.days))for(const id of Object.keys(day.q||{}))if(day.q[id]&&AQ[id])quests.push([d,AQ[id]]);
  for(const[m,w]of Object.entries(S.weeks))for(const id of Object.keys(w))if(w[id]&&AQ[id])quests.push([m,AQ[id]]);
  S.board.forEach(b=>AQ[b.id]&&quests.push([b.date,AQ[b.id],b]));
  quests.sort((a,b)=>a[0]<b[0]?1:-1);
  return `<section class="sec"><div class="sechead"><h2>Журнал приключений</h2><small>${quests.length} ${plural(quests.length,'квест','квеста','квестов')} · ${S.bea.done.length} ${plural(S.bea.done.length,'легенда','легенды','легенд')}</small></div>
   ${S.bea.done.length?`<ul class="log px">${S.bea.done.slice().reverse().map(b=>`<li><span class="ico k-bea">${headImg('bea','smile')}</span><div><b>${esc(CH[b.id].t)}</b><br><small class="t2">Легендарный квест · ${esc(CH[b.id].relic[1])}</small></div><time>${esc(b.date)}</time></li>`).join('')}</ul>`:''}
   ${quests.length?`<ul class="log px">${quests.slice(0,40).map(([d,q,b])=>`<li><span class="ico k-quest">✓</span><div><b>${esc(q.t)}</b><br><small class="t2">${({qm:'Утренний',qe:'Вечерний',qw:'Недельный',qb:'Доска'})[q.kind]} · +${q.pts}</small>${b?` <button class="pbtn plain sm" data-act="unboard" data-id="${q.id}">Отменить</button>`:''}</div><time>${esc(d)}</time></li>`).join('')}</ul>`:'<div class="empty px">Здесь появятся выполненные квесты. Начни с утреннего на вкладке «Квесты».</div>'}
  </section>
  <section class="sec"><div class="sechead"><h2>Портреты</h2><small>эмоции меняются от того, что происходит</small></div>
   <div class="gallery">${ANNA_MOODS.map(([m,n])=>`<div class="mood px">${bustTag('anna',m,'Анна: '+n)}<span>${n}</span></div>`).join('')}${BEA_MOODS.map(([m,n])=>`<div class="mood px b">${bustTag('bea',m,'Беатрис: '+n)}<span>Беатрис: ${n.toLowerCase()}</span></div>`).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Настройки</h2></div>
   <div class="px settings">
    <div class="setrow"><label for="nm">Имя</label><input id="nm" type="text" value="${esc(S.name)}" maxlength="24" data-act="name"></div>
    <label class="toggle"><input id="snd" type="checkbox" ${S.sound?'checked':''} data-act="sound"> Звуки уведомлений</label>
    <small class="t2">${dbRef?'Прогресс сохраняется в твоём аккаунте и виден на всех устройствах.':'Прогресс сохраняется в этом браузере.'}</small>
   </div></section>`;
}
function renderDrawer(){
  const el=document.getElementById('drawer');
  if(!drawerOpen){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`<div class="head"><h2>Уведомления</h2><button class="pbtn plain sm" data-act="drawer" aria-label="Закрыть">✕</button></div>
  ${S.log.length?`<ul class="log px">${S.log.slice(0,60).map(n=>`<li><span class="ico k-${n.k}">${iconFor(n.k)}</span><div><b>${esc(n.t)}</b>${n.x?`<br><small class="t2">${esc(n.x)}</small>`:''}</div><time>${esc(timeStr(n.ts))}</time></li>`).join('')}</ul>`:'<div class="empty px">Пока тихо. Уведомления о квестах, уровнях и письмах Беатрис появятся здесь.</div>'}`;
}
function renderAll(){const C=calc();renderHud(C);renderHero(C);renderContent(C);renderDrawer()}

/* ================= Разговор с Беатрис ================= */
let D=null,typer=null,dlgCv=null,dlgTimer=null;
const STUDY=sceneStudy();
function drawDlg(){
  if(!D||!dlgCv||!dlgCv.isConnected)return;
  const t=performance.now(),mood=D.lines[D.i][0];
  const blink=(t%3900)<150&&mood!=='smile',bob=Math.floor(t/1100)%2,talk=D.typing&&Math.floor(t/160)%2;
  const g=new Grid(STUDY.w,STUDY.h);g.c=STUDY.c.slice();
  if(Math.floor(t/400)%2)g.e(82,6,6,3,'#f8d36c');
  g.blit(artGrid('bea',talk&&mood!=='surprised'?(mood==='smile'?'smile':'surprised'):mood,{blink}),16,16+bob);
  g.canvas(dlgCv);
}
function openDialog(lines,choices){D={lines:lines.map(l=>Array.isArray(l)?l:['neutral',l]),i:0,choices};showLine();clearInterval(dlgTimer);dlgTimer=setInterval(drawDlg,80)}
function showLine(){
  const el=document.getElementById('dlg');
  if(el.hidden||!el.querySelector('#dlgcv')){el.hidden=false;el.innerHTML=`<div class="scene" role="dialog" aria-label="Разговор с Беатрис"><div class="view"><canvas id="dlgcv" width="96" height="80" aria-hidden="true"></canvas></div><div class="box px"><span class="nameplate">Беатрис</span><div id="dlgbody"></div></div></div>`;dlgCv=document.getElementById('dlgcv')}
  const [,line]=D.lines[D.i],last=D.i===D.lines.length-1;
  document.getElementById('dlgbody').innerHTML=`<p class="voice" id="vtext" aria-live="polite"></p>
   ${last&&D.reward?D.reward:''}
   <div class="next">${last?`<div class="btnrow">${D.choices.map((c,i)=>`<button class="pbtn ${c.ghost?'plain':''}" data-act="choice" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`:`<span class="hint" style="color:var(--text2)">нажми, чтобы продолжить</span><button class="pbtn plain" data-act="dnext">Дальше<span class="caret"></span></button>`}</div>`;
  const t=document.getElementById('vtext');let k=0;clearInterval(typer);D.typing=true;
  typer=setInterval(()=>{k+=2;t.textContent=line.slice(0,k);if(k>=line.length){clearInterval(typer);D.typing=false}},28);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){clearInterval(typer);t.textContent=line;D.typing=false}
  drawDlg();
  const b=el.querySelector('#dlgbody .pbtn');b&&b.focus({preventScroll:true});
}
function dlgNext(){if(!D)return;if(D.typing){clearInterval(typer);document.getElementById('vtext').textContent=D.lines[D.i][1];D.typing=false;return}if(D.i<D.lines.length-1){D.i++;showLine()}}
function closeDialog(){clearInterval(typer);clearInterval(dlgTimer);D=null;const el=document.getElementById('dlg');el.hidden=true;el.innerHTML=''}
const introMoods=n=>Array.from({length:n},(_,i)=>i===n-1?'smirk':i===0?'neutral':'neutral');
function beaOpen(){
  const c=beaNext();if(!c)return;
  const lines=[];
  if(!S.bea.met)lines.push(['smile','Анна! Проходи, проходи. Я Беатрис. Сорок лет преподавала литературу и историю, а теперь вот учу тебя… или учусь у тебя, посмотрим.'],['smirk','Ты занимаешься физикой. Прекрасно. Но все великие открытия кто-то когда-то описал словами. Я буду давать тебе задания на стыке наших миров.'],['stern','Это не обычные квесты. Легендарные. Каждый в несколько шагов, и спрашивать я буду строго.'],['smile','Зато за каждый — реликвия из моей коллекции.']);
  const mm=introMoods(c.intro.length);c.intro.forEach((l,i)=>lines.push([mm[i],l]));
  chime([392,494,587]);
  openDialog(lines,[{t:'Принять задание',f:()=>{act(()=>{S.bea.cur=c.id;S.bea.met=true;S.bea.steps[c.id]=[]});notify('bea','Новый легендарный квест',c.t);closeDialog()}},{t:'Позже',ghost:true,f:()=>{if(!S.bea.met){S.bea.met=true;persist()}closeDialog()}}]);
}
function beaTalk(){
  const c=CH[S.bea.cur];if(!c)return;
  const st=S.bea.steps[c.id]||[],n=c.steps.filter((_,i)=>st[i]).length,next=c.steps.find((_,i)=>!st[i]);
  const lines=[n?['smile',`Уже ${n} из ${c.steps.length}. Я вижу, ты не торопишься, и это правильно.`]:['stern','Не знаешь, с чего начать? Начни с чтения. Всё начинается с чтения.']];
  if(next)lines.push(['smirk','Следующий шаг: «'+next+'». Возьми чай и садись.']);
  openDialog(lines,[{t:'Спасибо, Беатрис',f:closeDialog}]);
}
function beaTurnIn(){
  const c=CH[S.bea.cur];if(!c||!beaReady())return;
  const lines=c.outro.map((l,i)=>[i===0?'surprised':'smile',l]);
  openDialog(lines,[{t:'Принять реликвию',f:()=>{
    closeDialog();
    act(()=>{S.bea.done.push({id:c.id,date:today()});S.bea.cur=null;S.bea.nextAt=addDays(today(),1)});
    notify('bea','Легенда завершена: '+c.t,'+'+c.xp+' опыта · реликвия «'+c.relic[1]+'»',{sticky:true});
    chime([523,659,784,1046,1318],.12);setMood('joy',2500);
  }}]);
  D.reward=`<div class="reward px dark"><div class="slot relic"><span class="rg sym">${c.relic[0]}</span></div><div><b style="color:var(--gold-hi)">${esc(c.relic[1])}</b><br><small class="l2">+${c.xp} опыта · ${c.sk.map(k=>SKILLS[k].n).join(', ')}</small></div></div>`;
  showLine();
}

/* ================= События ================= */
const dayObj=d=>(S.days[d]=S.days[d]||{acts:{},q:{}},S.days[d].acts=S.days[d].acts||{},S.days[d].q=S.days[d].q||{},S.days[d]);
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(D&&ev.target.closest('#dlg .box, #dlg .view'))dlgNext();return}
  const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.tab;try{localStorage.setItem(LS+'-tab',tab)}catch(e){}renderAll();if(window.innerWidth<920)document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='cnt'){const id=b.dataset.id,n=+b.dataset.n;act(()=>{const d=dayObj(view);d.acts[id]=Math.max(0,(+d.acts[id]||0)+n)})}
  else if(a==='tog'){const id=b.dataset.id;act(()=>{const d=dayObj(view);d.acts[id]=d.acts[id]?0:1})}
  else if(a==='day'){view=addDays(view,+b.dataset.n);renderAll()}
  else if(a==='dq'){const id=b.dataset.id,d=today();const on=!(S.days[d]&&S.days[d].q&&S.days[d].q[id]);act(()=>{const o=dayObj(d);if(on)o.q[id]=true;else delete o.q[id]});if(on)notify('quest','Квест выполнен',AQ[id].t+' · +'+AQ[id].pts)}
  else if(a==='wq'){const id=b.dataset.id,m=monday(today());const on=!((S.weeks[m]||{})[id]);act(()=>{S.weeks[m]=S.weeks[m]||{};if(on)S.weeks[m][id]=true;else delete S.weeks[m][id]});if(on)notify('quest','Квест недели выполнен',AQ[id].t+' · +'+AQ[id].pts)}
  else if(a==='bq'){const id=b.dataset.id;act(()=>{S.board.push({id,date:today()})});notify('quest','Задание с доски выполнено',AQ[id].t+' · +'+AQ[id].pts);const nq=boardOpen()[5];if(nq)setTimeout(()=>notify('info','На доске новое задание',nq.t),700)}
  else if(a==='unboard'){const id=b.dataset.id;act(()=>{const i=S.board.map(x=>x.id).lastIndexOf(id);if(i>=0)S.board.splice(i,1)})}
  else if(a==='step'){const c=CH[S.bea.cur];if(!c)return;const i=+b.dataset.i;act(()=>{const st=S.bea.steps[c.id]=S.bea.steps[c.id]||[];st[i]=!st[i]});if(beaReady()){notify('bea','Все шаги пройдены','Беатрис ждёт твоего рассказа',{sticky:true});chime([587,740,880])}}
  else if(a==='beaopen')beaOpen();
  else if(a==='beatalk')beaTalk();
  else if(a==='beaturnin')beaTurnIn();
  else if(a==='dnext')dlgNext();
  else if(a==='choice'){const c=D&&D.choices[+b.dataset.i];c&&c.f()}
  else if(a==='closelvl'){document.getElementById('lvl').hidden=true}
  else if(a==='drawer'){drawerOpen=!drawerOpen;if(drawerOpen){S.unread=0;persist()}renderAll()}
  else if(a==='buy'){const r=REWARDS.find(x=>x[0]===b.dataset.id);const C=calc();if(!r||C.coins<r[2])return;S.buys.push({id:r[0],cost:r[2],date:today()});persist();notify('info','Награда получена',r[1]+' · −'+r[2]+' квантов');chime([784,659]);setMood('joy',1500);renderAll()}
  else if(a==='unbuy'){const r=S.buys.pop();persist();if(r)notify('info','Покупка отменена','Кванты вернулись',{log:false});renderAll()}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.act==='name'){S.name=t.value.trim().slice(0,24)||'Анна';persist();renderAll()}else if(t.dataset.act==='sound'){S.sound=t.checked;persist()}});
document.addEventListener('keydown',ev=>{
  if(D&&(ev.key===' '||ev.key==='Enter')&&!ev.target.closest('button')){ev.preventDefault();dlgNext()}
  if(ev.key==='Escape'){if(!document.getElementById('lvl').hidden)document.getElementById('lvl').hidden=true;else if(drawerOpen){drawerOpen=false;renderAll()}}
});

/* ================= Время: вечерние квесты, письма ================= */
function tick(){
  const d=today();
  if(view>d||view<addDays(d,-6))view=d;
  if(hourNow()>=EVENING_H&&!S.seenEve[d]){S.seenEve={[d]:true};persist();const e=eveningQ(d);notify('quest','Вечерний квест открыт',e.t,{sticky:true});chime([440,554,659]);renderAll()}
  if(S.letterDay!==d&&beaAvailable()&&S.bea.met){S.letterDay=d;persist();notify('bea','Письмо от Беатрис','У неё новое легендарное задание. Загляни на вкладку «Квесты»',{sticky:true});renderAll()}
}
renderAll();
setTimeout(()=>{if(!S.bea.met&&!S.log.length)notify('bea','Тебе письмо','Наставница Беатрис хочет познакомиться',{sticky:true});else tick();renderHud(calc())},900);
setInterval(tick,60000);
initRemote();
</script>
