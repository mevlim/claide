<title>Хроники Анны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,400;0,600;0,700;0,800;0,900;1,600&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: пиксельное меню персонажа. Слева сцена с Анной в её комнате (портрет с эмоциями), характеристики и снаряжение; справа вкладки журнала на бумажных панелях с пиксельными рамками. Беатрис говорит в окне визуальной новеллы на фоне своего кабинета. Одна тёмная тема намеренно. */
:root{
  --bg:#1d2135; --bg2:#22273f; --ink:#17121d;
  --paper:#e7e3c6; --paper-hi:#fbf8e4; --paper-lo:#c9c4a2; --text:#2a2130; --text2:#6a6274;
  --slate:#2b3150; --slate-hi:#3d4570; --slate-lo:#20243b; --light:#efe8d6; --light2:#a9a6c4;
  --teal:#3f8f86; --teal-hi:#6cc1b3; --gold:#e3a93a; --gold-hi:#f8d36c; --gold-lo:#a8711e;
  --red:#c8473d; --plum:#7a3b8c; --wine:#4a1a2c; --wine-hi:#7a2c45; --green:#5f9e48; --green-hi:#8fd06e; --sky:#5a7ec4;
  --pix:"Nunito","Trebuchet MS",-apple-system,"Segoe UI",sans-serif;
  --body:"Nunito",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{background:repeating-conic-gradient(var(--bg) 0 25%,var(--bg2) 0 50%) 0 0/24px 24px;color:var(--light);font:400 15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px;font-variant-numeric:tabular-nums;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px dashed var(--gold-hi);outline-offset:4px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--pix);font-weight:800}
.sym{font-variant-emoji:text}
.wrap{max-width:1180px;margin:0 auto}

/* Пиксельные рамки: внешний контур из четырёх теней даёт срезанные углы, внутренние тени дают фаску */
.px{background:var(--paper);color:var(--text);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--paper-hi),inset -4px -4px 0 0 var(--paper-lo)}
.px.dark{background:var(--slate);color:var(--light);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--slate-hi),inset -4px -4px 0 0 var(--slate-lo)}
.px.wine{background:var(--wine);color:var(--light);box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 var(--wine-hi),inset -4px -4px 0 0 #2e0f1c}
.px.done{background:#d3e2b4;box-shadow:-4px 0 0 0 var(--ink),4px 0 0 0 var(--ink),0 -4px 0 0 var(--ink),0 4px 0 0 var(--ink),inset 4px 4px 0 0 #eaf5d2,inset -4px -4px 0 0 #a9c487}
.pad{padding:16px 18px}
.label{font:700 13px var(--pix);letter-spacing:.08em;text-transform:uppercase}
.t2{color:var(--text2)}
.l2{color:var(--light2)}

/* кнопки */
.pbtn{font:700 16px var(--pix);letter-spacing:.02em;border:0;padding:8px 14px;min-height:42px;background:var(--gold);color:var(--ink);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold-hi),inset -3px -3px 0 0 var(--gold-lo);margin:3px}
.pbtn:hover{filter:brightness(1.07)}
.pbtn:active{transform:translateY(2px);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold-lo),inset -3px -3px 0 0 var(--gold-hi)}
.pbtn.teal{background:var(--teal);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--teal-hi),inset -3px -3px 0 0 #2b6862}
.pbtn.plain{background:var(--paper);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--paper-hi),inset -3px -3px 0 0 var(--paper-lo)}
.pbtn.on{background:var(--green);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--green-hi),inset -3px -3px 0 0 #3f7230}
.pbtn.sm{min-height:34px;padding:4px 10px;font-size:13.5px}
.pbtn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.4);transform:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

/* полоски: сегментированные */
.pbar{height:14px;background:var(--ink);padding:2px;position:relative}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--c,var(--teal-hi)) 0 6px,var(--c2,var(--teal)) 6px 8px);transition:width .5s steps(8)}
.pbar.gold i{--c:var(--gold-hi);--c2:var(--gold)}.pbar.green i{--c:var(--green-hi);--c2:var(--green)}.pbar.red i{--c:#ef8f6a;--c2:var(--red)}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;padding-block:14px 12px;background:linear-gradient(var(--bg) 75%,transparent)}
.hudin{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;padding:10px 14px;margin:4px}
.lv{flex:none;width:56px;height:56px;display:grid;place-items:center;background:var(--wine);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--wine-hi),inset -3px -3px 0 0 #2e0f1c;margin:3px;text-align:center;line-height:1}
.lv b{font:700 26px var(--pix);color:var(--gold-hi);display:block}
.lv small{font:700 13px var(--pix);color:var(--light2);letter-spacing:.12em}
.hudava{width:56px;height:56px;flex:none;margin:3px;background:#2f3a5e;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink)}
.who{flex:1 1 220px;min-width:0;display:grid;gap:5px}
.who h1{font:700 20px/1 var(--pix)}
.who h1 span{font:700 16px var(--pix);color:var(--gold-hi);margin-left:8px}
.xpline{display:flex;justify-content:space-between;font:700 13px var(--pix);color:var(--light2)}
.purse{display:flex;gap:16px;align-items:center}
.coin{display:inline-flex;align-items:center;gap:6px;font:700 16px var(--pix);color:var(--gold-hi)}
.coin i{width:14px;height:14px;background:var(--gold);box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo),0 0 0 2px var(--ink);display:inline-block}
.streak{font:700 16px var(--pix);color:#ef8f6a;display:inline-flex;gap:6px;align-items:center}
.streak i{width:10px;height:14px;background:linear-gradient(var(--gold-hi) 0 40%,#ef8f6a 40% 75%,var(--red) 75%);clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%);display:inline-block}
.bell{position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center}
.bell .dot{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;background:var(--red);color:#fff;font:700 13px/20px var(--pix);padding:0 4px;box-shadow:0 0 0 2px var(--ink)}
.bell.ring svg{animation:bell 2.4s steps(1) infinite}
@keyframes bell{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(15deg)}88%{transform:rotate(-15deg)}92%{transform:rotate(10deg)}96%{transform:rotate(-6deg)}}

.main{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:22px;align-items:start;margin-top:6px}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}.hud{position:static}}

/* героиня */
.herocard{margin:4px;padding:12px}
.stagebox{position:relative;background:var(--ink);padding:4px}
#stage svg{display:block;width:100%;height:auto;aspect-ratio:280/200;max-width:100%}
.speech{position:absolute;left:10px;top:8px;max-width:50%;font:700 13px/1.3 var(--pix);background:var(--paper-hi);color:var(--text);padding:6px 9px;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);animation:pop .25s steps(3)}
.speech::after{content:"";position:absolute;left:14px;bottom:-9px;width:9px;height:6px;background:var(--paper-hi);box-shadow:3px 0 0 var(--ink),0 3px 0 var(--ink),-3px 0 0 var(--ink);clip-path:polygon(0 0,100% 0,0 100%)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.gain{position:absolute;font:700 20px var(--pix);color:var(--gold-hi);text-shadow:2px 2px 0 var(--ink),-2px 2px 0 var(--ink),2px -2px 0 var(--ink),-2px -2px 0 var(--ink);pointer-events:none;animation:gain 1.1s steps(10) forwards}
@keyframes gain{to{transform:translateY(-54px);opacity:0}}
.classline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:12px}
.classline b{font:700 16px var(--pix);color:var(--wine)}
.classline span{font:700 13px var(--pix);color:var(--text2)}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center;font:700 16px var(--pix)}
.bar output{text-align:right;color:var(--text2)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px;margin-top:14px}
.stat{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:6px;align-items:center;font:700 13px var(--pix)}
.stat .g{color:var(--plum);font-weight:700;text-align:center}
.stat b{color:var(--teal);font-weight:700}
.stat .pbar{grid-column:2/-1;height:8px;padding:1px}
.equiphead{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.equip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:10px;padding:3px}
.slot{aspect-ratio:1;max-width:100%;display:grid;place-items:center;position:relative;background:#cdc8a6;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 #b3ae8c,inset -3px -3px 0 0 #e6e1c0}
.slot>svg{width:62%;height:auto;aspect-ratio:1}
.slot.relic{background:#f0d48a;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--gold),inset -3px -3px 0 0 #fff0c0}
.slot .rg{font:700 26px/1 var(--pix);color:var(--wine)}
.slot.empty .rg{color:#a8a384}
.tt{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--light);font:700 13px var(--pix);padding:4px 7px;white-space:nowrap;opacity:0;pointer-events:none;z-index:3}
.slot:hover .tt,.slot:focus .tt{opacity:1}

/* вкладки */
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:6px 4px 10px;margin-bottom:12px}
.tab{position:relative;font:700 16px var(--pix);border:0;padding:8px 14px;min-height:44px;white-space:nowrap;background:var(--slate);color:var(--light2);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--slate-hi),inset -3px -3px 0 0 var(--slate-lo);margin:3px}
.tab[aria-selected="true"]{background:var(--paper);color:var(--text);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 3px 3px 0 0 var(--paper-hi),inset -3px -3px 0 0 var(--paper-lo);transform:translateY(-2px)}
.tab .pip{position:absolute;top:-6px;right:-6px;width:10px;height:10px;background:var(--red);box-shadow:0 0 0 2px var(--ink);animation:blinkpip 1s steps(1) infinite}
@keyframes blinkpip{50%{opacity:.3}}
.sec{display:grid;gap:14px;margin-bottom:24px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:0 4px}
.sechead h2{font:700 20px var(--pix);color:var(--gold-hi);text-shadow:2px 2px 0 var(--ink)}
.sechead small{color:var(--light2);font:700 13px var(--pix)}

/* Беатрис */
.mentor{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;align-items:start;margin:4px}
.ava{background:#3a2030;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);margin:3px;display:block}
.ava svg{display:block;width:100%;height:auto}
.mentor .ava{width:98px}
.voice{font:italic 600 16.5px/1.45 var(--pix)}
.legend{display:grid;gap:10px;min-width:0}
.legend h3{font:700 20px/1.15 var(--pix);color:var(--gold-hi)}
.rarity{font:700 13px var(--pix);letter-spacing:.1em;color:#f3a6c0;text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start}
.check{width:30px;height:30px;border:0;padding:0;margin:3px;background:var(--paper-hi);color:var(--ink);font:700 16px/1 var(--pix);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 #fff,inset -2px -2px 0 0 var(--paper-lo)}
.check[aria-pressed="true"]{background:var(--gold);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--gold-hi),inset -2px -2px 0 0 var(--gold-lo)}
.check.big{width:38px;height:38px}
.check.big[aria-pressed="true"]{background:var(--green);color:#fff;box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--green-hi),inset -2px -2px 0 0 #3f7230}
.steps li span{padding-top:6px;font-size:15px}
.steps li.done span{opacity:.6;text-decoration:line-through}
.letter{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;width:calc(100% - 8px);margin:4px;text-align:left;border:0;cursor:pointer;animation:wiggle 2s steps(1) infinite}
@keyframes wiggle{0%,86%,100%{transform:none}90%{transform:translate(2px,-2px)}94%{transform:translate(-2px,0)}}
.letter b{font:700 16px var(--pix);color:var(--wine);display:block}
.letter svg{width:64px;height:64px}

/* квесты */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding:4px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px 16px;align-content:start}
.q .kind{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font:700 13px var(--pix);letter-spacing:.08em;text-transform:uppercase}
.q .kind em{font-style:normal;color:var(--text2);letter-spacing:0;text-transform:none}
.q.morning .kind span{color:#b5651d}.q.evening .kind span{color:var(--plum)}.q.week .kind span{color:var(--red)}.q.board .kind span{color:var(--teal)}.q.goal .kind span{color:#3f7230}
.q b{font:700 16px/1.2 var(--pix)}
.q small{grid-column:1/-1;color:var(--text2);font-size:14px;line-height:1.35}
.q .rw{font:700 16px var(--pix);color:var(--teal);white-space:nowrap}
.q .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.q.locked{opacity:.6}
.skt{font:700 13px var(--pix);color:var(--text2);display:inline-flex;gap:5px;align-items:center}
.skt i{font-style:normal;color:var(--plum);font-weight:700}
.gprog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font:700 13px var(--pix);color:var(--text2)}
.quote{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;margin:4px;padding:12px 16px}
.quote .ava{width:58px}

/* навыки */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;padding:4px}
.sk{padding:14px 16px;display:grid;gap:8px;align-content:start}
.skhead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.rune{width:40px;height:40px;display:grid;place-items:center;font:700 20px var(--pix);color:var(--gold-hi);background:var(--wine);box-shadow:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink),inset 2px 2px 0 0 var(--wine-hi);margin:3px}
.skhead b{font:700 16px var(--pix);display:block}
.skhead small{color:var(--text2);font:700 13px var(--pix)}
.sklv{font:700 26px var(--pix);color:var(--teal)}
.perks{display:flex;flex-wrap:wrap;gap:8px;padding:2px}
.perk{font:700 13px var(--pix);padding:3px 8px;background:var(--paper-lo);color:var(--text2);box-shadow:0 0 0 2px var(--ink)}
.perk.on{background:var(--gold-hi);color:var(--ink)}
.feeds{font-size:13px;color:var(--text2)}

/* дела */
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font:700 16px var(--pix);color:var(--light)}
.acts{margin:4px;padding:6px 14px}
.act{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:3px dotted var(--paper-lo);min-height:62px}
.act:last-child{border-bottom:0}
.act .rune{width:34px;height:34px;font-size:16px}
.act b{font:700 16px var(--pix);display:block}
.act b span{color:var(--teal);font-size:14px}
.act small{color:var(--text2);font-size:13.5px;display:block;line-height:1.3}
.cnt{display:flex;align-items:center;gap:4px}
.cnt output{min-width:30px;text-align:center;font:700 20px var(--pix)}
.cnt .pbtn{width:40px;height:40px;min-height:0;padding:0;font-size:20px}

/* сундук, хроника */
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px;padding:4px}
.relic{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px}
.relic .slot{width:48px;margin:3px}
.relic b{font:700 16px var(--pix);display:block}
.relic small{color:var(--text2);font-size:13px;line-height:1.3;display:block}
.relic.lock b{color:var(--text2)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px;padding:4px}
.ware{padding:14px 16px;display:grid;gap:10px;align-content:start}
.ware b{font:700 16px var(--pix)}
.ware .coin{color:var(--gold-lo)}
.ware .coin i{box-shadow:inset 2px 2px 0 var(--gold-hi),inset -2px -2px 0 var(--gold-lo),0 0 0 2px var(--ink)}
.log{list-style:none;margin:4px;padding:4px 14px}
.log li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-bottom:3px dotted var(--paper-lo);align-items:start;font-size:14.5px}
.log li:last-child{border-bottom:0}
.log b{font:700 16px var(--pix)}
.log time{font:700 13px var(--pix);color:var(--text2);white-space:nowrap;padding-top:2px}
.ico{width:34px;height:34px;display:grid;place-items:center;font:700 16px var(--pix);color:#fff;box-shadow:0 0 0 2px var(--ink)}
.ico img{width:100%;height:100%;display:block}
.k-xp{background:var(--teal)}.k-lv{background:var(--gold);color:var(--ink)}.k-bea{background:var(--wine)}.k-quest{background:var(--green)}.k-info{background:var(--sky)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:16px;padding:4px}
.mood{display:grid;gap:6px;justify-items:center;text-align:center;font:700 13px var(--pix);padding:8px}
.mood .char{width:100%;height:auto;aspect-ratio:200/240;background:#2f3a5e;border-radius:12px}
.mood.b .char{background:#3a2030}
.settings{display:grid;gap:12px;margin:4px;padding:16px}
.setrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;font:700 16px var(--pix)}
input[type=text]{background:var(--paper-hi);border:0;box-shadow:0 0 0 3px var(--ink);padding:8px 10px;min-height:42px;font:700 16px var(--pix);color:var(--text)}

/* новый уровень */
#lvl{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#0b0a12e8;padding-inline:16px;animation:fade .2s steps(3)}

@media (max-width:480px){.who h1{font-size:18px}.mentor{grid-template-columns:70px minmax(0,1fr);gap:12px}.mentor .ava{width:64px}.box .voice{font-size:16.5px}.hudava{display:none}}

/* ===== Мягкое оформление поверх базовых правил: скругления, тени, плавные анимации ===== */
body{background:radial-gradient(1100px 600px at 10% -10%,#2a3260 0%,transparent 60%),radial-gradient(900px 500px at 110% 0%,#3a2340 0%,transparent 55%),var(--bg);background-attachment:fixed}

/* анимации персонажей */
.char .breathe{transform-origin:100px 240px;animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-1.6px) scale(1.006)}}

"use strict";

const AC_={hair:'#5a3220',hair2:'#3f2215',hairHi:'#8a5434',skin:'#fbd8bd',skin2:'#eeb592',skin3:'#d98f6e',blush:'#f08c86',iris:'#7a4524',line:'#2e1a12',
  glass:'#7b3f9e',coat:'#2f8576',coat2:'#236a5e',coatHi:'#48a593',shirt:'#fbf7ee',shirt2:'#ddd8cc',trim:'#e9b23e',book:'#c0404f',book2:'#8e2a38',page:'#fff6dc'};
const BC_={hair:'#1b1824',hair2:'#2c2738',curl:'#4d4668',skin:'#f1c8a6',skin2:'#dda480',skin3:'#bf7f60',iris:'#2f8a66',line:'#1a1018',lip:'#9c2238',lip2:'#6a1224',

function annaFace(m,o){
  const C=AC_,L=84,R=116,Y=106;

  const halfEye=(x,look=0)=>`<g class="${o.noblink?'':'blinker'}" style="transform-origin:${x}px ${Y}px"><path d="M${x-8.5} ${Y-1} Q${x} ${Y+8} ${x+8.5} ${Y-1} Z" fill="#fff"/><circle cx="${x+look}" cy="${Y+2}" r="4.4" fill="${C.iris}"/><circle cx="${x+look}" cy="${Y+2}" r="2.2" fill="#1c0e08"/><circle cx="${x+look-1.5}" cy="${Y+.6}" r="1.1" fill="#fff"/><path d="M${x-10} ${Y-1} Q${x} ${Y-3} ${x+10} ${Y-1}" stroke="${C.line}" stroke-width="3" fill="none" stroke-linecap="round"/></g>`;

  const brow=(x,t)=>{const s=x<100?-1:1,y=90;const d={n:`M${x-9} ${y+1} Q${x} ${y-4} ${x+9} ${y}`,up:`M${x-9} ${y-3} Q${x} ${y-9} ${x+9} ${y-4}`,ang:s<0?`M${x-9} ${y-1} Q${x} ${y-1} ${x+9} ${y+4}`:`M${x-9} ${y+4} Q${x} ${y-1} ${x+9} ${y-1}`,sad:s<0?`M${x-9} ${y+3} Q${x} ${y-3} ${x+9} ${y-5}`:`M${x-9} ${y-5} Q${x} ${y-3} ${x+9} ${y+3}`}[t];return `<path d="${d}" stroke="${C.hair2}" stroke-width="3.4" fill="none" stroke-linecap="round"/>`};

  else if(m==='shy'){brows=brow(L,'sad')+brow(R,'sad');eyes=openEye(L,3)+openEye(R,3);mouth=`<path d="M93 133 q3.5 3 7 0 t7 0" stroke="${C.line}" stroke-width="2.4" fill="none" stroke-linecap="round"/>`}
  else{brows=brow(L,'n')+brow(R,'n');eyes=openEye(L)+openEye(R);mouth=`<path d="M91 130 Q100 137 109 130" stroke="${C.line}" stroke-width="2.6" fill="none" stroke-linecap="round"/>`}
  const blushOp=m==='joy'||m==='shy'?.65:.28;
  return `<ellipse cx="76" cy="122" rx="9" ry="5" fill="${C.blush}" opacity="${blushOp}"/><ellipse cx="124" cy="122" rx="9" ry="5" fill="${C.blush}" opacity="${blushOp}"/>${brows}${eyes}<path d="M101 112 q3 7 -2 9" stroke="${C.skin3}" stroke-width="2.2" fill="none" stroke-linecap="round"/>${mouth}${extra}`;
}

  else{brows=brow(L,'arch')+brow(R,'arch');eyes=eye(L)+eye(R);mouth=lips('M90 129 Q95 126 100 128 Q105 126 110 129 Q100 135 90 129Z','M91 129.5 Q100 131 109 129.5 Q100 134 91 129.5Z')}

/* ================= Утилиты ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const monday=s=>addDays(s,-dow(s));
const today=()=>iso(new Date());
const longDate=s=>parse(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c};
const seeded=(arr,seed)=>arr.map(x=>[hash(seed+'|'+(x.id||x.t)),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const hourNow=()=>new Date().getHours();
const timeStr=ts=>{const d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ================= Расчёты (всё выводится из записей, поэтому любую отметку можно отменить) ================= */
const charNeed=l=>120+60*(l-1);
const skillNeed=l=>40+25*(l-1);
function lvlOf(xp,needFn){let l=1,x=xp;while(x>=needFn(l)){x-=needFn(l);l++}return{l,into:x,need:needFn(l)}}
function dayGoals(d){const order=seeded(GOALS,'g'+d);const g=order.slice(0,3);if(dow(d)===5)g[2]=SAT_GOAL;return g}
function goalProg(g,a){let cur=0,max=0,ok=true;g.p.forEach(([ids,n])=>{const c=ids.reduce((s,i)=>s+(+a[i]||0),0);cur+=Math.min(c,n);max+=n;if(c<n)ok=false});return{cur,max,ok}}
function morningQ(d){return QM[hash('m'+d)%QM.length]}
function eveningQ(d){return QE[hash('e'+d)%QE.length]}
function weekQs(m){const o=seeded(QW,'w'+m);return o.slice(0,2)}
function boardOpen(){const done=new Set(S.board.map(b=>b.id));let open=seeded(QB,'board').filter(q=>!done.has(q.id));if(!open.length)open=seeded(QB,'board2');return open.slice(0,6)}
function calc(){
  const sk={};SK_ORDER.forEach(k=>sk[k]=0);let xp=0;const goalsMet={};const byDay={};
  const add=(pts,s,d)=>{xp+=pts;sk[s]=(sk[s]||0)+pts;if(d)byDay[d]=(byDay[d]||0)+pts};
  for(const[d,day]of Object.entries(S.days)){
    const a=day.acts||{};
    for(const[id,c]of Object.entries(a)){const A=ACT[id];if(A&&c>0)add(A.pts*c,A.s,d)}
    for(const id of Object.keys(day.q||{})){if(day.q[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,d)}
    dayGoals(d).forEach((g,i)=>{if(goalProg(g,a).ok){add(g.b,g.s,d);goalsMet[d+'#'+i]=g}});
  }
  for(const[m,w]of Object.entries(S.weeks))for(const id of Object.keys(w)){if(w[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,null)}
  S.board.forEach(b=>{const q=AQ[b.id];if(q)add(q.pts,q.s,b.date)});
  S.bea.done.forEach(b=>{const c=CH[b.id];if(!c)return;const per=Math.round(c.xp/c.sk.length);c.sk.forEach(s=>add(per,s,b.date))});
  const spent=S.buys.reduce((s,b)=>s+b.cost,0);
  return{xp,sk,coins:xp-spent,goalsMet,byDay};
}
function streak(byDay){let n=0,d=today();if(!(byDay[d]>=20))d=addDays(d,-1);while((byDay[d]||0)>=20){n++;d=addDays(d,-1)}return n}
const titleOf=l=>{let t=TITLES[0][1];TITLES.forEach(([lv,n])=>{if(l>=lv)t=n});return t};
const perksAt=(k,l)=>SKILLS[k].perks.filter(p=>l>=p[0]);

function chime(notes,dur=.12){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*2.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*2.4)})}catch(e){}}

/* ================= Изменения с последствиями ================= */
function act(mutator,{x,y}={}){
  const before=calc();
  mutator();
  const after=calc();
  persist();
  const gained=after.xp-before.xp;
  Object.keys(after.goalsMet).forEach(k=>{if(!before.goalsMet[k]){const g=after.goalsMet[k];notify('quest','Цель дня выполнена',g.t+' · +'+g.b+' опыта');chime([660,880,1100])}});
  const lvUps=[];
  SK_ORDER.forEach(k=>{const a=lvlOf(before.sk[k],skillNeed).l,b=lvlOf(after.sk[k],skillNeed).l;if(b>a){notify('lv',SKILLS[k].n+': уровень '+b,'Навык вырос');perksAt(k,b).filter(p=>p[0]>a).forEach(p=>notify('lv','Новое умение: '+p[1],SKILLS[k].n));lvUps.push(k)}});
  const la=lvlOf(before.xp,charNeed).l,lb=lvlOf(after.xp,charNeed).l;
  renderAll();
  if(gained>0){setMood('joy',1600);floatGain('+'+gained);if(!lvUps.length&&lb===la)chime([523,784])}
  else if(gained<0)setMood('shy',1400);
  if(lvUps.length&&lb===la)chime([523,659,784,1046],.1);
  if(lb>la)setTimeout(()=>levelUp(lb,la),300);
}
function floatGain(t){const st=document.querySelector('.stagebox');if(!st)return;const r=st.getBoundingClientRect();const el=document.createElement('div');el.className='gain';el.textContent=t;el.style.left=(r.width*0.62+(Math.random()*30-15))+'px';el.style.top=(r.height*0.3)+'px';st.appendChild(el);setTimeout(()=>el.remove(),1100)}
function levelUp(l,prev){
  const t=titleOf(l),tp=titleOf(prev);
  notify('lv','Уровень '+l+'!',t!==tp?'Новый титул: '+t:'Опыт растёт',{sticky:true});
  chime([523,659,784,1046,1318],.13);setMood('surprise',900,['joy',2500]);
  const el=document.getElementById('lvl');
  const stars=Array.from({length:14},(_,i)=>`<i style="left:${(hash('s'+i)%96)+2}%;top:${(hash('t'+i)%90)+3}%;animation-delay:${(i%5)*.2}s"></i>`).join('');
  el.innerHTML=`<div class="stars">${stars}</div><div class="inner px dark" role="dialog" aria-label="Новый уровень"><div class="label" style="color:var(--gold-hi)">Новый уровень</div><div class="lvlart">${annaSVG('surprise')}</div><div class="big">${l}</div>${t!==tp?`<p style="margin:0;font:700 16px var(--pix);color:#f3a6c0">Новый титул: ${esc(t)}</p>`:''}<div style="display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center;text-align:left"><span class="ico k-bea" style="width:44px;height:44px">${headImg('bea','smile')}</span><p class="voice" style="margin:0;font-size:14.5px;line-height:1.4">${esc(BEA_LV[l%BEA_LV.length])}</p></div><button class="pbtn" data-act="closelvl">Дальше</button></div>`;
  el.hidden=false;
  setTimeout(()=>{const x=el.querySelector('.lvlart');if(x)x.innerHTML=annaSVG('joy')},900);
  el.querySelector('button').focus();
}

/* --- Беатрис --- */
function beaNext(){return CHAINS.find(c=>!S.bea.done.some(b=>b.id===c.id))}
function beaAvailable(){return !S.bea.cur&&!!beaNext()&&(!S.bea.nextAt||today()>=S.bea.nextAt)}
function beaReady(){const c=S.bea.cur&&CH[S.bea.cur];if(!c)return false;const st=S.bea.steps[c.id]||[];return c.steps.every((_,i)=>st[i])}
function vMentor(){
  const c=S.bea.cur&&CH[S.bea.cur];

  else if(a==='beatalk')beaTalk();
  else if(a==='beaturnin')beaTurnIn();
  else if(a==='dnext')dlgNext();
  else if(a==='choice'){const c=D&&D.choices[+b.dataset.i];c&&c.f()}
  else if(a==='closelvl'){document.getElementById('lvl').hidden=true}
  else if(a==='drawer'){drawerOpen=!drawerOpen;if(drawerOpen){S.unread=0;persist()}renderAll()}
  else if(a==='buy'){const r=REWARDS.find(x=>x[0]===b.dataset.id);const C=calc();if(!r||C.coins<r[2])return;S.buys.push({id:r[0],cost:r[2],date:today()});persist();notify('info','Награда получена',r[1]+' · −'+r[2]+' квантов');chime([784,659]);setMood('joy',1500);renderAll()}
  else if(a==='unbuy'){const r=S.buys.pop();persist();if(r)notify('info','Покупка отменена','Кванты вернулись',{log:false});renderAll()}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.act==='name'){S.name=t.value.trim().slice(0,24)||'Анна';persist();renderAll()}else if(t.dataset.act==='sound'){S.sound=t.checked;persist()}});
document.addEventListener('keydown',ev=>{
  if(D&&(ev.key===' '||ev.key==='Enter')&&!ev.target.closest('button')){ev.preventDefault();dlgNext()}
  if(ev.key==='Escape'){if(!document.getElementById('lvl').hidden)document.getElementById('lvl').hidden=true;else if(drawerOpen){drawerOpen=false;renderAll()}}
});

/* ================= Время: вечерние квесты, письма ================= */
function tick(){
  const d=today();
  if(view>d||view<addDays(d,-6))view=d;
  if(hourNow()>=EVENING_H&&!S.seenEve[d]){S.seenEve={[d]:true};persist();const e=eveningQ(d);notify('quest','Вечерний квест открыт',e.t,{sticky:true});chime([440,554,659]);renderAll()}
  if(S.letterDay!==d&&beaAvailable()&&S.bea.met){S.letterDay=d;persist();notify('bea','Письмо от Беатрис','У неё новое легендарное задание. Загляни на вкладку «Квесты»',{sticky:true});renderAll()}
}
renderAll();
setTimeout(()=>{if(!S.bea.met&&!S.log.length)notify('bea','Тебе письмо','Наставница Беатрис хочет познакомиться',{sticky:true});else tick();renderHud(calc())},900);
setInterval(tick,60000);
initRemote();
</script>
