<title>Хроники Анны</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Commissioner:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: меню персонажа из ролевой игры. Слева героиня на астролябии, её характеристики и снаряжение; справа вкладки журнала. Задания Беатрис приходят письмами и разговором в стиле визуальной новеллы. Одна ночная тема намеренно. */
:root{
  --void:#0d0f1e; --panel:#161a30; --panel2:#1d2240; --line:#2c3360; --line2:#3a4278;
  --text:#ece7da; --muted:#9a9dbd; --brass:#d8a85a; --brass-hi:#f3d48f; --quant:#69e2d2; --quant-dim:#2a6a6a;
  --rose:#e98da0; --wine:#7d2f45; --good:#8fe29b; --bad:#ff8574;
  --skin:#f1c9a5; --coat:#3b6f93; --hair:#4a2f22;
  --display:"Philosopher","Palatino Linotype",Georgia,serif;
  --body:"Commissioner",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --voice:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{background:radial-gradient(1200px 600px at 15% -10%,#1f2550 0%,transparent 60%),radial-gradient(900px 500px at 110% 10%,#2a1c3d 0%,transparent 55%),var(--void);background-attachment:fixed;color:var(--text);font:400 15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px;font-variant-numeric:tabular-nums;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--void)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--quant);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:700}
.sym{font-variant-emoji:text}
.wrap{max-width:1180px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:linear-gradient(var(--void) 70%,transparent);padding-block:12px 10px;display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.lvbadge{width:52px;height:52px;flex:none;display:grid;place-items:center;position:relative}
.lvbadge svg{position:absolute;inset:0}
.lvbadge b{position:relative;font:700 19px/1 var(--display);color:var(--brass-hi)}
.lvbadge small{position:absolute;bottom:-3px;font:700 9px var(--mono);letter-spacing:.12em;color:var(--brass);background:var(--void);padding:0 3px}
.who{flex:1 1 220px;min-width:0}
.who h1{font:700 20px/1.1 var(--display);letter-spacing:.01em}
.who h1 span{color:var(--muted);font:400 14px var(--body);margin-left:6px}
.xpbar{height:10px;margin-top:6px;border-radius:5px;background:#0a0c18;border:1px solid var(--line2);overflow:hidden;position:relative}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--quant-dim),var(--quant));border-radius:5px;transition:width .6s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 12px var(--quant)}
.xpline{display:flex;justify-content:space-between;font:500 11.5px var(--mono);color:var(--muted);margin-top:3px}
.purse{display:flex;gap:14px;align-items:center}
.coin{display:flex;align-items:center;gap:6px;font:700 15px var(--mono);color:var(--brass-hi)}
.coin i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--brass-hi),var(--brass) 60%,#8a6324);box-shadow:0 0 8px #d8a85a66;display:inline-block}
.streak{font:700 15px var(--mono);color:var(--rose);display:flex;gap:5px;align-items:center}
.iconbtn{position:relative;width:42px;height:42px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);display:grid;place-items:center;padding:0;color:var(--text)}
.iconbtn:hover{border-color:var(--brass)}
.iconbtn .dot{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--rose);color:#2a0f18;font:700 11px/19px var(--mono);padding:0 5px}
.iconbtn.ring svg{animation:bell 2.4s ease-in-out infinite;transform-origin:50% 10%}
@keyframes bell{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(14deg)}88%{transform:rotate(-12deg)}92%{transform:rotate(8deg)}96%{transform:rotate(-4deg)}}

/* main grid */
.main{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:20px;align-items:start;margin-top:6px}
@media (max-width:920px){.main{grid-template-columns:minmax(0,1fr)}.hud{position:static}}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;position:relative}
.panel.frame::before{content:"";position:absolute;inset:5px;border:1px solid #d8a85a22;border-radius:10px;pointer-events:none}
.pad{padding:16px}
.eyebrow{font:700 11px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--brass)}
.muted{color:var(--muted)}

/* hero card */
.herocard{overflow:hidden}
.stage{position:relative;height:300px;display:grid;place-items:center;background:radial-gradient(circle at 50% 58%,#25306a 0%,#161a30 62%)}
.stage svg.hero{width:min(260px,80%);height:auto;max-width:100%;overflow:visible}
.ring{transform-origin:110px 150px;animation:spin 60s linear infinite}
.ring2{transform-origin:110px 150px;animation:spin 90s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 3.2s ease-in-out infinite;transform-origin:110px 260px}
@keyframes bob{50%{transform:translateY(-3px) scaleY(1.008)}}
.shadow{animation:shadow 3.2s ease-in-out infinite;transform-origin:110px 262px}
@keyframes shadow{50%{transform:scaleX(.92);opacity:.5}}
.tail{transform-origin:139px 80px;animation:tail 3.2s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(7deg)}}
.scarf{transform-origin:122px 140px;animation:tail 2.6s ease-in-out infinite}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.orb{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
.orb.b{animation-duration:3.4s;animation-direction:reverse}
.armR{transform-origin:139px 148px;animation:armr 3.2s ease-in-out infinite}
@keyframes armr{50%{transform:rotate(-4deg)}}
.hero.jump .bob{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes jump{40%{transform:translateY(-22px)}}
.hero.cheer .bob{animation:cheer 1.2s ease-in-out}
@keyframes cheer{20%{transform:translateY(-26px) rotate(-4deg)}45%{transform:translateY(0) rotate(0)}65%{transform:translateY(-16px) rotate(4deg)}100%{transform:none}}
.mote{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--quant);box-shadow:0 0 8px var(--quant);opacity:0;animation:mote 6s linear infinite}
@keyframes mote{0%{opacity:0;transform:translateY(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-170px)}}
.speech{position:absolute;left:12px;top:12px;max-width:62%;background:#0d0f1ecc;border:1px solid var(--line2);border-radius:10px 10px 10px 2px;padding:7px 10px;font-size:13px;line-height:1.3;animation:fadein .4s}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.gain{position:absolute;font:700 18px var(--mono);color:var(--quant);text-shadow:0 0 10px var(--quant);pointer-events:none;animation:gain 1.2s ease-out forwards}
@keyframes gain{to{transform:translateY(-60px);opacity:0}}
.classline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:12px 16px 0}
.classline b{font:700 17px var(--display);color:var(--brass-hi)}
.classline span{font:500 12px var(--mono);color:var(--muted)}
.bars{display:grid;gap:9px;padding:12px 16px 4px}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{height:8px;border-radius:4px;background:#0a0c18;border:1px solid var(--line);overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:4px;transition:width .5s}
.bar output{font:500 11.5px var(--mono);color:var(--muted);text-align:right}
.radarwrap{padding:4px 16px 4px}
.radar{width:100%;max-width:340px;display:block;margin:0 auto;height:auto}
.radar text{font:600 10.5px var(--body);fill:var(--muted)}
.radar .lv{font:700 10px var(--mono);fill:var(--brass-hi)}
.equip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:6px 16px 16px}
.slot{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line2);background:#0f1224;display:grid;place-items:center;position:relative}
.slot svg{width:58%;height:58%}
.slot.relic{border-color:var(--brass);box-shadow:inset 0 0 14px #d8a85a33}
.slot .rg{font:400 26px/1 var(--display);color:var(--brass-hi)}
.slot.empty .rg{color:var(--line2)}
.slot:hover .tt,.slot:focus .tt{opacity:1}
.tt{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:#05060d;border:1px solid var(--line2);border-radius:6px;padding:4px 7px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:3}
.equiphead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 16px 0}

/* tabs */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:16px}
.tab{background:none;border:0;padding:10px 14px;font:700 15px var(--display);color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;min-height:44px;position:relative}
.tab[aria-selected="true"]{color:var(--brass-hi);border-bottom-color:var(--brass)}
.tab .pip{position:absolute;top:8px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--rose);box-shadow:0 0 8px var(--rose)}
.sec{display:grid;gap:12px;margin-bottom:22px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.sechead h2{font:700 19px var(--display)}
.sechead small{color:var(--muted);font-size:12.5px}

/* Беатрис */
.mentor{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:start;border-color:#d8a85a66;background:linear-gradient(135deg,#2a1d33,#1b1f3b 60%)}
.mentor .ava{width:96px;height:96px;border-radius:50%;border:2px solid var(--brass);overflow:hidden;background:#3a2547;flex:none}
.mentor .ava svg{width:100%;height:100%}
.voice{font:italic 500 18px/1.35 var(--voice);color:#f6e9d4}
.legend{display:grid;gap:10px;min-width:0}
.legend h3{font:700 20px/1.2 var(--display);color:var(--brass-hi)}
.legend .rarity{font:700 10.5px var(--mono);letter-spacing:.14em;color:var(--brass);text-transform:uppercase}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start}
.check{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line2);background:#0e1122;display:grid;place-items:center;padding:0;color:var(--void)}
.check[aria-pressed="true"]{background:var(--quant);border-color:var(--quant);box-shadow:0 0 10px #69e2d266}
.check.gold[aria-pressed="true"]{background:var(--brass);border-color:var(--brass)}
.steps li span{padding-top:5px;font-size:14px}
.steps li.done span{color:var(--muted);text-decoration:line-through;text-decoration-color:#9a9dbd88}
.prog{height:6px;border-radius:3px;background:#0a0c18;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-hi));transition:width .4s}
.btn{border:1px solid var(--brass);background:linear-gradient(180deg,#e6b968,#b9873c);color:#24170a;font-weight:700;border-radius:10px;padding:9px 16px;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:none;color:var(--brass-hi)}
.btn.teal{background:linear-gradient(180deg,#7ef0e0,#3fb4a6);border-color:var(--quant);color:#0b2422}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.letter{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px dashed var(--brass);border-radius:12px;background:#d8a85a10;cursor:pointer;width:100%;text-align:left;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px #d8a85a44}}
.letter svg{flex:none}
.letter b{font:700 16px var(--display);color:var(--brass-hi);display:block}

/* quest cards */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);align-content:start;position:relative}
.q .kind{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;grid-column:1/-1;display:flex;justify-content:space-between;gap:8px}
.q .kind em{font-style:normal;color:var(--muted);letter-spacing:.04em}
.q.morning .kind{color:#ffcf8a}.q.evening .kind{color:#b9a4ff}.q.week .kind{color:var(--rose)}.q.board .kind{color:var(--quant)}.q.goal .kind{color:var(--good)}
.q b{font-weight:600;font-size:15px;line-height:1.3}
.q small{grid-column:1/-1;color:var(--muted);font-size:13px;line-height:1.35}
.q .rw{font:700 13px var(--mono);color:var(--quant);white-space:nowrap;align-self:start}
.q .foot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px}
.q.done{border-color:#8fe29b55;background:linear-gradient(180deg,#18301f55,var(--panel))}
.q.done b{color:var(--muted)}
.q.locked{opacity:.55}
.skill-tag{font:600 11.5px var(--body);color:var(--muted);display:flex;gap:5px;align-items:center}
.skill-tag i{font-style:normal;color:var(--brass-hi)}
.qbtn{border:1px solid var(--line2);background:#0f1224;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13.5px;min-height:40px}
.qbtn:hover{border-color:var(--quant)}
.qbtn[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#0e2412}
.gprog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.gprog .prog i{background:var(--good)}

/* skills */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.sk{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;gap:8px;align-content:start}
.skhead{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center}
.rune{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--brass);display:grid;place-items:center;font:700 19px var(--display);color:var(--brass-hi);background:radial-gradient(circle,#2b2f5a,#14172b)}
.skhead b{font:700 16px var(--display);display:block}
.skhead small{color:var(--muted);font-size:12px}
.sklv{font:700 22px var(--display);color:var(--quant)}
.perks{display:flex;flex-wrap:wrap;gap:6px}
.perk{font-size:12px;border:1px solid var(--line2);border-radius:20px;padding:3px 9px;color:var(--muted)}
.perk.on{border-color:var(--brass);color:var(--brass-hi);background:#d8a85a14}
.feeds{font-size:12px;color:var(--muted)}

/* diary */
.daynav{display:flex;align-items:center;gap:8px}
.daynav b{font:700 16px var(--display);min-width:0}
.acts{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.act{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);min-height:60px}
.act:last-child{border-bottom:0}
.act .rune{width:34px;height:34px;font-size:15px}
.act b{font-weight:600;display:block}
.act small{color:var(--muted);font-size:12.5px;display:block;line-height:1.3}
.cnt{display:flex;align-items:center;gap:4px}
.cnt output{min-width:30px;text-align:center;font:700 17px var(--mono)}
.step{width:40px;height:40px;border-radius:9px;border:1px solid var(--line2);background:#0f1224;font-size:19px;font-weight:700;line-height:1;padding:0}
.step.plus{background:var(--quant);border-color:var(--quant);color:#0b2422}
.step:disabled{opacity:.3;cursor:default}
.step:not(:disabled):active{transform:scale(.93)}

/* inventory, chronicle */
.relics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.relic{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.relic .slot{width:52px}
.relic b{display:block;font:700 15px var(--display)}
.relic small{color:var(--muted);font-size:12.5px;line-height:1.3;display:block}
.relic.lock b{color:var(--muted)}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ware{padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;gap:10px}
.ware b{font-weight:600}
.ware .coin{font-size:17px}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.log li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:start;font-size:14px}
.log li:last-child{border-bottom:0}
.log time{font:500 11.5px var(--mono);color:var(--muted);white-space:nowrap;padding-top:2px}
.ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--mono);border:1px solid currentColor}
.k-xp{color:var(--quant)}.k-lv{color:var(--brass-hi)}.k-bea{color:var(--rose)}.k-quest{color:var(--good)}.k-info{color:var(--muted)}
.settings{display:grid;gap:12px;padding:16px}
.setrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.swatches{display:flex;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);padding:0}
.sw[aria-pressed="true"]{border-color:var(--brass-hi);box-shadow:0 0 0 2px var(--void),0 0 0 4px var(--brass)}
input[type=text]{background:#0f1224;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;min-height:42px}
.toggle{display:flex;gap:8px;align-items:center;min-height:40px}
.toggle input{width:20px;height:20px;accent-color:var(--quant)}
.empty{padding:18px;border:1px dashed var(--line2);border-radius:12px;color:var(--muted);text-align:center}

/* toasts */
#toasts{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:50;display:grid;gap:8px;width:min(340px,calc(100vw - 24px));pointer-events:none}
.toast{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#0b0d1ae8;border:1px solid var(--line2);box-shadow:0 10px 30px #0008;animation:tin .35s cubic-bezier(.2,1.4,.4,1);pointer-events:auto;backdrop-filter:blur(6px)}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
@keyframes tout{to{transform:translateX(30px);opacity:0}}
.toast .ico{width:32px;height:32px;font-size:14px}
.toast b{display:block;font:700 13.5px var(--display);letter-spacing:.02em}
.toast div span{font-size:13px;color:var(--muted);line-height:1.3;display:block}
.toast.lv{border-color:var(--brass)}.toast.bea{border-color:var(--rose)}

/* dialog (визуальная новелла) */
#dlg{position:fixed;inset:0;z-index:40;background:#05060de0;display:flex;align-items:flex-end;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadein .3s}
.scene{width:min(760px,100%);display:grid;justify-items:center;gap:0}
.scene .bust{width:min(250px,56vw);aspect-ratio:1;max-width:100%;margin-bottom:-24px;position:relative;z-index:1;animation:rise .5s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.scene .bust svg{width:100%;height:100%}
.box{width:100%;background:linear-gradient(180deg,#221a35f5,#141729f5);border:1px solid var(--brass);border-radius:16px;padding:22px 20px 16px;position:relative;box-shadow:0 0 40px #d8a85a22}
.nameplate{position:absolute;top:-15px;left:20px;background:var(--wine);border:1px solid var(--brass);border-radius:8px;padding:3px 12px;font:700 14px var(--display);color:var(--brass-hi);letter-spacing:.04em}
.box .voice{min-height:4.2em;font-size:20px}
.box .voice em{color:var(--muted);font-size:16px}
.box .next{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.box .hint{font:500 11px var(--mono);color:var(--muted);letter-spacing:.08em}
.caret{display:inline-block;width:8px;height:8px;border-right:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:rotate(45deg);margin-left:6px;animation:car 1s infinite}
@keyframes car{50%{transform:translateY(3px) rotate(45deg)}}
.reward{display:flex;gap:12px;align-items:center;background:#d8a85a14;border:1px solid #d8a85a66;border-radius:10px;padding:10px 12px;margin-top:10px}

/* level up */
#lvl{position:fixed;inset:0;z-index:45;display:grid;place-items:center;background:#05060dd9;padding-inline:16px;animation:fadein .3s}
#lvl .inner{display:grid;justify-items:center;gap:10px;text-align:center;position:relative}
#lvl .rays{position:absolute;width:520px;height:520px;max-width:100vw;left:50%;top:50%;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,#d8a85a2a 0 8deg,transparent 8deg 22deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 18s linear infinite}
#lvl .big{font:700 clamp(46px,12vw,86px)/1 var(--display);color:var(--brass-hi);text-shadow:0 0 30px #d8a85a99;position:relative;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
#lvl .eyebrow{position:relative;font-size:13px}
#lvl p{position:relative;max-width:36ch;margin:0}
#lvl .btn{position:relative;margin-top:8px}
@keyframes pop{from{transform:scale(.4);opacity:0}}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100vw);z-index:35;background:#0f1224f7;border-left:1px solid var(--line2);padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 16px;overflow-y:auto;animation:slide .3s cubic-bezier(.2,1,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
#drawer .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:920px){.radarwrap,.equiphead,.equip{display:none}.herocard{padding-bottom:12px}}
@media (max-width:480px){.stage{height:250px}.who h1{font-size:18px}.box .voice{font-size:18px}.mentor{grid-template-columns:64px minmax(0,1fr)}.mentor .ava{width:64px;height:64px}}

/* ================= Утилиты ================= */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7;
const monday=s=>addDays(s,-dow(s));
const today=()=>iso(new Date());
const longDate=s=>parse(s).toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural=(n,a,b,c)=>{const m=Math.abs(n)%100,k=m%10;if(m>10&&m<20)return c;if(k===1)return a;if(k>=2&&k<=4)return b;return c};
const seeded=(arr,seed)=>arr.map(x=>[hash(seed+'|'+(x.id||x.t)),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const hourNow=()=>new Date().getHours();
const timeStr=ts=>{const d=new Date(ts);return d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'})+' '+pad(d.getHours())+':'+pad(d.getMinutes())};

/* ================= Расчёты (всё выводится из записей, поэтому любую отметку можно отменить) ================= */
const charNeed=l=>120+60*(l-1);
const skillNeed=l=>40+25*(l-1);
function lvlOf(xp,needFn){let l=1,x=xp;while(x>=needFn(l)){x-=needFn(l);l++}return{l,into:x,need:needFn(l)}}
function dayGoals(d){const order=seeded(GOALS,'g'+d);const g=order.slice(0,3);if(dow(d)===5)g[2]=SAT_GOAL;return g}
function goalProg(g,a){let cur=0,max=0,ok=true;g.p.forEach(([ids,n])=>{const c=ids.reduce((s,i)=>s+(+a[i]||0),0);cur+=Math.min(c,n);max+=n;if(c<n)ok=false});return{cur,max,ok}}
function morningQ(d){return QM[hash('m'+d)%QM.length]}
function eveningQ(d){return QE[hash('e'+d)%QE.length]}
function weekQs(m){const o=seeded(QW,'w'+m);return o.slice(0,2)}
function boardOpen(){const done=new Set(S.board.map(b=>b.id));let open=seeded(QB,'board').filter(q=>!done.has(q.id));if(!open.length)open=seeded(QB,'board2');return open.slice(0,6)}
function calc(){
  const sk={};SK_ORDER.forEach(k=>sk[k]=0);let xp=0;const goalsMet={};const byDay={};
  const add=(pts,s,d)=>{xp+=pts;sk[s]=(sk[s]||0)+pts;if(d)byDay[d]=(byDay[d]||0)+pts};
  for(const[d,day]of Object.entries(S.days)){
    const a=day.acts||{};
    for(const[id,c]of Object.entries(a)){const A=ACT[id];if(A&&c>0)add(A.pts*c,A.s,d)}
    for(const id of Object.keys(day.q||{})){if(day.q[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,d)}
    dayGoals(d).forEach((g,i)=>{if(goalProg(g,a).ok){add(g.b,g.s,d);goalsMet[d+'#'+i]=g}});
  }
  for(const[m,w]of Object.entries(S.weeks))for(const id of Object.keys(w)){if(w[id]&&AQ[id])add(AQ[id].pts,AQ[id].s,null)}
  S.board.forEach(b=>{const q=AQ[b.id];if(q)add(q.pts,q.s,b.date)});
  S.bea.done.forEach(b=>{const c=CH[b.id];if(!c)return;const per=Math.round(c.xp/c.sk.length);c.sk.forEach(s=>add(per,s,b.date))});
  const spent=S.buys.reduce((s,b)=>s+b.cost,0);
  return{xp,sk,coins:xp-spent,goalsMet,byDay};
}
function streak(byDay){let n=0,d=today();if(!(byDay[d]>=20))d=addDays(d,-1);while((byDay[d]||0)>=20){n++;d=addDays(d,-1)}return n}
const titleOf=l=>{let t=TITLES[0][1];TITLES.forEach(([lv,n])=>{if(l>=lv)t=n});return t};
const perksAt=(k,l)=>SKILLS[k].perks.filter(p=>l>=p[0]);

/* ================= Звук ================= */
let AC=null;
function chime(notes,dur=.12){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=AC.currentTime+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*2.2);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur*2.4)})}catch(e){}}

/* ================= Уведомления ================= */
const KIND_ICON={xp:'+',lv:'★',bea:'Б',quest:'✓',info:'i'};
function notify(kind,title,text,{log=true,sticky=false}={}){
  const box=document.getElementById('toasts');
  const el=document.createElement('div');el.className='toast '+kind;
  el.innerHTML=`<span class="ico k-${kind}">${KIND_ICON[kind]||'•'}</span><div><b>${esc(title)}</b>${text?`<span>${esc(text)}</span>`:''}</div>`;
  box.prepend(el);while(box.children.length>4)box.lastChild.remove();
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),320)},sticky?6500:3800);
  el.onclick=()=>el.remove();
  if(log){S.log.unshift({k:kind,t:title,x:text||'',ts:Date.now()});S.log=S.log.slice(0,150);if(!drawerOpen)S.unread=(S.unread||0)+1}
}

/* ================= Изменения с последствиями ================= */
function act(mutator,{x,y}={}){
  const before=calc();
  mutator();
  const after=calc();
  persist();
  const gained=after.xp-before.xp;
  // цели дня
  Object.keys(after.goalsMet).forEach(k=>{if(!before.goalsMet[k]){const g=after.goalsMet[k];notify('quest','Цель дня выполнена',g.t+' · +'+g.b+' опыта');chime([660,880,1100])}});
  // навыки
  const lvUps=[];
  SK_ORDER.forEach(k=>{const a=lvlOf(before.sk[k],skillNeed).l,b=lvlOf(after.sk[k],skillNeed).l;if(b>a){notify('lv',SKILLS[k].n+': уровень '+b,'Навык вырос');perksAt(k,b).filter(p=>p[0]>a).forEach(p=>notify('lv','Новое умение: '+p[1],SKILLS[k].n));lvUps.push(k)}});
  const la=lvlOf(before.xp,charNeed).l,lb=lvlOf(after.xp,charNeed).l;
  renderAll();
  if(gained>0){heroAnim('jump');floatGain('+'+gained,x,y);if(!lvUps.length&&lb===la)chime([523,784])}
  if(lvUps.length&&lb===la)chime([523,659,784,1046],.1);
  if(lb>la)setTimeout(()=>levelUp(lb,la),300);
}
function heroAnim(c){const h=document.querySelector('svg.hero');if(!h)return;h.classList.remove('jump','cheer');void h.getBoundingClientRect();h.classList.add(c);setTimeout(()=>h.classList.remove(c),1300)}
function floatGain(t,x,y){const st=document.querySelector('.stage');if(!st)return;const r=st.getBoundingClientRect();const el=document.createElement('div');el.className='gain';el.textContent=t;el.style.left=(r.width/2+(Math.random()*60-30))+'px';el.style.top=(r.height*0.35)+'px';st.appendChild(el);setTimeout(()=>el.remove(),1200)}
function levelUp(l,prev){
  const t=titleOf(l),tp=titleOf(prev);
  notify('lv','Уровень '+l+'!',t!==tp?'Новый титул: '+t:'Опыт растёт',{sticky:true});
  chime([523,659,784,1046,1318],.13);heroAnim('cheer');
  const el=document.getElementById('lvl');
  el.innerHTML=`<div class="inner" role="dialog" aria-label="Новый уровень"><div class="rays"></div><div class="eyebrow">Новый уровень</div><div class="big">${l}</div>${t!==tp?`<p><b style="color:var(--brass-hi)">Новый титул: ${esc(t)}</b></p>`:''}<p class="voice">«${esc(BEA_LV[l%BEA_LV.length])}» — Беатрис</p><button class="btn" data-act="closelvl">Дальше</button></div>`;
  el.hidden=false;el.querySelector('button').focus();
}

function radar(C){
  const cx=170,cy=125,R=78,n=SK_ORDER.length;
  const lv=SK_ORDER.map(k=>lvlOf(C.sk[k],skillNeed));
  const maxL=Math.max(5,...lv.map(x=>x.l+x.into/x.need));
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  let g='';[.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${SK_ORDER.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="#2c3360"/>`});
  SK_ORDER.forEach((_,i)=>{const[x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2c3360"/>`});
  const poly=SK_ORDER.map((k,i)=>pt(i,R*Math.max(.06,(lv[i].l-1+lv[i].into/lv[i].need)/ (maxL-1||1))).join(',')).join(' ');
  let labels='';SK_ORDER.forEach((k,i)=>{const[x,y]=pt(i,R+20);const anc=Math.abs(x-cx)<8?'middle':x>cx?'start':'end';labels+=`<text x="${x}" y="${y+3}" text-anchor="${anc}">${SKILLS[k].n} <tspan class="lv">${lv[i].l}</tspan></text>`});
  return `<svg class="radar" viewBox="0 0 340 250" role="img" aria-label="Навыки: ${SK_ORDER.map((k,i)=>SKILLS[k].n+' '+lv[i].l).join(', ')}">${g}<polygon points="${poly}" fill="#69e2d2" fill-opacity=".22" stroke="#69e2d2" stroke-width="2"/>${labels}</svg>`;
}

function pickSpeech(C){
  const d=today(),a=(S.days[d]||{}).acts||{};

  if(!tot)return hourNow()<12?'Утро! С чего начнём?':'Ещё ни одного опыта сегодня. Одна задача?';
  if(tot>=80)return 'Сегодня я в ударе!';
  if((a.phys||0)+(a.math||0)>=5)return 'Формулы так и щёлкают.';
  if((a.bike||0)+(a.skate||0))return 'Ветер в волосах, задачи в голове.';

}
function vDiary(C){
  const d=view,day=S.days[d]||{},a=day.acts||{},t=today();
  const min=addDays(t,-6);
  return `<section class="sec"><div class="sechead"><div class="daynav"><button class="step" data-act="day" data-n="-1" ${d<=min?'disabled':''} aria-label="Предыдущий день">‹</button><b>${d===t?'Сегодня, ':''}${esc(longDate(d))}</b><button class="step" data-act="day" data-n="1" ${d>=t?'disabled':''} aria-label="Следующий день">›</button></div><small>за день: +${C.byDay[d]||0} опыта</small></div>
  <div class="acts">${ACTIONS.map(A=>{const v=+a[A.id]||0;return `<div class="act"><span class="rune sym">${SKILLS[A.s].g}</span><div><b>${esc(A.n)} <span class="muted" style="font:500 12px var(--mono)">+${A.pts}</span></b><small>${esc(A.d)}${A.d?' · ':''}${SKILLS[A.s].n}</small></div>
   ${A.k==='count'?`<div class="cnt"><button class="step" data-act="cnt" data-id="${A.id}" data-n="-1" ${v?'':'disabled'} aria-label="Убрать: ${esc(A.n)}">−</button><output>${v}</output><button class="step plus" data-act="cnt" data-id="${A.id}" data-n="1" aria-label="Добавить: ${esc(A.n)}">+</button></div>`
   :`<button class="check" style="width:44px;height:44px" aria-pressed="${!!v}" aria-label="${esc(A.n)}" data-act="tog" data-id="${A.id}">${v?'✓':''}</button>`}</div>`}).join('')}</div></section>`;
}
function vBag(C){
  const done=S.bea.done.map(b=>b.id);
  return `<section class="sec"><div class="sechead"><h2>Реликвии Беатрис</h2><small>${done.length} из ${CHAINS.length}</small></div>
  <div class="relics">${CHAINS.map(c=>{const got=done.includes(c.id);return `<div class="relic ${got?'':'lock'}"><div class="slot ${got?'relic':'empty'}"><span class="rg sym">${got?c.relic[0]:'?'}</span></div><div><b>${got?esc(c.relic[1]):'Не найдена'}</b><small>${got?esc(c.relic[2])+' · за «'+esc(c.t)+'»':'Награда за легендарный квест'}</small></div></div>`}).join('')}</div></section>
  <section class="sec"><div class="sechead"><h2>Лавка наград</h2><span class="coin"><i></i>${C.coins} квантов</span></div>
  <div class="shop">${REWARDS.map(([id,n,cost])=>{const cnt=S.buys.filter(b=>b.id===id).length;return `<div class="ware"><b>${esc(n)}</b><span class="coin"><i></i>${cost}</span><button class="btn teal" data-act="buy" data-id="${id}" ${C.coins<cost?'disabled':''}>${C.coins<cost?'Нужно ещё '+(cost-C.coins):'Получить'}</button>${cnt?`<small class="muted">Получено ${cnt} раз${cnt%10>=2&&cnt%10<=4&&(cnt<10||cnt>20)?'а':''}</small>`:''}</div>`}).join('')}</div>
  ${S.buys.length?`<div class="btnrow"><button class="btn ghost" data-act="unbuy">Отменить последнюю покупку</button></div>`:''}</section>`;
}
function vChron(C){
  const quests=[];
  for(const[d,day]of Object.entries(S.days))for(const id of Object.keys(day.q||{}))if(day.q[id]&&AQ[id])quests.push([d,AQ[id]]);
  for(const[m,w]of Object.entries(S.weeks))for(const id of Object.keys(w))if(w[id]&&AQ[id])quests.push([m,AQ[id]]);
  S.board.forEach(b=>AQ[b.id]&&quests.push([b.date,AQ[b.id],b]));
  quests.sort((a,b)=>a[0]<b[0]?1:-1);
  return `<section class="sec"><div class="sechead"><h2>Журнал приключений</h2><small>${quests.length} ${plural(quests.length,'квест','квеста','квестов')} · ${S.bea.done.length} ${plural(S.bea.done.length,'легенда','легенды','легенд')}</small></div>
   ${S.bea.done.length?`<ul class="log">${S.bea.done.slice().reverse().map(b=>`<li><span class="ico k-bea">Б</span><div><b>${esc(CH[b.id].t)}</b><br><small class="muted">Легендарный квест · ${esc(CH[b.id].relic[1])}</small></div><time>${esc(b.date)}</time></li>`).join('')}</ul>`:''}
   ${quests.length?`<ul class="log">${quests.slice(0,40).map(([d,q,b])=>`<li><span class="ico k-quest">✓</span><div><b>${esc(q.t)}</b><br><small class="muted">${({qm:'Утренний',qe:'Вечерний',qw:'Недельный',qb:'Доска'})[q.kind]} · +${q.pts}${b?` · <button class="qbtn" style="min-height:30px;padding:2px 8px;font-size:12px" data-act="unboard" data-id="${q.id}">Отменить</button>`:''}</small></div><time>${esc(d)}</time></li>`).join('')}</ul>`:'<div class="empty">Здесь появятся выполненные квесты. Начни с утреннего на вкладке «Квесты».</div>'}
  </section>
  <section class="sec"><div class="sechead"><h2>Настройки героини</h2></div>
   <div class="panel settings">
    <div class="setrow"><label for="nm">Имя</label><input id="nm" type="text" value="${esc(S.name)}" maxlength="24" data-act="name"></div>
    <div class="setrow"><span>Цвет волос</span><div class="swatches">${['#4a2f22','#1d1820','#a0522d','#d9b26a','#7a2f4a'].map(c=>`<button class="sw" style="background:${c}" aria-label="Цвет волос" aria-pressed="${S.hair===c}" data-act="hair" data-c="${c}"></button>`).join('')}</div></div>
    <label class="toggle"><input id="snd" type="checkbox" ${S.sound?'checked':''} data-act="sound"> Звуки уведомлений</label>
    <small class="muted">${dbRef?'Прогресс сохраняется в твоём аккаунте и виден на всех устройствах.':'Прогресс сохраняется в этом браузере.'}</small>
   </div></section>`;
}
function renderDrawer(){
  const el=document.getElementById('drawer');
  if(!drawerOpen){el.hidden=true;return}
  el.hidden=false;
  el.innerHTML=`<div class="head"><h2 style="font:700 20px var(--display)">Уведомления</h2><button class="iconbtn" data-act="drawer" aria-label="Закрыть">✕</button></div>
  ${S.log.length?`<ul class="log">${S.log.slice(0,60).map(n=>`<li><span class="ico k-${n.k}">${KIND_ICON[n.k]||'•'}</span><div><b>${esc(n.t)}</b>${n.x?`<br><small class="muted">${esc(n.x)}</small>`:''}</div><time>${esc(timeStr(n.ts))}</time></li>`).join('')}</ul>`:'<div class="empty">Пока тихо. Уведомления о квестах, уровнях и письмах Беатрис появятся здесь.</div>'}`;
}
function renderAll(){const C=calc();document.documentElement.style.setProperty('--hair',S.hair);renderHud(C);renderHero(C);renderContent(C);renderDrawer()}

/* ================= Диалог с Беатрис ================= */
let D=null,typer=null;
function openDialog(lines,choices){D={lines,i:0,choices,shown:false};showLine()}
function showLine(){
  const el=document.getElementById('dlg');el.hidden=false;
  const line=D.lines[D.i],last=D.i===D.lines.length-1;
  el.innerHTML=`<div class="scene" role="dialog" aria-label="Разговор с Беатрис"><div class="bust">${beaSVG()}</div>
   <div class="box"><span class="nameplate">Беатрис</span><p class="voice" id="vtext" aria-live="polite"></p>
   ${last&&D.reward?D.reward:''}
   <div class="next">${last?`<div class="btnrow">${D.choices.map((c,i)=>`<button class="btn ${c.ghost?'ghost':''}" data-act="choice" data-i="${i}">${esc(c.t)}</button>`).join('')}</div>`:`<span class="hint">нажми, чтобы продолжить</span><button class="btn ghost" data-act="dnext">Дальше<span class="caret"></span></button>`}</div></div></div>`;
  const t=document.getElementById('vtext');let k=0;clearInterval(typer);D.typing=true;
  const full=line;
  typer=setInterval(()=>{k+=2;t.textContent=full.slice(0,k);if(k>=full.length){clearInterval(typer);D.typing=false}},22);
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){clearInterval(typer);t.textContent=full;D.typing=false}
  const b=el.querySelector('.btn');b&&b.focus({preventScroll:true});
}
function dlgNext(){if(!D)return;if(D.typing){clearInterval(typer);document.getElementById('vtext').textContent=D.lines[D.i];D.typing=false;return}if(D.i<D.lines.length-1){D.i++;showLine()}}
function closeDialog(){clearInterval(typer);D=null;const el=document.getElementById('dlg');el.hidden=true;el.innerHTML=''}
function beaOpen(){
  const c=beaNext();if(!c)return;
  const lines=[];
  if(!S.bea.met)lines.push('Анна! Проходи, проходи. Я Беатрис. Сорок лет преподавала литературу и историю, а теперь вот учу тебя… или учусь у тебя, посмотрим.','Ты занимаешься физикой. Прекрасно. Но знаешь, все великие открытия кто-то когда-то описал словами. Я буду давать тебе задания на стыке наших миров.','Это не обычные квесты. Легендарные. Каждый в несколько шагов, и за каждый — реликвия из моей коллекции.');
  lines.push(...c.intro);
  chime([392,494,587]);
  openDialog(lines,[{t:'Принять задание',f:()=>{act(()=>{S.bea.cur=c.id;S.bea.met=true;S.bea.steps[c.id]=[]});notify('bea','Новый легендарный квест',c.t);closeDialog()}},{t:'Позже',ghost:true,f:()=>{if(!S.bea.met){S.bea.met=true;persist()}closeDialog()}}]);
}
function beaTalk(){
  const c=CH[S.bea.cur];if(!c)return;
  const st=S.bea.steps[c.id]||[],n=c.steps.filter((_,i)=>st[i]).length,next=c.steps.find((_,i)=>!st[i]);
  const lines=[n?`Уже ${n} из ${c.steps.length}. Я вижу, ты не торопишься, и это правильно.`:'Не знаешь, с чего начать? Начни с чтения. Всё начинается с чтения.'];
  if(next)lines.push('Следующий шаг: «'+next+'». Возьми чай и садись.');
  openDialog(lines,[{t:'Спасибо, Беатрис',f:closeDialog}]);
}
function beaTurnIn(){
  const c=CH[S.bea.cur];if(!c||!beaReady())return;
  D=null;
  openDialog(c.outro.slice(),[{t:'Принять реликвию',f:()=>{
    closeDialog();
    act(()=>{S.bea.done.push({id:c.id,date:today()});S.bea.cur=null;S.bea.nextAt=addDays(today(),1)});
    notify('bea','Легенда завершена: '+c.t,'+'+c.xp+' опыта · реликвия «'+c.relic[1]+'»',{sticky:true});
    chime([523,659,784,1046,1318],.12);heroAnim('cheer');
  }}]);
  D.reward=`<div class="reward"><div class="slot relic" style="width:52px;flex:none"><span class="rg sym">${c.relic[0]}</span></div><div><b style="font:700 16px var(--display);color:var(--brass-hi)">${esc(c.relic[1])}</b><br><small class="muted">+${c.xp} опыта · ${c.sk.map(k=>SKILLS[k].n).join(', ')}</small></div></div>`;
  showLine();
}

/* ================= События ================= */
const dayObj=d=>(S.days[d]=S.days[d]||{acts:{},q:{}},S.days[d].acts=S.days[d].acts||{},S.days[d].q=S.days[d].q||{},S.days[d]);
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');
  if(!b){if(D&&ev.target.closest('#dlg .box'))dlgNext();return}
  const a=b.dataset.act,pt={x:ev.clientX,y:ev.clientY};
  if(a==='tab'){tab=b.dataset.tab;try{localStorage.setItem(LS+'-tab',tab)}catch(e){}renderAll();if(window.innerWidth<920)document.getElementById('content').scrollIntoView({behavior:'smooth',block:'start'})}
  else if(a==='cnt'){const id=b.dataset.id,n=+b.dataset.n;act(()=>{const d=dayObj(view);d.acts[id]=Math.max(0,(+d.acts[id]||0)+n)},pt)}
  else if(a==='tog'){const id=b.dataset.id;act(()=>{const d=dayObj(view);d.acts[id]=d.acts[id]?0:1},pt)}
  else if(a==='day'){view=addDays(view,+b.dataset.n);renderAll()}
  else if(a==='dq'){const id=b.dataset.id,d=today();const on=!(S.days[d]&&S.days[d].q&&S.days[d].q[id]);act(()=>{const o=dayObj(d);if(on)o.q[id]=true;else delete o.q[id]},pt);if(on)notify('quest','Квест выполнен',AQ[id].t+' · +'+AQ[id].pts)}
  else if(a==='wq'){const id=b.dataset.id,m=monday(today());const on=!((S.weeks[m]||{})[id]);act(()=>{S.weeks[m]=S.weeks[m]||{};if(on)S.weeks[m][id]=true;else delete S.weeks[m][id]},pt);if(on)notify('quest','Квест недели выполнен',AQ[id].t+' · +'+AQ[id].pts)}
  else if(a==='bq'){const id=b.dataset.id;act(()=>{S.board.push({id,date:today()})},pt);notify('quest','Задание с доски выполнено',AQ[id].t+' · +'+AQ[id].pts);const nq=boardOpen()[5];if(nq)setTimeout(()=>notify('info','На доске новое задание',nq.t),700)}
  else if(a==='unboard'){const id=b.dataset.id;act(()=>{const i=S.board.map(x=>x.id).lastIndexOf(id);if(i>=0)S.board.splice(i,1)})}
  else if(a==='step'){const c=CH[S.bea.cur];if(!c)return;const i=+b.dataset.i;act(()=>{const st=S.bea.steps[c.id]=S.bea.steps[c.id]||[];st[i]=!st[i]});if(beaReady()){notify('bea','Все шаги пройдены','Беатрис ждёт твоего рассказа',{sticky:true});chime([587,740,880])}}
  else if(a==='beaopen')beaOpen();
  else if(a==='beatalk')beaTalk();
  else if(a==='beaturnin')beaTurnIn();
  else if(a==='dnext')dlgNext();
  else if(a==='choice'){const c=D&&D.choices[+b.dataset.i];c&&c.f()}
  else if(a==='closelvl'){document.getElementById('lvl').hidden=true}
  else if(a==='drawer'){drawerOpen=!drawerOpen;if(drawerOpen){S.unread=0;persist()}renderAll()}
  else if(a==='buy'){const r=REWARDS.find(x=>x[0]===b.dataset.id);const C=calc();if(!r||C.coins<r[2])return;S.buys.push({id:r[0],cost:r[2],date:today()});persist();notify('info','Награда получена',r[1]+' · −'+r[2]+' квантов');chime([784,659]);renderAll()}
  else if(a==='unbuy'){const r=S.buys.pop();persist();if(r)notify('info','Покупка отменена','Кванты вернулись',{log:false});renderAll()}
  else if(a==='hair'){S.hair=b.dataset.c;persist();renderAll();heroAnim('jump')}
});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.act==='name'){S.name=t.value.trim().slice(0,24)||'Анна';persist();renderAll()}else if(t.dataset.act==='sound'){S.sound=t.checked;persist()}});
document.addEventListener('keydown',ev=>{
  if(D&&(ev.key===' '||ev.key==='Enter')&&!ev.target.closest('button')){ev.preventDefault();dlgNext()}
  if(ev.key==='Escape'){if(!document.getElementById('lvl').hidden)document.getElementById('lvl').hidden=true;else if(drawerOpen){drawerOpen=false;renderAll()}}
});

/* ================= Время: вечерние квесты, письма ================= */
function tick(){
  const d=today();
  if(view>d||view<addDays(d,-6))view=d;
  if(hourNow()>=EVENING_H&&!S.seenEve[d]){S.seenEve={[d]:true};persist();const e=eveningQ(d);notify('quest','Вечерний квест открыт',e.t,{sticky:true});chime([440,554,659]);renderAll()}
  if(S.letterDay!==d&&beaAvailable()&&S.bea.met){S.letterDay=d;persist();notify('bea','Письмо от Беатрис','У неё новое легендарное задание. Загляни на вкладку «Квесты»',{sticky:true});renderAll()}
}
renderAll();
setTimeout(()=>{if(!S.bea.met&&!S.log.length)notify('bea','Тебе письмо','Наставница Беатрис хочет познакомиться',{sticky:true});else tick();renderHud(calc())},900);
setInterval(tick,60000);
initRemote();
</script>
